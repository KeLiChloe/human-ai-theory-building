": 0.8405}, {"source": "student-38", "target": "student-49", "similarity": 0.858}, {"source": "student-38", "target": "student-51", "similarity": 0.8454}, {"source": "student-38", "target": "student-55", "similarity": 0.8567}, {"source": "student-39", "target": "student-51", "similarity": 0.8293}, {"source": "student-41", "target": "student-44", "similarity": 0.8344}, {"source": "student-41", "target": "student-50", "similarity": 0.8593}, {"source": "student-41", "target": "student-51", "similarity": 0.882}, {"source": "student-44", "target": "student-51", "similarity": 0.8664}, {"source": "student-44", "target": "student-56", "similarity": 0.8485}, {"source": "student-44", "target": "student-58", "similarity": 0.8276}, {"source": "student-44", "target": "student-59", "similarity": 0.8355}, {"source": "student-48", "target": "student-50", "similarity": 0.8362}, {"source": "student-49", "target": "student-51", "similarity": 0.8947}, {"source": "student-49", "target": "student-56", "similarity": 0.8607}, {"source": "student-50", "target": "student-51", "similarity": 0.8492}, {"source": "student-50", "target": "student-56", "similarity": 0.8433}, {"source": "student-51", "target": "student-56", "similarity": 0.8922}, {"source": "student-51", "target": "student-59", "similarity": 0.8383}, {"source": "student-54", "target": "student-56", "similarity": 0.8355}, {"source": "student-56", "target": "student-59", "similarity": 0.8521}]}, {"id": "senior", "title": "Senior Scientists (n=13)", "color": "#F4A261", "nodes": [{"id": "senior-0", "name": "senior_contributor_zi680", "x": 0.2236065570186076, "y": 0.6403283210027517, "degree": 3, "words": 241, "explanation": "Whether a paper discusses gender inequality is driven mainly by the discipline it sits in, the gender composition of the author team, and the extent to which inequality is already on the academic agenda at that time. Social science is positively related to discussing gender inequality because gender is a core topic in many social science domains, and these fields also have norms that make it more expected and legitimate to explicitly name social categories and analyze group differences. Natural science is negatively related to discussing gender inequality because the central research questions and writing conventions there often do not require discussing social categories explicitly, even when gender is relevant. Female_score is positively related because gender is an important predictor: when there are more women on the team, gender is more likely to be treated as theoretically meaningful both because of interest and because teams with more women may be more willing to frame questions in terms of inequality. Asian is positively related because who is more likely to study gender inequality may be tied to different minority or non-majority experiences and contexts, or to where in academia certain author groups are concentrated, which then shapes topic selection and framing. Finally, paper_inequality_mentions_3_years is positively related because agenda-setting within academia is important: when a larger share of recent papers are already addressing inequality, gender inequality becomes more top-of-mind and more publishable as an explicit framing, so more new papers will discuss it."}, {"id": "senior-1", "name": "senior_contributor_tjek9", "x": 0.47914932085245965, "y": 0.6848726081271219, "degree": 1, "words": 159, "explanation": "Of the disciplines listed, the vast majority of the gender inequality papers will be in the social sciences, meaning that variable would be strongly associated with whether a paper mentions gender inequality. Likewise, because nearly none of the natural science papers will mention gender inequality, natural science would be a strong negative predictor. These predictions are derived from the theory that gender inequality is relevant to the social sciences and not relevant to the natural sciences, and also that the people studying gender inequality are in the social sciences and therefor publish there. Social science provides the most information about whether the paper is about gender; if a paper is not in the social sciences it almost definitely is not about gender inequality. Finally, because being a woman may lead someone to be interested in questions around gender inequality, on the basis of experiencing this issue more directly, it would make them more likely to publish on this topic."}, {"id": "senior-2", "name": "senior_contributor_mkvct", "x": 0.7656773924727923, "y": 0.37236251911165713, "degree": 0, "words": 78, "explanation": "Gender is most likely to be studied by social scientists and least by STEM (hence the whole sub-field). Females are more likely to focus on inequality in research than males. Autoregressive trends are likely most relevant to predict likelihood of fashions to persist, with general interest (newsworthiness) being another attractor to the study of a particular subject. Asian-background scholars may be drawn to gender inequality, though this is confounded with most of them (in social sciences) being female."}, {"id": "senior-3", "name": "senior_contributor_jakh3", "x": 0.1069755721426709, "y": 0.3275822782047904, "degree": 0, "words": 145, "explanation": "Social science journals are more likely to publish articles on gender inequality, especially if the authors are female. STEM fields are dominated by men, which could predict an opportunity for women to publish on gender inequality issues, but the nature of the topics published in these journals do not lend to inequality discussion as social science journals do, so other field journals should be less likely to do so. Women, and especially white women, identify with gender inequality and are more likely to seek to publish on gender inequality issues. Number of authors should be loosely tied to more likelihood as research teams who study in this area may wish to increase the number of voices to improve publication odds. The more ideas are available for scholars to observe, as through more published research, the more motivation to explore gender inequality and publish on it."}, {"id": "senior-4", "name": "senior_contributor_unrjy", "x": 0.08, "y": 0.690575843873878, "degree": 1, "words": 233, "explanation": "Whether gender is discussed in a research paper is a function of how politically liberal the authors are and how aware and motivated the authors are to discuss such topics. Social sciences are generally more left-leaning with a large share of liberal authors, which will make it more likely that gender inequality would be discussed as a topic explicitly. Similarly, if at least one female author is included, gender inequality is more likely to be discussed, as opposed to an all-male author team, and this may still increase the more female authors are part of the team. The biggest \"jumps\" in likelihood would be where you go from no female authors to one female author, and then also where you go from only one male author to all female authors. Motivation would come from being part of a disadvantaged group, such as being female or Asian, and awareness would come from academic discourse ongoing on these topics. For the news and paper mentions, if the academic and public discourse has been around gender lately, i.e., in the last 3 years, academics are more likely to work on such topics or may be asked by the review team to incorporate such framing. For white, generally if an author is white then mentions of inequality related topics, including gender, would be less likely either because they are less motivated to frame the paper around inequality."}, {"id": "senior-5", "name": "senior_contributor_ogh5x", "x": 0.9199999999999999, "y": 0.9199999999999999, "degree": 0, "words": 28, "explanation": "Social science cares about social phenomena. Engineering and technology would be expected to have the least inequality discourse. Beyond these predictor-specific hunches, I don't really have a theory."}, {"id": "senior-6", "name": "senior_contributor_ecdev", "x": 0.6147019584812946, "y": 0.4268290096025306, "degree": 0, "words": 150, "explanation": "Social sciences seem to study these topics more than other disciplines--even \"gender inequality\" in STEM likely gets published in social science journals more than STEM journals because the question itself is more of a social science question. The opposite side of that would be that natural sciences study these topics less. Women likely care more about gender inequality because they feel more affected by it. And generally, hot topics in the media and academia likely cause more study of those topics because people want to study things that will get them attention (i.e., people copy successful topics/papers). I do not have an explanation for why Asian scholars would be more likely to study gender inequality. Maybe Asian scholars or Asian journals follow trendy topics more? Or perhaps Asians are more interested because they are more quant tilted and women are more underrepresented in quant tilted areas? I am just guessing."}, {"id": "senior-7", "name": "senior_contributor_mxspa", "x": 0.3445667172810936, "y": 0.704621795508221, "degree": 2, "words": 258, "explanation": "Social science is the strongest positive predictor of whether a paper discusses gender inequality because the topic is fundamentally a social phenomenon and the keywords given are almost exclusively studied within disciplines like sociology, political science, economics, and psychology. Natural science negatively predicts whether a paper discusses gender inequality, perhaps because the sociological framing of the keyword list works against natural science papers. While natural science — particularly medicine and biology — does engage with gender-related topics such as sex differences in health outcomes, the keyword list used to classify papers as discussing gender inequality is heavily sociological in framing, comprising terms like \"patriarchy,\" \"feminist,\" \"gender-based violence,\" and \"mansplaining\". Knowing the natural sciences a bit, those terms would almost never appear in those abstracts. Paper inequality mentions positively predict gender inequality discussion because inequality mentions reflect academic field momentum: when inequality is already elevated within the literature, individual researchers are more likely to engage with it. Female author share also positively predicts gender inequality discussion, reflecting well-documented own-group research effects whereby female scholars are more likely to study topics directly relevant to their own experiences. I’d expect this effect to be conditional on being within social science, where the discipline supports the topics listed in the keywords; outside social science, higher female author share may add little predictive power. Asian author share is also a positive predictor, with the same minority visibility explanation as in the racial inequality case. News inequality mentions are not a standalone main effect, but potentially may still operate through interaction with social science."}, {"id": "senior-8", "name": "senior_contributor_h1ror", "x": 0.350709181272728, "y": 0.28554881218434897, "degree": 0, "words": 84, "explanation": "Discipline is the primary predictor of the subject matter of the article, with gender inequality being a topic of study in the social sciences to a much larger extent than in the natural sciences. Women are more highly represented among authors of gender inequality papers, because inequality is generally congruent with female stereotypes, and because they are directly concerned by the subject matter. Finally, increased academic interest in gender issues may motivate other (male) authors to investigate gender effects in their area of study."}, {"id": "senior-9", "name": "senior_contributor_uhvrz", "x": 0.6312342605281728, "y": 0.08, "degree": 0, "words": 94, "explanation": "Gender bias is a topic that touches all scientific disciplines, but it seems most relevant to the social sciences. The mention of inequality within a given subject area correlates to the \"trendiness\" of a topic, which has an disproportionate influence on the things scholars tend to gravitate toward in an attempt to make a novel impact in an area not already crowded. The higher ranking of females here relates to the notion of \"me-search\" and the tendency of scholars to be most interested in topics that are highly related to their own lived experiences."}, {"id": "senior-10", "name": "senior_contributor_5cvcm", "x": 0.08538888808579162, "y": 0.5494758513551787, "degree": 1, "words": 191, "explanation": "1. social science: Compared to other fields, research in social science is more likely to foucs on the topics of diversity, social stratification, and discrimnation, making the discussion of gender inequality more probable (cf. controlling for the number of publications by field; or measured by ratios). 2. paper_inequality_mentions_3_years: At least in the social sciences, research trends show a degree of path dependency. That is, the more papers have discussed inequality-related topics in recent years, the more likely new papers are to discuss gender inequality as well. 3. female: Women remain underrepresented in many fields including academia, which may make female scholars more sensitive to the topics of gender inequalities as well as other inequality topics. 4. authors_race_diversity _score: Greater racial diversity among authors, compared with all-White author teams, may make the team more attentive to inequality-related issues more broadly, including gender inequalities. 5. news_inequality_mentions_3_years: Greater news attention to inequality in the preceding three years may increase the salience of inequality-related issues and encourage research on them. However, media effects (by observation) may be topic-specific, such that gender-related news increases research on gender inequality, whereas racial news increases research on racial inequality."}, {"id": "senior-11", "name": "senior_contributor_8pxf3", "x": 0.4186589212375797, "y": 0.44561004595590764, "degree": 0, "words": 159, "explanation": "I think that studies of gender inequality are much more common in the social sciences than in the natural sciences or engineering/computer science. This disciplinary focus should be by far be the most important driver of discussing the topic. After that, I think that authors’ gender is a strong predictor of interest in gender inequality, with women being more likely to engage with these topics. This may be because they have more personal experience with the issue and hence higher interest, but also because men may shy away from the topic if they believe it is either a marginal topic in the profession or that them being male may reduce their legitimacy to engage with the topic. I have then chosen the salience of the topic at a given point in time, as measured by mentions of inequality in the news and in academic research, as these increase authors’ interest but also the legitimacy of engaging with the topic."}, {"id": "senior-12", "name": "senior_contributor_wylyg", "x": 0.3368970339427948, "y": 0.08441613129654371, "degree": 0, "words": 68, "explanation": "Debates about gender inequality are much more relevant to social science, so papers within the field will be more likely to address this topic. This is also a subject whose importance has grown over time. Academic articles are likely to track this relevance. It is also a topic that is likely to be of more pressing interest to women who will be more likely to study this topic."}], "links": [{"source": "senior-0", "target": "senior-4", "similarity": 0.8522}, {"source": "senior-0", "target": "senior-7", "similarity": 0.8748}, {"source": "senior-0", "target": "senior-10", "similarity": 0.8767}, {"source": "senior-1", "target": "senior-7", "similarity": 0.8624}]}, {"id": "GenAI", "title": "GenAI (n=25)", "color": "#66BB6A", "nodes": [{"id": "GenAI-0", "name": "GPT_5.3_instant", "x": 0.8038712149881336, "y": 0.5020031538054895, "degree": 21, "words": 211, "explanation": "Social_science is the strongest positive predictor, because these disciplines are institutionally organized around studying and explicitly naming social inequalities, making them the primary site where gender inequality is articulated. Female (female_score) is also a key positive predictor, reflecting the role of author positionality, lived experience, and intellectual networks in shaping attention to gender-related issues. Paper_inequality_mentions_3_years is an important positive factor, consistent with the idea of temporal diffusion of research agendas, where heightened attention to inequality increases the likelihood that gender-related framing is adopted. Natural_science is a strong negative predictor, because natural sciences in particular are less likely to engage with gender inequality in titles and abstracts, likely due to their epistemological focus on technical and biological problems rather than social critique. Asian author share is a positive predictor, capturing broader globalization and institutional context effects, such as the expansion of gender inequality research in Asia or the presence of scholars working in internationally connected academic environments where gender issues are increasingly salient. Overall, whether a paper discusses gender inequality is shaped by the interaction of disciplinary norms, especially the centrality of social science, author positionality, particularly gender composition, temporal academic trends, and global scholarly contexts, with certain fields—especially natural sciences—systematically less likely to frame their work in terms of gender inequality."}, {"id": "GenAI-1", "name": "GPT_5.2_instant", "x": 0.8132850458270171, "y": 0.6181714400067742, "degree": 22, "words": 252, "explanation": "Social_science is the strongest positive predictor because gender inequality—patriarchy, sexism, gender stereotypes, and discrimination—is centrally theorized within social science traditions that explicitly analyze power and stratification. Complementing this, the negative effect of natural_science highlights a sharper epistemic contrast: natural sciences are less oriented toward normative and structural inequality frameworks, making explicit gender-inequality terminology less common in titles and abstracts. Female author share is a central positive predictor, consistent with standpoint and representation mechanisms: higher female representation likely increases attention to gender bias due to lived experience, network ties to feminist scholarship, and greater sensitivity to institutional gender dynamics. Asian author share is an additional compositional driver. Through a global and transnational lens, scholars inferred to be Asian may be embedded in research communities where gender inequality is a salient topic—such as development, labor markets, demography, or education—or may be influenced by ongoing social transformations and gender debates in rapidly changing societies. Thus, gender inequality discourse may be shaped not only by female representation but also by broader minority or global positionality within academia. Finally, paper_inequality_mentions_3_years suggests that internal academic momentum plays a strong role in predicting gender inequality research. Intellectual diffusion and path dependence matter: when inequality discourse becomes more prevalent within academia, scholars are more likely to frame their work using gender-inequality language, independent of external news shocks. Overall, gender inequality mentions arise from the joint influence of disciplinary legitimacy structures, gender representation within author teams, global and minority-linked scholarly networks, and endogenous academic trend dynamics that reinforce inequality-oriented research agendas."}, {"id": "GenAI-2", "name": "Gemini_3_fast", "x": 0.5774770639439866, "y": 0.5495887236800311, "degree": 22, "words": 160, "explanation": "The drivers of gender inequality discourse emphasize the powerful synergy between disciplinary gatekeeping and author identity, while acknowledging a more self-referential academic environment than previously assumed. social_science is the strongest predictor because these fields provide the necessary theoretical architecture and specialized lexicon—such as \"patriarchy\" or \"sexism\"—to articulate gendered power dynamics. Conversely, the negative association with natural_science suggests a \"disciplinary exclusion\" effect, where the paradigms of the hard sciences may lack the framework or incentive to address social inequalities. The high predictive rank of the female_score reinforces a reflexive research model, where scholars’ lived experiences significantly influence their choice to investigate gender-based disparities. The significance of the asian author share suggests that gender discourse may be particularly prevalent in specific global development or psychological contexts where these authors are highly represented. Finally, the importance of paper_inequality_mentions_3_years over news cycles indicates that gender research is driven primarily by internal academic momentum and scholarly \"priming\" rather than direct reactions to mainstream media events."}, {"id": "GenAI-3", "name": "Claude_sonnet4.6", "x": 0.3314531025927451, "y": 0.35319839804192915, "degree": 24, "words": 641, "explanation": "Whether a paper discusses gender inequality reflects a complete and nuanced account incorporating disciplinary gatekeeping, positionality-driven research identity, minoritized identity solidarity, disciplinary epistemological resistance, and agenda-setting dynamics. The first and most foundational mechanism is disciplinary gatekeeping. social_science is the strongest predictor of gender inequality mentions because academic disciplines function as institutional filters determining which vocabularies, frameworks, and normative concerns achieve legitimacy as objects of inquiry. The critical feminist vocabulary that defines gender inequality keywords — patriarchy, sexism, gender stereotypes, sex discrimination — was developed within and remains most densely concentrated in social science traditions, making disciplinary membership the single most powerful structural predictor of keyword presence. The second mechanism, positionality-driven research identity, explains why female is a strong positive predictor: scholars with direct personal experience of gender inequality — through professional marginalization, wage gaps, harassment, or broader societal subordination — are more likely to perceive gender inequality as a salient research problem worth naming and theorizing using the critical vocabulary the labeling scheme detects. Female scholars are disproportionately embedded in feminist scholarly networks and subfields where gender inequality research is institutionally rewarded and intellectually normalized. Gender inequality differs from racial inequality in that female here straightforwardly predicts the form of inequality most directly connected to female scholars' own social position, without the complicating specialization dynamics that emerged in the racial case. Positionality operates most cleanly and powerfully when the inequality in question directly corresponds to the scholar's own marginalized identity. The third mechanism, minoritized identity solidarity, explains the positive role of asian authorship across both racial and gender inequality prediction. Asian scholars, as a racialized minority navigating Western academic institutions, may develop a generalized sensitivity to social inequality and a solidarity-based orientation toward marginalized group experiences that extends beyond their own specific group identity. This mechanism is not positionality in the strict sense — Asian scholars are not the primary subjects of gender inequality keywords — but rather a broader minoritization effect: the experience of navigating racial minority status in predominantly white academic institutions cultivates an analytical disposition toward recognizing and naming structural inequalities of multiple kinds, including gender. This solidarity mechanism may also reflect the demographic concentration of Asian scholars in certain social science subfields where intersectional inequality frameworks are institutionally prominent. The fourth mechanism, disciplinary epistemological resistance, explains why natural_science is a negative predictor. Natural science's resistance operates not merely through technical neutrality — as in engineering — but through a deeper epistemological commitment to biological reductionism and positivist objectivism that actively reframes gender in non-social terms. Where engineering tends to simply ignore gender inequality as outside its domain, natural science more actively colonizes gender as a biological rather than social phenomenon, deploying an alternative vocabulary — sex differences, hormonal variation, evolutionary psychology — that is epistemologically incompatible with the social constructionist framing embedded in gender inequality keywords. This distinction between passive exclusion in engineering and active epistemological reframing in natural science explains why natural science is a stronger suppressor. Engineering and technology likely still exerts a negative effect, but natural science's biological reductionism constitutes a more powerful and distinctive form of resistance to critical gender inequality discourse. Finally, paper_inequality_mentions_3_years captures the self-sustaining momentum of academic discourse around gender inequality, while news_inequality_mentions_3_years is less central because gender inequality academic discourse has achieved a degree of institutional autonomy that makes it less dependent on external media agenda-setting than racial inequality discourse. Feminist theory's deep institutionalization within universities — through women's studies departments, gender studies programs, and feminist methodology courses — creates an endogenous scholarly reproduction mechanism that generates new gender inequality research through internal academic logic rather than primarily in response to media cycles. This does not mean media salience is irrelevant, but its effect is weaker and more mediated for gender than for race, where high-profile public events appear to play a more direct role in mobilizing scholarly attention."}, {"id": "GenAI-4", "name": "Grok4_fast", "x": 0.5583467842753149, "y": 0.15893666449917315, "degree": 22, "words": 260, "explanation": "The dominant driver for predicting gender inequality keyword mentions is social_science (+), as social science disciplines have long institutionalized feminist theory, critiques of patriarchy, sexism, and gender stereotypes, creating powerful normative, peer-review, and citation incentives that make explicit gender inequality language far more common in these fields. Closely following is female (+), which reflects a strong supply-side mechanism: higher female author share increases the likelihood of discussing gender inequality due to lived experience, scholarly networks, and greater propensity to apply gendered analytical lenses. Third, natural_science (−) is a robust negative predictor because natural science fields maintain stronger norms of positivist, “objective,” and apolitical framing that discourage explicit use of terms such as “patriarchy,” “sexism,” or “gender biases.” Fourth, asian (+) indicates that teams with higher estimated Asian author share are more likely to engage with gender inequality, likely because many Asian scholars come from contexts with active gender and development scholarship or study comparative/global gender issues in migration, labor, or family research. Fifth, paper_inequality_mentions_3_years (+) captures the importance of recent academic discursive climate, where periods of heightened overall inequality attention create mimetic pressures that spill into gender-specific framing. News_inequality_mentions_3_years and white (−) have less independent weight, as their predictive power appears weaker once field effects and key demographics are accounted for. This theory therefore integrates strong institutional field effects, positive in social sciences and negative in natural sciences, supply-side author characteristics, especially female and Asian shares, and temporal academic climate as the core drivers, while recognizing that gender inequality discourse benefits from deeper institutionalization in academia than more event-driven topics."}, {"id": "GenAI-5", "name": "Grok4_expert", "x": 0.5124561142618311, "y": 0.4380347594647933, "degree": 24, "words": 276, "explanation": "Gender inequality discourse in academia is overwhelmingly shaped by disciplinary gatekeeping, standpoint epistemology, sharp field-specific contrasts, author demographic signals, and cumulative academic momentum, which together explain why social_science ranks first with the strongest positive association: papers published in social-science journals (sociology, political science, psychology, gender studies) are structurally oriented toward power, identity, and stratification topics and actively engage specific gender inequality keywords (patriarchy, sexism, gender stereotypes, gender biases, etc.), whereas other fields rarely do so. This disciplinary primacy is followed by female_score (second, positive) because author teams with higher estimated shares of female scholars are far more likely to foreground lived-experience-driven questions of patriarchy, male dominance, sexism, and sex discrimination, consistent with standpoint theory and the historical mobilization of feminist scholarship. Third, natural_science (negative) provides a clear counterpoint, reflecting that papers in biology, chemistry, physics, medicine, and related fields operate under epistemological norms and incentive structures that strongly discourage explicit engagement with gender inequality language. Fourth, asian (positive) emerges as a key predictor, likely because Asian scholars—particularly those trained or working in Western institutions—have become increasingly active participants in critical gender and intersectional research within social-science venues. Finally, paper_inequality_mentions_3_years (positive) captures path-dependent academic momentum whereby periods of heightened overall inequality scholarship generate citation networks, special issues, and funding incentives that pull subsequent papers into gender-inequality conversations. Authors_race_diversity_score and news_inequality_mentions_3_years are less central predictors, presumably due to high collinearity with the stronger signals of discipline, female authorship, and recent academic climate, while the direct negative effect of natural_science sharpens the field-contrast mechanism; overall, these five features better operationalize the core institutional, standpoint, field-specific, demographic, and temporal mechanisms driving explicit gender inequality language in academic titles and abstracts."}, {"id": "GenAI-6", "name": "Mistral_balanced", "x": 0.6795871436594764, "y": 0.6177250830812037, "degree": 23, "words": 604, "explanation": "The main effects predicting whether an academic paper discusses gender inequality reflect how disciplinary norms, author demographics, and academic discourse collectively shape research agendas on gender inequality. Social science disciplines play a central role in whether a paper addresses gender inequality. Social science fields-such as sociology, psychology, gender studies, and political science-are explicitly oriented toward studying societal structures, power dynamics, and identity. These disciplines provide the theoretical frameworks, methodological tools, and normative incentives to examine gender inequality, making them the most likely contexts for such research. The positive association with social_science reinforces the idea that disciplinary culture is a primary driver of research topics. Female_score aligns with theories of standpoint epistemology and the broader literature on gender and academia. Female authors, who may have direct experiences with gender bias, discrimination, or inequality, are more likely to research and write about these issues. This effect is not merely a reflection of personal experience but also of academic priorities: female scholars are more likely to be embedded in networks, departments, or research traditions that prioritize gender-related topics. The positive sign for female_score underscores the importance of author demographics in shaping research agendas, as scholars' identities and lived experiences influence the questions they ask and the issues they prioritize. Asian authors are also significant contributors to research on gender inequality, whether due to their experiences with gender disparities in academic or professional settings, their engagement with gender issues in Asian societies, or their involvement in global or comparative gender studies. This highlights the global and intersectional nature of gender inequality research, where scholars from diverse racial and ethnic backgrounds bring unique perspectives and priorities to the study of gender dynamics. It also suggests that gender inequality is not solely a \"Western\" concern but a topic of broad, cross-cultural relevance, with contributions from scholars embedded in a variety of socio-political contexts. Natural science disciplines, which prioritize empirical, technical, or biological questions, are less likely to engage with gender inequality unless it directly intersects with their core research, such as studies of gender disparities in STEM participation. This negative effect underscores the idea that disciplinary culture acts as a filter, shaping which topics are deemed relevant or legitimate within a given field. While natural scientists may study gender disparities in specific contexts, such as workforce representation or educational outcomes, these discussions are less central to the disciplines' overall research agendas compared to social science fields. Paper_inequality_mentions_3_years highlights the self-reinforcing nature of academic discourse. When gender inequality is a prominent topic in the scholarly literature, it signals to researchers that the issue is timely, relevant, and worthy of attention. This creates a cumulative advantage, where initial interest in a topic begets further research, amplifying its visibility and importance within the academic community. Scholars may be more responsive to internal academic trends than to external public discourse, at least in the context of gender inequality research. This may reflect the insularity of academic research agendas or the fact that scholars are more attuned to the priorities of their peers, funding agencies, and disciplinary traditions than to broader societal conversations. In summary, the factors driving academic engagement with gender inequality emphasize the interplay of disciplinary norms, author demographics, and academic discourse, while also highlighting the global and intersectional dimensions of gender inequality research. The role of Asian authors expands the theoretical framework to recognize the diverse and cross-cultural contributions to this area of study, while the negative effect of natural_science reinforces the importance of disciplinary context in shaping research priorities. Together, these factors provide a more comprehensive and inclusive account of how and why scholars engage with gender inequality in their work."}, {"id": "GenAI-7", "name": "DeepSeek_expert", "x": 0.4398765744525981, "y": 0.8019642909040281, "degree": 24, "words": 966, "explanation": "A paper's disciplinary home is the most powerful determinant of whether it discusses gender inequality. Social science disciplines—sociology, psychology, political science, gender and women's studies, economics, history—are organized around the systematic investigation of social life, power, and humanly constructed hierarchies. Gender inequality, as a core axis of stratification, is not peripheral but central to these fields' intellectual missions. These disciplines provide the theoretical vocabularies that make gender visible as an object of inquiry—concepts such as patriarchy, sexism, gender performativity, the gender wage gap, and intersectionality—and the professional infrastructure of journals, conferences, and peer networks that legitimate and reward such work. A paper on sex discrimination or gender stereotypes is, definitionally, a social inquiry, and its most fundamental condition of possibility is a disciplinary apparatus that recognizes these phenomena as legitimate scholarly topics. The mirror image is the powerful negative signal carried by natural_science. The natural sciences are organized around biophysical processes that exist independently of human meaning-making—cell division, chemical reactions, planetary motion. Gender inequality, which concerns socially constructed hierarchies, cultural norms, and power relations, falls outside the epistemological boundaries of these disciplines. A biologist or chemist may personally care deeply about gender bias, but the formal scholarly output of their field does not provide a conduit for that concern to manifest in titles and abstracts. Female author share is the central author-identity predictor and the gender analogue to the Black authorship effect for racial inequality. Drawing on standpoint theory and the sociology of knowledge, women scholars, by virtue of their lived experience navigating gender-based subordination—sexism in the workplace, the double bind of likeability and competence, the unequal distribution of domestic labor, the pervasive threat of gender-based violence—possess both heightened personal motivation to understand and challenge these structures and a distinctive epistemic advantage in perceiving their manifestations. This is not an essentialist claim about all women but a structural one about the probabilistic relationship between social location and scholarly attention. The mechanism operates through two reinforcing pathways. The first is motivational: direct experience of gender inequality makes the topic personally salient, fueling the intellectual passion and persistence that sustains research programs. The second is structural sorting: women scholars are disproportionately channeled into gender-focused subfields through mentoring relationships, departmental expectations, and the subtle operation of a scholarly labor market that devalues women's contributions in male-dominated areas while expecting them to carry the burden of diversity-related intellectual work. The association between female authorship and gender inequality research is thus overdetermined by the interplay of individual motivation and institutional channeling. Asian author share extends the framework beyond the simple correspondence model that pairs one identity axis with one inequality axis. Asian authorship may be a general predictor of inequality discourse engagement, not a domain-specific one. This operates through two complementary mechanisms. The first mechanism concerns the internationalization and global diversification of inequality research. Scholars from and in Asian societies—including India, China, South Korea, Japan, Singapore, and others—are contributing to a rapidly growing global literature on gender inequality that examines non-Western contexts. These societies feature salient and often distinctive forms of gender hierarchy: patrilineal kinship structures, pronounced son preference and sex-selective practices, rapidly changing but persistent gender gaps in labor force participation, and dynamic feminist movements that have emerged in dialogue with but distinct from Western feminisms. This empirical richness provides fertile ground for gender inequality scholarship, and the increasing internationalization of academic publishing has made this work more visible in the English-language scholarly corpus. The second mechanism concerns the diaspora and comparative perspective. Asian scholars working in Western academic institutions—as graduate students, postdoctoral fellows, and faculty—often navigate multiple cultural frameworks, experiencing the contrast between gender arrangements in their countries of origin and their host societies. This bicultural or multicultural positioning can generate a distinctive scholarly attunement to the constructedness and variability of gender, making it more likely to be problematized and studied rather than taken for granted as natural. This comparative sensibility is a cognitive resource that translates into heightened engagement with gender inequality as a scholarly topic. Paper_inequality_mentions_3_years introduces a temporal dimension through the concept of discursive momentum within the academic field. Scholarship does not proceed in isolation but within a dynamic intellectual environment where the recent density of attention to a topic alters the conditions for new contributions. When the recent academic literature has paid heightened attention to inequality, a thriving intellectual conversation is underway, generating several self-reinforcing dynamics. Theoretical frameworks are being refined and contested, creating openings for new contributions that extend, critique, or synthesize. Reviewers are primed to evaluate inequality manuscripts as timely and relevant. Special issues and edited volumes may be in development, creating concrete publication opportunities. The perceived importance and citability of inequality research rises, making it professionally rewarding. This discursive momentum operates across axes of inequality; the measure captures general inequality attention, and its spillover effect means that when race and class inequality are also ascendant in the scholarly conversation, gender inequality research benefits from the broader intellectual energy around social justice. Temporal attention cycles are not noise around a stable baseline but a constitutive feature of how academic knowledge production operates: the likelihood of a paper engaging gender inequality depends not only on who writes it and where, but on when it enters the scholarly conversation relative to these shifting currents of collective attention. Engineering_and_technology may have a negative association, but that signal is largely captured by natural_science; the additional discriminatory power of distinguishing engineering from natural science is modest. Authors_race_diversity_score may reflect a cross-axis solidarity mechanism at the margins, but it is weaker than the more direct pathways of disciplinary location, author gender identity, international scholarly positioning, and temporal attention cycles. The theory therefore centers discipline as gatekeeper and author positionality as motivator, while also incorporating temporal scholarly attention cycles and Asian authorship as cross-cutting predictors of engagement with gender inequality."}, {"id": "GenAI-8", "name": "Claude_opus4.7", "x": 0.4582741224477631, "y": 0.37071060916379384, "degree": 24, "words": 342, "explanation": "Whether a paper discusses gender inequality is governed by disciplinary opportunity, author composition, and temporal salience. Disciplinary scope remains the master variable: the gender-inequality lexicon (patriarchy, sexism, sex discrimination, gender stereotypes) is the native vocabulary of the social sciences, so social_science is the dominant positive driver, while non-social fields suppress the topic by denying it vocabulary, venues, and legitimacy. The strongest exclusionary signal is natural_science rather than engineering_and_technology; both suppress the topic in mechanism, but natural science is likely the largest disciplinary block in the corpus and therefore carries more cross-sectional discriminating power, making natural_science the principal negative discipline while engineering is secondarily exclusionary. On author composition, female_score is the second-strongest predictor, consistent with the core claim that gender is the most self-relevant identity axis and that women are disproportionately motivated to study gender—reinforced by the fact that name-based gender inference is comparatively accurate, making this both a theoretically strong and well-measured signal. Author-composition variables also tap a broad orientation toward inequality scholarship of all forms rather than strictly matching the inequality type to the author's own group. Under this generalized equity-disposition account, female authorship reflects both a genuine gender-specific standpoint and a general equity-disposition (and partly a location in equity-oriented, female-dominated subfields), while Asian authorship—likely capturing internationally mobile authors with heightened salience of social hierarchy and exposure to difference—contributes a generalized sensitivity to inequality that spills across the racial/gender boundary. The temporal channel also matters: paper_inequality_mentions_3_years carries genuine intra-academic momentum and shows more standalone discriminating power for gender than for race—plausibly because gender-inequality discourse expanded especially steadily over 2000–2020, giving the trend more within-sample variance—whereas news_inequality_mentions remains causally relevant but a weak paper-level discriminator because slow-moving aggregate attention varies little across papers within a window. The core assumptions are that journal scope constrains topical content (with natural science the dominant suppressor); that author composition operates through a broadened logic combining gender-specific standpoint (female), general equity-disposition, and exposure-to-difference (Asian, mobility); and that intra-academic attention matters more than public attention at the paper level, with both causally real but differing in cross-sectional variance."}, {"id": "GenAI-9", "name": "Claude_opus4.7_adaptive", "x": 0.08, "y": 0.21124297409764808, "degree": 8, "words": 508, "explanation": "My gender theory retains a three-layer architecture — disciplinary jurisdiction, author identity, and temporal climate — with disciplinary jurisdiction as the master sorter. `social_science` (+) is the strongest predictor because fields are institutionalized epistemic ecologies and gender inequality is a central, theorized, fundable, publishable object there. The negative pole is outcome-specific rather than a fixed \"technical fields are negative\" rule. For gender, the suppressor is `natural_science` (−), not engineering, because engineering and computer science host their own vigorous gender-equity discourse — women-in-STEM, diversity in engineering, gender bias in AI — which lifts those fields toward the keyword set and leaves the natural sciences (biology, chemistry, physics, much of medicine), where \"patriarchy/sexism/gender-stereotype\" language rarely appears, as the cleaner negative pole. Disciplinary effects are the joint product of a field's general mandate to study social problems and its topic-specific internal discourse, the latter of which can partially rehabilitate an otherwise \"technical\" field for one inequality axis (gender) but not another (race). The second layer, author identity / standpoint, is the primary paper-level engine: `female_score` (+) ranks second because the gender-standpoint mechanism is both substantively powerful (homophily and lived salience make female-authored teams disproportionately likely to study gender inequality) and, crucially, well-measured (first-name gender inference is accurate), so unlike the attenuated `black` effect in the racial model it surfaces near the top rather than being buried by measurement noise. `asian` (+) appears as a general, portable \"inequality-oriented / diverse-context author\" signal — authors situated in racially heterogeneous, frequently US-based, social-science-adjacent environments where inequality of all kinds is salient — rather than as an axis-specific standpoint, which is the same broad disposition that explains why `female` predicts racial inequality too. In other words, the second layer is best understood as a set of partly overlapping channels feeding one latent construct, an inequality-oriented author profile, that travels across axes rather than a collection of strictly axis-matched standpoints. The third layer, temporal/discursive climate, remains demoted but with a nuance: `paper_inequality_mentions_3_years` (+) edges into the main-effect top five for gender, whereas the temporal variables dropped out entirely for race. I attribute this to the shape of the salience shock: the gender wave has a sharper, later jump within the 2000–2020 window (#MeToo, 2017) than the more gradual racial build-up, giving the lagged-mention variable steeper within-sample variance and thus modestly more paper-level discriminating power; `news_inequality_mentions_3_years` again fails to surface, consistent with media climate being the most-shared, least-discriminating, most upstream contextual variable. The governing assumptions of the theory are: first, that the keyword label captures explicit framing, so the decision to name gender inequality is driven jointly by field permission and a portable authorial disposition; second, that observed importance reflects true effect size × measurement reliability, which is why a well-measured standpoint variable (`female`) leads here while a poorly-measured one (`black`) did not in the racial model; and third, that disciplinary and temporal effects are outcome-specific in form — the negative field depends on which axis has homegrown disciplinary discourse, and temporal climate discriminates at the paper level only to the extent its salience shock is sharp."}, {"id": "GenAI-10", "name": "Qwen_3.6Plus_thinking", "x": 0.13184680747623398, "y": 0.6183725108570506, "degree": 15, "words": 327, "explanation": "A globally attuned, author-centered framework explains gender inequality discourse as jointly shaped by disciplinary infrastructure, standpoint epistemology, and cross-field epistemic boundary work. `social_science` (+) is central because disciplines like sociology, psychology, political science, and economics possess the theoretical frameworks (feminist theory, gender stratification research), methodological training, and journal ecosystems that normalize gender inequality as a legitimate object of scholarly inquiry. `female` (+) reflects standpoint epistemology: women scholars, across disciplines but especially within feminist and social science traditions, are more likely to center gender inequality due to lived experience with sexism, community-engaged research agendas, and greater familiarity with gender-focused literature. `natural_science` (–) indicates that the marginalization of gender inequality discourse extends beyond engineering and technology to all natural science fields (biology, chemistry, physics, medicine), reflecting pervasive epistemic norms that prioritize methodological rigor, biological determinism, or depoliticized framing over critical social analysis of gender—a broad boundary-work mechanism. `asian` (+) suggests that Asian scholars may engage gender inequality through distinct pathways including transnational feminist frameworks, model minority gender dynamics (e.g., stereotypes about Asian women's professional barriers), immigration and care labor research, or responses to gendered racism in STEM fields, highlighting the importance of global and intersectional perspectives. `paper_inequality_mentions_3_years` (+) reflects path dependence: recent inequality scholarship generates citation networks, special issues, and shared vocabularies that lower entry barriers for new work on gender inequality, creating a self-reinforcing cycle of visibility. For gender inequality specifically, individual author characteristics (`female`, `asian`) may outweigh team-level racial composition metrics, or racial diversity's effect may operate primarily through intersectional frameworks already captured by main effects. This theory assumes that (a) gender and race estimation via names/countries preserves rank-order variation despite measurement noise, (b) the Semantic Scholar corpus reflects global rather than solely U.S.-centric scholarly dynamics, and (c) epistemic boundary work excluding gender analysis operates systematically across the entire STEM ecosystem, not just technical subfields. Overall, disciplinary infrastructure, diverse racialized standpoints, pervasive STEM boundary work, and discursive path dependence operate as co-constitutive drivers of gender inequality discourse."}, {"id": "GenAI-11", "name": "Claude_opus4.8", "x": 0.7612283150499551, "y": 0.08, "degree": 22, "words": 278, "explanation": "Gender inequality is principally a social and relational phenomenon, so disciplinary location is the dominant predictor: social science fields supply the theoretical traditions (feminist theory, gender studies, sociology of work and family) and normative concerns that render gender inequality a legitimate and recurring object of inquiry, so social_science is positive and dominant while natural_science is negative because its scope structurally displaces such discussion. The second mechanism is author standpoint and lived experience: women, who disproportionately experience gendered disadvantage, are more likely to study it because personal salience shapes research agendas and because of selection into gender-relevant fields and subfields, so female_score is strongly positive—and this holds with particular confidence because name-based gender inference is far more accurate than country-based race inference, yielding a cleaner signal. The third mechanism is discursive opportunity: when inequality is already prominent in the recent scholarly conversation, authors are more likely to frame their work in those terms owing to agenda contagion, citation incentives, and topic legitimation, so paper_inequality_mentions_3_years is positive, suggesting gender-inequality framing is responsive to the ambient academic attention cycle, perhaps because gender is a more mainstreamed and broadly mobilizable inequality category. The fourth mechanism is that asian is positive, not as a topic-specific standpoint effect but as a structural, measurement-linked exposure signal: internationally mobile Asian-origin authors are plausibly concentrated in Anglophone institutions where inequality discourse of all kinds is salient, and the feature may additionally proxy field placement and collaborative-network position; thus it reflects exposure and institutional context rather than a gendered standpoint. Finally, num_authors is too indirect and field-confounded to carry independent predictive weight once the disciplinary and author-composition variables that more directly capture the same field structure are included."}, {"id": "GenAI-12", "name": "Claude_opus4.8_adaptive", "x": 0.35309383711048364, "y": 0.1590979314690547, "degree": 22, "words": 325, "explanation": "Whether a paper discusses gender inequality is shaped by three mechanisms: disciplinary admissibility, author attentiveness to marginalization, and discourse climate. The first mechanism, disciplinary admissibility, remains the strongest force: the constructs that the keywords name (sexism, patriarchy, sex discrimination, gender stereotypes) are native to the social sciences, so social_science is the dominant positive predictor. On the negative side, natural_science is the clean disciplinary negative. Engineering and technology have been partly \"decontaminated\" of their inequality-aversion by the machine-learning fairness literature, in which \"gender bias\" is a frequent and legitimate term, so the negative pull instead concentrates in the natural sciences, where sex and gender appear as biological variables but rarely under the inequality framing. The second mechanism, author attentiveness to marginalization, operates in a broad, intersectional form rather than only a gender-specific own-group form: female authorship is the leading and best-measured composition signal, but asian author share is also positive. Women and minority-origin authors share a heightened, generalized sensitivity to disadvantage that extends beyond their own group's specific axis, complemented by a compositional sorting process in which such authors cluster in fields where inequality is a legitimate object of study; this would also predict positive coefficients for other minority shares and a negative or null coefficient for white share. The third mechanism, discourse climate, is less central than author composition because near-time-constant variables have weak paper-level discriminating power, but it still matters through academic salience. Gender-inequality scholarship tracks the academic attention cycle tightly: the #MeToo period generated strong scholarly uptake that is reflected in the prior-literature salience measure, so paper_inequality_mentions retains genuine cross-sectional bite, whereas general news salience remains too diffuse and time-constant to discriminate between individual papers. Overall, the account is composition-centered and anchored by disciplinary admissibility, with the negative discipline signal located in the natural sciences for a field-specific reason, the standpoint mechanism broadened from gender-specific to general marginalization-attentiveness, and discourse climate retained as a modest but real academic-salience effect rather than dismissed entirely."}, {"id": "GenAI-13", "name": "Mistral_thinking", "x": 0.9199999999999999, "y": 0.38257147749647913, "degree": 21, "words": 239, "explanation": "The most important predictor of whether a paper discusses gender inequality is social_science, as social science disciplines—such as sociology, gender studies, and political science—are institutionally and thematically centered on studying gender dynamics, power structures, and systemic inequities, making them far more likely to engage with gender inequality topics. The second-strongest predictor is female_score, reflecting that papers with a higher share of female authors are more likely to address gender inequality, likely due to lived experiences, research interests, or institutional pressures to address underrepresented topics. The third-ranked feature, natural_science, carries a negative sign, indicating that papers in natural science fields are less likely to discuss gender inequality, as these disciplines are less likely to engage with social and gender-focused research unless in specific subfields like health disparities or STEM gender gaps. The fourth-ranked feature, asian, reveals that papers with a higher estimated share of Asian authors are more likely to discuss gender inequality, possibly reflecting the growing scholarship on gender dynamics in Asian societies, the intersectional experiences of Asian women in academia, or the role of Asian scholars in global gender studies. Finally, paper_inequality_mentions_3_years, the fifth-ranked feature, suggests that papers published during periods of heightened academic attention to inequality are more likely to discuss gender inequality, indicating that scholarly trends influence topic selection. Gender inequality research is driven by a combination of disciplinary focus, author demographics, and academic zeitgeist, with specific racial groups like Asian scholars playing a prominent role."}, {"id": "GenAI-14", "name": "Qwen_3.7Plus_thinking", "x": 0.29645906757275864, "y": 0.5698598086207298, "degree": 23, "words": 223, "explanation": "The theoretical framework for predicting mentions of gender inequality incorporates intersectional standpoint theory, the specific epistemological boundaries of STEM fields, and the primacy of academic path dependence over external media influence. First, `social_science` and `female_score` are foundational positive drivers, because epistemological alignment and the intrinsic, lived-experience motivation of female scholars, grounded in standpoint and critical mass theories, are the primary engines of this discourse. Second, the strong positive effect of the `asian` author share introduces a crucial intersectional dimension; it suggests that Asian scholars, particularly those navigating compounded racialized and gendered stereotypes such as the \"model minority\" myth or specific cultural expectations, are highly motivated to research sexism and patriarchy, or that they are concentrated in subfields focusing on comparative global gender dynamics. Third, the strong negative role of `natural_science` refines the understanding of disciplinary boundaries; while natural sciences frequently study biological sex differences, they conceptually separate these empirical observations from the sociological constructs of gender inequality, thereby reducing the likelihood of utilizing keywords like \"patriarchy\" or \"sexism.\" Finally, the prominence of `paper_inequality_mentions_3_years` reflects that academic path dependence is a vastly stronger driver of the discourse than external media agenda-setting. The academic community operates as a self-reinforcing ecosystem, where internal scholarly momentum and established citation networks, rather than external public salience or news cycles, fundamentally dictate the production of knowledge on gender inequality."}, {"id": "GenAI-15", "name": "GPT_5.5_thinking_standard", "x": 0.7933409812015145, "y": 0.2360603791266963, "degree": 21, "words": 255, "explanation": "Gender inequality mentions are driven by a combination of disciplinary receptivity, author gender composition, field-l
