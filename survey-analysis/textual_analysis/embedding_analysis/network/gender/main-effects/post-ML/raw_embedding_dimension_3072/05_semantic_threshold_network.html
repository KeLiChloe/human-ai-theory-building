cting as a field-level constraint and Asian author share serving as a signal of additional research contexts or networks that may make gender inequality more visible."}, {"id": "GenAI-17", "name": "GPT_5.4_thinking_standard", "x": 0.7247112399669895, "y": 0.3908755640033817, "degree": 21, "words": 255, "explanation": "Whether a paper explicitly discusses gender inequality is shaped above all by disciplinary location, author gender composition, and the broader intellectual climate around inequality, with an additional role for certain forms of author background. Social_science is the strongest positive predictor because these fields provide the most developed conceptual language and normative legitimacy for discussing sexism, patriarchy, stereotypes, discrimination, and gendered power relations directly. Female_score is also a major positive predictor, since teams with more women are likely to be more attentive to gendered exclusion and more likely to frame research in gender-inequality terms. Natural_science is an important negative predictor: compared with social science, natural science fields appear less likely to name gender inequality in titles and abstracts, probably because they are more oriented toward biological, clinical, or technical questions than toward explicit analysis of social hierarchy. Asian is a positive predictor, possibly as a marker of participation in research communities or institutional contexts where gender, family, education, labor markets, and development-related inequalities are actively studied. Paper_inequality_mentions_3_years is a positive predictor because inequality discourse is cumulative; when prior scholarship pays more attention to inequality, later papers are more likely to adopt that framing. General news salience is less central than the contrast between social science and natural science, along with the predictive role of Asian authorship. Overall, gender-inequality discourse is most likely when papers are produced in fields where inequality is already a legitimate analytic frame, by teams with more female representation and certain author-background profiles, during periods when inequality is already salient in academic scholarship."}, {"id": "GenAI-18", "name": "GPT_5.4_thinking_extended", "x": 0.8045104579173447, "y": 0.3787488551999751, "degree": 21, "words": 254, "explanation": "Social_science is the strongest positive predictor because gender inequality is most likely to be treated in social science as a central object of explanation, critique, and explicit naming, so papers in these fields are especially likely to use terms such as sexism, stereotypes, discrimination, or patriarchy in titles and abstracts. Female_score is also a major positive predictor, because author-team gender composition is a core part of the explanation: teams with more female authors may be more likely to notice, prioritize, and explicitly frame gendered forms of inequality because of lived experience, research interests, professional networks, and ties to feminist or inequality-oriented scholarship. Natural_science is an important negative predictor, because natural science fields are especially unlikely to use overt gender-inequality language, even when they study populations or outcomes that may be gendered; these papers may more often adopt biomedical, technical, or descriptive framings instead. Asian has a positive effect because author racial composition may capture broader institutional or transnational research networks in which gender, family, labor, education, or social inequality are salient topics. Paper_inequality_mentions_3_years has a positive effect because scholarly discourse is path dependent: when inequality language becomes more prominent in recent academic publishing, new papers are more likely to adopt that framing as well. Taken together, explicit mentions of gender inequality are shaped primarily by disciplinary norms in social science, strongly reinforced by women's representation on the author team, reduced in natural science settings, and further influenced by both the intellectual networks associated with author background and the broader academic salience of inequality discourse."}, {"id": "GenAI-19", "name": "gemini_3.1_pro_standard", "x": 0.663055171158779, "y": 0.7247196382387365, "degree": 22, "words": 214, "explanation": "The likelihood of an academic paper discussing gender inequality is shaped by strict disciplinary boundaries, authorial standpoints, and institutional research cycles. Publication within the `social_science` domain serves as the primary structural catalyst, as disciplines like sociology, political science, and psychology are epistemologically organized to critique human systems, social roles, and institutional hierarchies. Conversely, publishing in the `natural_science` sector functions as a strong negative predictor, since fields like chemistry and physics focus on non-social phenomena, making discussions of patriarchy or sexism highly uncommon. Beyond these academic venues, demographic characteristics exert a powerful influence through the framework of standpoint theory. A higher estimated share of `female` authors strongly increases the probability of gender inequality discourse, as women frequently draw upon lived experiences and a history of critical gender scholarship to shape their research agendas. This is complemented by a higher share of `asian` authors, who represent a large and globally integrated segment of contemporary academia that increasingly drives quantitative research into labor market stratification, changing family dynamics, and institutional biases across international contexts. Finally, institutional momentum functions as a temporal driver; a high volume of `paper_inequality_mentions_3_years` indicates an active academic ecosystem with established funding streams, dedicated journal issues, and shared paradigms, which collectively lower the barrier for subsequent scholars to publish work touching on gender disparities."}, {"id": "GenAI-20", "name": "Theorista_GPT5.5_instant", "x": 0.8770410279517027, "y": 0.5526583088547405, "degree": 21, "words": 174, "explanation": "Social_science is the strongest positive predictor because gender inequality is a central topic in disciplines such as sociology, psychology, political science, and related fields. The share of female authors is also an important positive predictor, reflecting the possibility that researchers' experiences, interests, and professional networks shape the questions they choose to study. Disciplinary contrasts are also important: natural_science is a strong negative predictor, suggesting that research published in natural science journals is systematically less likely to address gender inequality, likely because these fields are more oriented toward biological or physical phenomena than social institutions and discrimination. The positive effect of the share of Asian authors may reflect the growing internationalization of gender inequality research, regional research priorities, or unobserved institutional and geographic factors associated with scholars' backgrounds. Paper_inequality_mentions_3_years is evidence that scholarly attention to inequality is cumulative, with periods of greater academic focus on inequality increasing the likelihood that new papers address gender inequality. Overall, disciplinary specialization, researcher composition, and the broader trajectory of academic discourse jointly shape whether a paper discusses gender inequality."}, {"id": "GenAI-21", "name": "Theorista_GPT5.5_thinking_standard", "x": 0.6410446039749419, "y": 0.08035836980715381, "degree": 22, "words": 257, "explanation": "Explicit mentions of gender inequality are primarily shaped by disciplinary receptivity, gendered author standpoint, and academic discursive momentum, with additional negative selection from natural-science fields and a broader role for author-team positionality. The strongest driver is `social_science`: gender inequality is most likely to be explicitly named in fields where sexism, patriarchy, gender bias, gender identity, and discrimination are legitimate theoretical objects. The second driver is `female_score`: papers with a higher estimated share of female authors are more likely to discuss gender inequality because gendered disadvantage may be more salient to these authors, and because women scholars may be more connected to research communities that study gender, discrimination, and inequality. The positive effect of `paper_inequality_mentions_3_years` suggests that gender-inequality discourse is also shaped by academic diffusion: when inequality is more common in recent scholarship, authors are more likely to adopt inequality-related concepts and keywords. `natural_science` is a negative predictor, because natural-science papers are less likely to frame their topics in terms of social inequality, even when they study sex or gender differences. Finally, `asian` is a positive predictor, not as a direct racial identity mechanism, but as a proxy for international scholarly networks, geographic contexts, development-oriented research, or subfields where gender inequality is especially salient. Thus, gender-inequality mentions are most likely in social-science papers, papers with more female authors, papers published during periods of high academic inequality discourse, and papers connected to author communities or contexts where gender inequality is a salient scholarly and social issue; they are less likely in natural-science fields where social-inequality framing is less central."}, {"id": "GenAI-22", "name": "Qwen_3.8Max_thinking", "x": 0.28064570484959706, "y": 0.9199999999999999, "degree": 10, "words": 1333, "explanation": "My theoretical framework for predicting whether a paper discusses gender inequality ranks the five most important features as: (1) `social_science` (+), (2) `female` (+), (3) `natural_science` (–), (4) `asian` (+), and (5) `paper_inequality_mentions_3_years` (+). I place `social_science` (+) at the apex of the hierarchy because disciplinary location is the single most powerful structural filter determining whether a paper engages with gender inequality. The conceptual apparatus required to frame gender relations as a problem of structural inequality—patriarchy, male dominance, sexism, gender stereotypes, sex discrimination—was developed within and is sustained by social science disciplines. Sociology provided the language of patriarchy and gender stratification; psychology developed the empirical study of sexism and gender stereotyping; political science theorized male dominance in governance; economics quantified the gender wage gap and occupational segregation. These fields provide the institutional infrastructure—dedicated journals such as *Gender & Society* and *Feminist Studies*, tenure lines in gender and women's studies, disciplinary associations with gender-focused sections—that makes gender inequality a recognizable and publishable research topic. Without this infrastructure, the base rate of gender inequality keywords in a paper approaches zero regardless of other author characteristics. I retain `female` (+) at the second position. My theoretical reasoning, grounded in feminist standpoint epistemology (Harding, 1991; Hartsock, 1983; Smith, 1987), holds that women's lived experience under patriarchal social arrangements generates a distinctive epistemic position from which gender-based domination becomes visible as a structural phenomenon requiring explanation rather than appearing as a natural or inevitable feature of social life. Women scholars are disproportionately likely to have personally encountered sexism, gender stereotypes, and sex discrimination in their professional and personal lives, and this experiential knowledge creates both the motivation to investigate these phenomena and the interpretive sensitivity to recognize them in empirical data. Women have been the primary architects of gender studies as an academic field, from the founding of women's studies programs in the 1970s through the development of intersectional feminist theory (Crenshaw, 1989; Collins, 2000) to contemporary research on gender bias in institutions. The female effect is not merely a byproduct of women's concentration in social science disciplines but reflects an independent identity-based channel through which gendered experience shapes topic selection. I rank `natural_science` (–) third because its negative predictive importance reflects a strong exclusionary effect. The epistemological orientation of natural sciences does not naturally accommodate the language of patriarchy, sexism, or gender stereotypes, and the gender inequality keyword set is especially absent from natural science journals compared with engineering and technology journals. Engineering and technology fields have a small but growing literature on gender bias in algorithms, women in computing, and gender disparities in tech workplaces, which slightly elevates the base rate of gender inequality keywords relative to natural sciences. Natural science journals in biology, chemistry, physics, and environmental science have virtually zero engagement with terms like \"patriarchy,\" \"male dominance,\" or \"sexism.\" Even the growing literature on sex and gender in biomedical research typically employs the language of \"sex differences\" or \"gender medicine\" rather than the inequality-focused keywords in the label set. The disciplinary exclusion mechanism is not merely the mirror image of the social science inclusion mechanism but has its own independent predictive force, particularly in distinguishing natural science papers from engineering papers, where gender inequality discourse is slightly more prevalent. I rank `asian` (+) fourth. A gender-centric framing that treats `female` as the sole identity channel for gender inequality scholarship overlooks the contribution of Asian scholars. Several mechanisms may explain this association. First, Asian scholars may be studying gender inequality in non-Western cultural contexts where patriarchal structures take distinctive forms—Confucian gender norms in East Asia, caste-gender intersections in South Asia, women's labor force participation in developing economies, or gender-based violence in post-colonial societies. This scholarship generates papers containing keywords like \"patriarchy,\" \"gender stereotypes,\" and \"sex discrimination\" but is not captured by a US-centric framing of gender inequality that centers the experiences of Western women. The keyword set is culturally general enough to encompass these non-Western gender scholarship traditions, and Asian scholars are disproportionately likely to produce such work because of their cultural and linguistic access to these contexts. Second, Asian scholars are well-represented in computer science and engineering, fields where research on gender bias in algorithms, facial recognition systems, and AI-driven decision-making has grown rapidly. This work uses terms like \"gender biases\" and \"gender stereotypes\" in a technical context, creating a positive association between `asian` and gender inequality keywords that operates partly outside traditional social science venues. Third, Asian women scholars may be disproportionately likely to adopt intersectional frameworks (Crenshaw, 1989; Collins, 2000) that examine how gender inequality intersects with racial and ethnic marginalization, producing scholarship that engages with gender inequality keywords as part of a broader intersectional analysis. Fourth, the surname-based inference for `asian` captures scholars from a wide range of countries—including India, China, Japan, South Korea, and various Southeast Asian nations—some of which have high levels of gender inequality that are actively studied by their scholars. In this sense, the `asian` variable may partially capture the salience of gender inequality as a social problem in the authors' countries of origin, analogous to the `country_race_diversity_score` mechanism I theorized for racial inequality. Scholars from countries where gender inequality is a visible and contested social problem are more likely to carry that concern into their academic work, regardless of the specific discipline in which they publish. I rank `asian` fourth rather than higher because I believe its effect, while real and positive, is smaller in magnitude than the effects of `social_science`, `female`, and `natural_science`, and because it operates through multiple heterogeneous channels—non-Western gender scholarship, technical AI bias research, intersectional scholarship, national context effects—that may partially cancel or dilute one another in aggregate. I rank `paper_inequality_mentions_3_years` (+) fifth because it captures the self-reinforcing, path-dependent nature of academic knowledge production, whereby prior publications on inequality create citation networks, validate methodological approaches, legitimize the topic within disciplinary hierarchies, and attract new cohorts of researchers. When the preceding three years show high levels of inequality-related academic output, this signals an active research ecosystem with established infrastructure that sustains and amplifies further production. This reflects Merton's (1968) cumulative advantage and the Matthew Effect. However, this feature's predictive power is more modest than the paper-level features because, as a temporal-contextual variable that varies only across years or three-year windows, it cannot differentiate individual papers within the same period. Its predictive contribution is confined to explaining between-year shifts in the base rate of gender inequality discussion, which constitutes a smaller fraction of the total variance than features such as discipline and author demographics that vary across individual papers. `news_inequality_mentions_3_years` remains theoretically important for understanding the societal-to-academic transmission channel, including why there is more gender inequality scholarship after #MeToo than before, but it is poorly suited for cross-sectional prediction because it is constant for all papers published within the same three-year window. A sociology paper on patriarchy and a chemistry paper on molecular bonding published in the same year share the same `news_inequality_mentions_3_years` value, so this feature cannot discriminate between them. Its predictive power is confined to explaining why the overall base rate of gender inequality discussion is higher in one period than another, which is a between-year effect. Public discourse still shapes academic attention, but it belongs to a secondary tier of explanatory factors that modulate the background rate without being primary cross-sectional differentiators. Overall, gender inequality scholarship is structured by disciplinary location, both inclusionary and exclusionary, gender identity, distributed ethnic identity, and academic momentum. Gender inequality scholarship, like racial inequality scholarship, is produced by a more ethnically diverse coalition of scholars than a purely gender-centric framing would predict. Asian scholars contribute through non-Western gender scholarship, technical research on algorithmic gender bias, and intersectional analysis, creating a positive association between `asian` and gender inequality keywords that operates through channels distinct from the `female` identity effect. At the same time, the disciplinary boundary—both the inclusionary effect of social science and the exclusionary effect of natural science—remains the dominant structural filter, and temporal-contextual features, while theoretically important, are secondary predictors in a cross-sectional classification task."}, {"id": "GenAI-23", "name": "gemini_3.6flash_extended", "x": 0.5736828849005208, "y": 0.8467373632778118, "degree": 22, "words": 181, "explanation": "The theoretical framework for predicting gender inequality discourse integrates institutional disciplinary gating, standpoint epistemology, domain-specific paradigm constraints, and macro-bibliometric momentum. At the macro level, `social_science` operates as the primary institutional filter, establishing the requisite theoretical paradigms, qualitative and quantitative methodologies, and editorial mandates required to examine patriarchal structures and gendered stratification. Within this permissive disciplinary framework, author-level identity plays a vital catalytic role: female authorship (`female`) drives the selection of gender inequality topics through standpoint epistemology, where lived experiences with gendered dynamics generate strong epistemic motivation to investigate systemic disparities. Conversely, `natural_science` acts as the primary negative discipline signal because bench sciences (e.g., physics, chemistry, basic biology) prioritize non-human or purely physical phenomena, creating a firm paradigm constraint against social gender analysis. Furthermore, the positive effect of Asian co-author representation (`asian`) reflects a growing focus within global health, demography, and development economics on issues such as maternal health disparities, sex-ratio imbalances, and gendered labor markets. Finally, macro-academic momentum (`paper_inequality_mentions_3_years`) provides exogenous funding and publication incentives, ensuring that temporal waves of scholarly focus on inequality broadly increase the likelihood of gender-specific inquiry."}, {"id": "GenAI-24", "name": "GPT_5.6Sol_high", "x": 0.6243635227645656, "y": 0.2602486539957924, "degree": 24, "words": 275, "explanation": "Disciplinary context and author-team composition are the strongest predictors of explicit gender-inequality discussion. `social_science` is the most important positive predictor because fields such as sociology, psychology, political science, economics, a   const VARIANT_ORDER = ["three_groups", "collapsed"];
  const VARIANT_LABELS = {

    collapsed: "Two groups (Humans and GenAI)",
  };
  const OPEN_SECTIONS_KEY = "network-sidebar-open-sections";

  function navStorage() {
    try {
      return window.sessionStorage;
    } catch {
      return null;
    }
  }

  function readOpenSections() {
    const storage = navStorage();
    if (!storage) return new Set();
    try {
      const raw = storage.getItem(OPEN_SECTIONS_KEY);
      if (!raw) return new Set();
      const parsed = JSON.parse(raw);
      return new Set(Array.isArray(parsed) ? parsed : []);
    } catch {
      return new Set();
    }
  }

  function writeOpenSections(openIds) {
    const storage = navStorage();
    if (!storage) return;
    try {
      storage.setItem(OPEN_SECTIONS_KEY, JSON.stringify([...openIds]));
    } catch {
      /* ignore quota / private browsing */
    }
  }

  // Drop legacy persistence so reopening the site starts collapsed.
  try {
    localStorage.removeItem(OPEN_SECTIONS_KEY);
  } catch {
    /* ignore */
  }

  function sectionId(task, theory) {
    return task + "/" + theory;
  }

  const PAGE_SUFFIX_RE =
    /((?:gender|race)\/(?:main-effects|soi)\/(?:pre-ML|post-ML)\/[^/]+\/[^/]+?)(?:\.html)?$/i;

  function normalizeNavPath(path) {
    if (path == null) return "";
    let p = decodeURIComponent(String(path)).trim();
    if (p.includes("://")) {
      try {
        p = new URL(p).pathname;
      } catch {
        /* keep p */
      }
    }
    const pageMatch = p.match(PAGE_SUFFIX_RE);
    if (pageMatch) {
      return pageMatch[1].toLowerCase();
    }
    const marker = "/network/";
    const markerIndex = p.indexOf(marker);
    if (markerIndex !== -1) {
      p = p.slice(markerIndex + marker.length);
    }
    p = p.replace(/^\//, "").replace(/\/$/, "");
    if (!p || p === "index" || p === "index.html" || !p.includes("/")) return "";
    if (p.endsWith(".html")) p = p.slice(0, -5);
    if (p === "index") return "";
    return p.toLowerCase();
  }

  function resolvedPathFromHref(href) {
    try {
      return normalizeNavPath(new URL(href, window.location.href).pathname);
    } catch {
      return normalizeNavPath(href);
    }
  }

  function currentResolvedPath() {
    return normalizeNavPath(window.location.pathname);
  }

  function pathsMatch(itemHref) {
    const entryPath = normalizeNavPath(itemHref);
    const currentPath = currentResolvedPath();
    if (entryPath === currentPath) return true;
    try {
      return resolvedPathFromHref(navLinkHref(itemHref)) === currentPath;
    } catch {
      return false;

  }

  /** Path to current page relative to the network site root (no leading slash). */
  function networkPathSuffix() {
    const path = decodeURIComponent(window.location.pathname);
    const pageMatch = path.match(
      /((?:gender|race)\/(?:main-effects|soi)\/(?:pre-ML|post-ML)\/[^/]+\/[^/]+\.html)$/i
    );
    if (pageMatch) return pageMatch[1];
    const marker = "/network/";
    const markerIndex = path.indexOf(marker);
    if (markerIndex !== -1) {
      const rest = path.slice(markerIndex + marker.length).replace(/\/$/, "");
      return rest || "index.html";
    }
    if (/\/index\.html$/i.test(path) || /\/$/.test(path)) return "index.html";
    return path.replace(/^\//, "").replace(/\/$/, "");
  }

  function currentNavPath() {
    return currentResolvedPath();
  }

  function isHttpDeployment() {
    const p = window.location.protocol;
    return p === "http:" || p === "https:";
  }

  /**
   * Host-absolute site root for http(s), e.g. "/human-ai-semantic-network" or "/network".
   * Relative links break when the URL omits a trailing slash
   * (/human-ai-semantic-network + "gender/..." => /gender/...).
   */
  function networkSiteRoot() {
    if (!isHttpDeployment()) return null;

    const scripts = document.getElementsByTagName("script");
    for (let i = 0; i < scripts.length; i++) {
      const src = scripts[i].src;
      if (!src || !/sidebar\.js(\?|$)/i.test(src)) continue;
      try {
        const pathname = new URL(src, window.location.href).pathname;
        return pathname.replace(/\/network_interactive\/sidebar\.js$/i, "") || "";
      } catch {
        /* keep looking */
      }
    }

    const path = decodeURIComponent(window.location.pathname);
    const underPage = path.match(
      /^(.*)\/(?:gender|race)\/(?:main-effects|soi)\/(?:pre-ML|post-ML)\//i
    );
    if (underPage) return underPage[1];

    let root = path.replace(/\/index\.html$/i, "").replace(/\/$/, "");
    return root || "";
  }

  /** Build href for a catalog entry from the current page location. */
  function navLinkHref(itemHref) {
    const target = String(itemHref).replace(/^\//, "");
    const root = networkSiteRoot();
    if (root !== null) {
      // Keep .html; project Pages need the real filename.
      return (root ? root : "") + "/" + target;
    }
    // file:// — stay relative to the current document.
    return navBasePrefix() + target;
  }

  function navBasePrefix() {
    const suffix = networkPathSuffix();
    if (!suffix || suffix === "index.html" || suffix === "index") return "";
    const depth = suffix.split("/").filter(Boolean).length - 1;
    return depth > 0 ? "../".repeat(depth) : "";
  }

  window.buildNetworkSidebar = function (entries, rootId, options) {
    const opts = options || {};
    const root = document.getElementById(rootId || "site-sidebar");
    if (!root) return;
    if (!entries || !entries.length) {
      console.warn("buildNetworkSidebar: no catalog entries; sidebar links will be empty.");
      entries = [];
    }

    const openSections = readOpenSections();

    const tree = {};
    entries.forEach((e) => {
      if (!tree[e.task]) tree[e.task] = {};
      if (!tree[e.task][e.theory_type]) tree[e.task][e.theory_type] = {};
      if (!tree[e.task][e.theory_type][e.phase]) tree[e.task][e.theory_type][e.phase] = {};
      tree[e.task][e.theory_type][e.phase][e.variant_key] = e;
    });

    const brand = document.createElement("div");
    brand.className = "sidebar-brand";
    const homeHref = navLinkHref("index.html");

      "<h1>Semantic Networks</h1></a>";
    root.appendChild(brand);

    const scroll = document.createElement("div");
    scroll.className = "sidebar-scroll";

    TASK_ORDER.forEach((task) => {
      if (!tree[task]) return;
      const taskEl = document.createElement("div");
      taskEl.className = "nav-task " + task;
      taskEl.innerHTML = '<h2 class="nav-task-title">' + TASK_LABELS[task] + "</h2>";
      let taskHasActive = false;

      THEORY_ORDER.forEach((theory) => {
        if (!tree[task][theory]) return;
        const details = document.createElement("details");
        details.className = "nav-theory";
        const summary = document.createElement("summary");
        summary.textContent = THEORY_LABELS[theory];
        details.appendChild(summary);
        let sectionHasActive = false;

        const sid = sectionId(task, theory);
        if (opts.expandAll || openSections.has(sid)) {
          details.open = true;
        }

        details.addEventListener("toggle", () => {
          if (details.open) openSections.add(sid);
          else openSections.delete(sid);
          writeOpenSections(openSections);
        });

        const theoryBody = document.createElement("div");
        theoryBody.className = "nav-theory-body";

        PHASE_ORDER.forEach((phase) => {
          const phaseEntries = tree[task][theory][phase];
          if (!phaseEntries) return;

          const phaseEl = document.createElement("div");
          phaseEl.className = "nav-phase";
          const phaseIsActive = VARIANT_ORDER.some((vk) => {
            const item = phaseEntries[vk];
            return item && pathsMatch(item.href);
          });
          if (phaseIsActive) phaseEl.classList.add("has-active");
          phaseEl.innerHTML = '<div class="nav-phase-label">' + phase + "</div>";

          const links = document.createElement("div");
          links.className = "nav-links";

          VARIANT_ORDER.forEach((vk) => {
            const item = phaseEntries[vk];
            if (!item) return;
            const a = document.createElement("a");
            a.href = navLinkHref(item.href);
            a.textContent = VARIANT_LABELS[vk];
            if (pathsMatch(item.href)) {
              a.classList.add("active");
              a.setAttribute("aria-current", "page");
              sectionHasActive = true;
              taskHasActive = true;
            }
            links.appendChild(a);
          });

          phaseEl.appendChild(links);
          theoryBody.appendChild(phaseEl);
        });

        if (sectionHasActive) {
          details.classList.add("has-active");
          details.open = true;
        }

        details.appendChild(theoryBody);
        taskEl.appendChild(details);
      });

      if (taskHasActive) taskEl.classList.add("has-active");
      scroll.appendChild(taskEl);
    });

    root.appendChild(scroll);

    const activeLink = root.querySelector(".nav-links a.active");
    if (activeLink) {
      requestAnimationFrame(() => {
        activeLink.scrollIntoView({ block: "nearest", behavior: "auto" });
      });
    }
  };
})();

  <script>
    buildNetworkSidebar(JSON.parse(document.getElementById("nav-data").textContent));

    const DATA = JSON.parse(document.getElementById("network-data").textContent);
    const SCALE = 1000;
    const PANEL_PAD = 40;

    document.getElementById("page-title").textContent = DATA.title;
    document.getElementById("page-subtitle").textContent = DATA.subtitle;
    document.getElementById("threshold-val").textContent = DATA.threshold.toFixed(3);
    document.getElementById("quantile-val").textContent = DATA.threshold_quantile_pct + "th";
    document.getElementById("variant-badge").textContent = DATA.collapsed
      ? "Two groups (Humans and GenAI)"
      : "Three groups (PhDs, Senior Scientists, GenAI)";

    const panelsEl = document.getElementById("panels");
    const detailEl = document.getElementById("detail");
    const detailHeader = document.getElementById("detail-header");
    const detailEmpty = document.getElementById("detail-empty");
    const panelRoots = new Map();
    let pinnedNode = null;
    let hoveredNode = null;

    function nodeRadius(degree) {
      return 9.5 + Math.min(degree, 8) * 1.5;
    }

    function hitRadius(degree) {
      return nodeRadius(degree) + 12;
    }

    function showDetail(node, panel) {
      detailEmpty.style.display = "none";
      detailEl.classList.add("visible");
      detailHeader.style.setProperty("--detail-accent", panel.color);
      document.getElementById("detail-dot").style.color = panel.color;
      document.getElementById("detail-group").textContent = panel.title;
      document.getElementById("detail-name").textContent = node.name;
      document.getElementById("detail-neighbors").textContent = node.degree;
      document.getElementById("detail-words").textContent = node.words ?? "—";
      document.getElementById("detail-explanation").textContent =
        node.explanation || "(No theory text available for this participant.)";
    }

    function hideDetail() {
      if (pinnedNode) return;
      detailEl.classList.remove("visible");
      detailEmpty.style.display = "block";
    }

    function resetAllHighlights() {
      panelRoots.forEach(root => {
        root.selectAll(".node").classed("focused faded", false);
        root.selectAll(".link").classed("highlight faded", false);
      });
      document.querySelectorAll(".panel-card").forEach(card => {
        card.classList.remove("active");
      });
    }

    function highlightNode(nodeId, panelId) {
      resetAllHighlights();
      const root = panelRoots.get(panelId);
      const card = document.querySelector(`.panel-card[data-panel-id="${panelId}"]`);
      if (!root || !card) return;

      card.classList.add("active");
      const neighborIds = new Set([nodeId]);
      root.selectAll(".link").each(d => {
        if (d.source === nodeId || d.target === nodeId) {
          neighborIds.add(d.source);
          neighborIds.add(d.target);
        }
      });

      root.selectAll(".node")
        .classed("focused", d => d.id === nodeId)
        .classed("faded", d => !neighborIds.has(d.id));
      root.selectAll(".link")
        .classed("highlight", d => d.source === nodeId || d.target === nodeId)
        .classed("faded", d => d.source !== nodeId && d.target !== nodeId);
    }

    function activateNode(node, panel) {
      hoveredNode = node;
      highlightNode(node.id, panel.id);
      showDetail(node, panel);
    }

    function deactivateNode() {
      if (pinnedNode) return;
      hoveredNode = null;
      hideDetail();
      resetAllHighlights();
    }

    function addPanelGrid(svg, panelId) {
      const patId = `grid-${panelId}`;
      const defs = svg.append("defs");
      defs.append("pattern")
        .attr("id", patId)
        .attr("width", 28).attr("height", 28)
        .attr("patternUnits", "userSpaceOnUse")
        .append("circle")
        .attr("cx", 1).attr("cy", 1).attr("r", 0.55)
        .attr("fill", "rgba(15,23,42,0.06)");
      svg.insert("rect", ":first-child")
        .attr("width", SCALE).attr("height", SCALE)
        .attr("fill", `url(#${patId})`);
    }

    DATA.panels.forEach(panel => {
      const nodeById = new Map(panel.nodes.map(n => [n.id, n]));

      const card = document.createElement("div");
      card.className = "panel-card";
      card.dataset.panelId = panel.id;

      const head = document.createElement("div");
      head.className = "panel-head";
      head.innerHTML = `<h2>${panel.title}</h2><span class="dot" style="color:${panel.color}"></span>`;
      card.appendChild(head);

      const svg = d3.select(card).append("svg")
        .attr("class", "panel-svg")
        .attr("viewBox", `0 0 ${SCALE} ${SCALE}`);

      addPanelGrid(svg, panel.id.replace(/\W/g, "_"));
      const root = svg.append("g");
      panelRoots.set(panel.id, root);

      const x = d3.scaleLinear().domain([0, 1]).range([PANEL_PAD, SCALE - PANEL_PAD]);
      const y = d3.scaleLinear().domain([0, 1]).range([SCALE - PANEL_PAD, PANEL_PAD]);

      const links = panel.links.map(l => ({ ...l, panelId: panel.id }));
      const nodes = panel.nodes.map(n => ({ ...n, panelId: panel.id }));

      root.selectAll(".link")
        .data(links)
        .join("line")
        .attr("class", "link")
        .attr("stroke-opacity", 0.34)
        .attr("stroke-width", 1.2)
        .attr("x1", d => x(nodeById.get(d.source).x))
        .attr("y1", d => y(nodeById.get(d.source).y))
        .attr("x2", d => x(nodeById.get(d.target).x))
        .attr("y2", d => y(nodeById.get(d.target).y));

      const nodeSel = root.selectAll(".node")
        .data(nodes)
        .join("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${x(d.x)},${y(d.y)})`);

      nodeSel.append("circle")
        .attr("class", "hit")
        .attr("r", d => hitRadius(d.degree));

      nodeSel.append("circle")
        .attr("class", "shell")
        .attr("r", d => nodeRadius(d.degree) + 4)
        .attr("stroke", panel.color)
        .attr("stroke-opacity", 0.35);

      nodeSel.append("circle")
        .attr("class", "core")
        .attr("r", d => nodeRadius(d.degree))
        .attr("fill", panel.color)
        .attr("fill-opacity", 0.92);

      nodeSel
        .on("pointerenter", (event, d) => {
          if (pinnedNode && pinnedNode.id !== d.id) return;
          activateNode(d, panel);
        })
        .on("pointerleave", (event) => {
          if (pinnedNode) return;
          const related = event.relatedTarget;
          if (related && event.currentTarget.contains(related)) return;
          deactivateNode();
        })
        .on("click", (event, d) => {
          event.stopPropagation();
          if (pinnedNode && pinnedNode.id === d.id) {
            pinnedNode = null;
            deactivateNode();
            return;
          }
          pinnedNode = d;
          activateNode(d, panel);
        });

      panelsEl.appendChild(card);
    });

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      panelRoots.forEach(root => {
        root.selectAll(".node").classed("faded", d => q && !d.name.toLowerCase().includes(q));
        if (!q) root.selectAll(".link").classed("faded highlight", false);
        else root.selectAll(".link").classed("faded", true).classed("highlight", false);
      });
      if (!q && !pinnedNode && !hoveredNode) resetAllHighlights();
      else if (pinnedNode) highlightNode(pinnedNode.id, pinnedNode.panelId);
      else if (hoveredNode) highlightNode(hoveredNode.id, hoveredNode.panelId);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      pinnedNode = null;
      hoveredNode = null;
      document.getElementById("search").value = "";
      hideDetail();
      resetAllHighlights();
      panelRoots.forEach(root => {
        root.selectAll(".node").classed("faded", false);
      });
    });

    document.getElementById("canvas-wrap").addEventListener("click", (e) => {
      if (e.target.closest(".node")) return;
      if (!pinnedNode) return;
      pinnedNode = null;
      hoveredNode = null;
      hideDetail();
      resetAllHighlights();
    });
  </script>
</body>
</html>
