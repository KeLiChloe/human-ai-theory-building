  <style>
    :root {
      --bg-deep: #ffffff;
      --bg-mid: #f8fafc;
      --surface: #ffffff;
      --surface-elevated: #f8fafc;
      --stroke: #e2e8f0;
      --stroke-light: #cbd5e1;
      --text: #0f172a;
      --text-soft: #334155;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-dim: rgba(37, 99, 235, 0.12);
      --gold: #92702a;
      --sidebar-w: min(440px, 40vw);
      --radius: 20px;
      --radius-sm: 12px;
      --shadow-lg: 0 4px 24px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg-deep);
      overflow: hidden;
    }

    .shell {
  position: relative;
  z-index: 1;
  display: flex;
  height: 100vh;
  min-height: 0;
}

.site-sidebar {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #e2e8f0;
  background: #f8fafc;
  min-height: 0;
}

.sidebar-brand {
  padding: 1.15rem 1.1rem 0.9rem;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}

.sidebar-brand a {
  text-decoration: none;
  color: inherit;
}

.sidebar-brand .eyebrow {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #92702a;
  margin-bottom: 0.35rem;
}

.sidebar-brand h1 {
  margin: 0;
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.15;
  color: #0f172a;
}

.sidebar-scroll {
  flex: 1;
  overflow: auto;
  padding: 0.65rem 0.55rem 1rem;
}

.nav-task {
  margin-bottom: 0.85rem;
}

.nav-task-title {
  margin: 0 0 0.35rem;
  padding: 0.35rem 0.55rem;
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 1.15rem;
  font-weight: 400;
  color: #1e293b;
}

.nav-task.race .nav-task-title { color: #854d0e; }
.nav-task.gender .nav-task-title { color: #1d4ed8; }

.nav-theory {
  margin-bottom: 0.35rem;
  border-radius: 8px;
  overflow: hidden;
}

.nav-theory summary {
  list-style: none;
  cursor: pointer;
  padding: 0.5rem 0.55rem;
  font-size: 0.88rem;
  font-weight: 700;
  color: #1e293b;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  user-select: none;
  border-radius: 8px;
  transition: background 0.15s;
}

.nav-theory summary::-webkit-details-marker { display: none; }

.nav-theory summary::before {
  content: "";
  width: 0.4rem;
  height: 0.4rem;
  border-right: 2px solid #475569;
  border-bottom: 2px solid #475569;
  transform: rotate(-45deg);
  flex-shrink: 0;
  transition: transform 0.2s;
}

.nav-theory[open] summary::before {
  transform: rotate(45deg);
  margin-top: -0.1rem;
}

.nav-theory summary:hover { background: #eef2f7; }

.nav-phase {
  padding: 0.15rem 0.35rem 0.35rem 1.15rem;
}

.nav-phase-label {
  margin: 0.35rem 0 0.25rem;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #64748b;
}

.nav-links {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  margin-bottom: 0.25rem;
}

.nav-task.has-active > .nav-task-title {
  font-weight: 600;
}

.nav-task.race.has-active > .nav-task-title { color: #92400e; }
.nav-task.gender.has-active > .nav-task-title { color: #1d4ed8; }

.nav-theory.has-active > summary {
  color: #1e40af;
  font-weight: 700;
}

.nav-phase.has-active > .nav-phase-label {
  color: #1d4ed8;
  font-weight: 700;
}

.nav-links a {
  display: block;
  text-decoration: none;
  font-size: 0.78rem;
  line-height: 1.35;
  color: #475569;
  padding: 0.38rem 0.5rem;
  border-radius: 6px;
  border: 1px solid transparent;
  border-left: 3px solid transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.nav-links a:hover {
  color: #0f172a;
  background: #e8f2ff;
  border-color: #bfdbfe;
  border-left-color: #93c5fd;
}

.nav-links a.active {
  color: #1e3a8a;
  background: #dbeafe;
  border-color: #93c5fd;
  border-left-color: #2563eb;
  font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.12);
}

.shell-main {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #ffffff;
}

.shell-main.index-main {
  overflow: auto;
}

.index-welcome {
  padding: 2.5rem 2.25rem 3rem;
  max-width: 52rem;
}

.index-welcome h2 {
  margin: 0 0 0.75rem;
  font-family: "Instrument Serif", Georgia, serif;
  font-size: clamp(1.75rem, 3vw, 2.35rem);
  font-weight: 400;
  color: #0f172a;
}

.index-welcome p {
  margin: 0 0 1rem;
  color: #475569;
  line-height: 1.65;
  font-size: 0.95rem;
}

.index-welcome .index-cta {
  font-size: 1.15rem;
  font-weight: 700;
  color: #0f172a;
}

.index-welcome .index-glossary {
  margin: 0 0 1.25rem;
  padding: 1rem 1.1rem;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  background: #f8fafc;
}

.index-welcome .index-glossary dt {
  margin: 0 0 0.25rem;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #334155;
}

.index-welcome .index-glossary dd {
  margin: 0 0 0.85rem;
  color: #475569;
  line-height: 1.6;
  font-size: 0.9rem;
}

.index-welcome .index-glossary dd:last-child {
  margin-bottom: 0;
}

.index-welcome .index-howto {
  margin: 0 0 0.5rem;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #64748b;
}

.index-welcome ul {
  margin: 0;
  padding-left: 1.2rem;
  color: #64748b;
  line-height: 1.7;
  font-size: 0.9rem;
}



    .app {
      position: relative;
      display: grid;
      grid-template-rows: auto auto 1fr;
      height: 100%;
      min-height: 0;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.25rem 1.75rem 1.1rem;
      border-bottom: 1px solid var(--stroke);
      background: #ffffff;
    }

    .title-wrap h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(1.65rem, 2.5vw, 2.35rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .title-wrap p {
      margin: 0.5rem 0 0;
      color: var(--text-soft);
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
      align-items: flex-start;
    }

    .badge {
      border: 1px solid var(--stroke-light);
      background: #f8fafc;
      border-radius: 999px;
      padding: 0.48rem 0.9rem;
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .badge strong { color: var(--text); font-weight: 600; }
    .badge.accent {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: var(--text-soft);
    }

    .toolbar {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 0.7rem 1.75rem;
      border-bottom: 1px solid var(--stroke);
      background: #f8fafc;
    }

    .search {
      flex: 1;
      max-width: 380px;
      position: relative;
    }

    .search input {
      width: 100%;
      border: 1px solid var(--stroke-light);
      background: #ffffff;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 0.68rem 0.95rem 0.68rem 2.4rem;
      font: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .search input::placeholder { color: var(--muted); }

    .search input:focus {
      border-color: #93c5fd;
      background: #ffffff;
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .search svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.45;
      color: var(--muted);
    }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: #ffffff;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr var(--sidebar-w);
      min-height: 0;
    }

    .canvas-wrap {
      overflow: auto;
      padding: 1rem 1.25rem 1.5rem 1.75rem;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.15rem;
      align-content: start;
    }

    .panel-card {
      border: 1px solid var(--stroke-light);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .panel-card.active {
      border-color: #93c5fd;
      box-shadow:
        0 0 0 1px rgba(37, 99, 235, 0.12),
        0 12px 32px rgba(15, 23, 42, 0.1);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.1rem 0.7rem;
      border-bottom: 1px solid var(--stroke);
      background: #f8fafc;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-soft);
    }

    .panel-head .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    .panel-svg {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      background: #fafbfc;
    }

    .link {
      stroke: #6b7c8f;
      stroke-linecap: round;
      pointer-events: none;
      transition: stroke-opacity 0.2s, stroke-width 0.2s;
    }

    .node { cursor: pointer; }
    .node .hit { fill: transparent; stroke: none; pointer-events: all; }
    .node .shell, .node .core { pointer-events: none; }

    .node circle.shell {
      fill: rgba(15, 23, 42, 0.04);
      stroke-width: 1.5px;
    }

    .node circle.core {
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 1.2px;
      transition: filter 0.15s ease;
    }

    .node.faded { opacity: 0.2; }
    .link.faded { stroke-opacity: 0.08; }
    .node.focused circle.core { filter: drop-shadow(0 0 6px rgba(37, 99, 235, 0.35)); }
    .link.highlight {
      stroke: var(--accent);
      stroke-opacity: 0.85;
      stroke-width: 2.2px;
    }

    .detail-aside {
      border-left: 1px solid var(--stroke-light);
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-shadow: -4px 0 16px rgba(15, 23, 42, 0.04);
    }

    .detail-empty {
      margin: auto;
      text-align: center;
      padding: 2.5rem 2rem;
      color: var(--muted);
      max-width: 28ch;
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .detail-empty .orb {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      border: 1px solid var(--stroke-light);
      background: radial-gradient(circle at 35% 30%, rgba(37,99,235,0.12), transparent 60%);
      position: relative;
    }
    .detail-empty .orb::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px dashed rgba(37,99,235,0.25);
    }

    .detail {
      display: none;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }

    .detail.visible { display: flex; }

    .detail-header {
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid var(--stroke);
      flex-shrink: 0;
      position: relative;
    }

    .detail-header::before {
      content: "";
      position: absolute;
      left: 0;
      top: 1.25rem;
      bottom: 1rem;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--detail-accent, var(--accent));
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.2);
    }

    .detail-header .group-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.6rem;
      padding-left: 0.75rem;
    }

    .detail-header h3 {
      margin: 0;
      padding-left: 0.75rem;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.75rem;
      line-height: 1.15;
      font-weight: 400;
      color: var(--text);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 1rem;
      padding-left: 0.75rem;
    }

    .stat {
      border: 1px solid var(--stroke);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.7rem;
      font-size: 0.74rem;
      color: var(--muted);
      background: #ffffff;
    }

    .stat b { color: var(--text-soft); font-weight: 600; }

    .detail-body {
      padding: 1.15rem 1.5rem 1.75rem;
      overflow: auto;
      flex: 1;
    }

    .detail-body h4 {
      margin: 0 0 0.75rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .explanation {
      font-size: 0.93rem;
      line-height: 1.72;
      color: var(--text-soft);
      white-space: pre-wrap;
    }
  </style>
</head>

  <div class="shell">
    <nav id="site-sidebar" class="site-sidebar" aria-label="Network catalog"></nav>
    <div class="shell-main">
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1 id="page-title">Semantic Network</h1>
        <p id="page-subtitle"></p>
      </div>
      <div class="meta">
        <div class="badge">cosine ≥ <strong id="threshold-val"></strong></div>
        <div class="badge"><strong id="quantile-val"></strong> percentile</div>
        <div class="badge accent" id="variant-badge"></div>
      </div>
    </header>

    <div class="toolbar">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="search" type="search" placeholder="Search by contributor ID…" autocomplete="off" />
      </label>
      <div class="hint">Hover a node; click to pin.</div>
    </div>

    <div class="main">
      <div class="canvas-wrap" id="canvas-wrap">
        <div class="panels" id="panels"></div>
      </div>
      <aside class="detail-aside">
        <div class="detail-empty" id="detail-empty">
          <div class="orb"></div>
          <div>Hover any node to reveal the contributor ID and their theoretical explanation.</div>
        </div>
        <div class="detail" id="detail">
          <div class="detail-header" id="detail-header">
            <div class="group-pill"><span class="dot" id="detail-dot"></span><span id="detail-group"></span></div>
            <h3 id="detail-name"></h3>
            <div class="stats">
              <div class="stat">Neighbors <b id="detail-neighbors"></b></div>
              <div class="stat">Words <b id="detail-words"></b></div>
            </div>
          </div>
          <div class="detail-body">
            <h4>Theory explanation</h4>
            <div class="explanation" id="detail-explanation"></div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script id="network-data" type="application/json">{"title": "Semantic Network", "subtitle": "Race · Interactions · Post ML", "threshold": 0.8128, "threshold_quantile_pct": 85, "collapsed": false, "panels": [{"id": "student", "title": "PhD Students (n=60)", "color": "#7DB7E8", "nodes": [{"id": "student-0", "name": "phd_contributor_wbgok", "x": 0.5141087636219379, "y": 0.605140825081483, "degree": 7, "words": 80, "explanation": "Existing work in inequality should increase the probability of discussing racial inequality in social science. Likewise the effect of inequality mentions in news on probability of race inequality research should be higher in social sciences. Female authorship and social science increases the attention to inequality overall but the marginal effect of female share of authors is smaller in social science and the marginal effect of paper being in social science is smaller as the share of women authors is higher."}, {"id": "student-1", "name": "phd_contributor_ul2n5", "x": 0.08, "y": 0.490204570687561, "degree": 0, "words": 106, "explanation": "White people are less likely to be interested in racial inequality because they have not been directly or indirectly exposed to racism to the same extent non-white people have. This effect is lessened when the researcher is female, since women, due to direct and indirect exposure, are more likely to be interested in gender inequality, which share some structural similarities with racial inequalities. Lastly, this effect will be lessened when there is prevalent coverage of racial inequalities in the news and in academic publications, since this can make white people more interested in the topic in general and consider it more as a possible research area."}, {"id": "student-2", "name": "phd_contributor_yedjp", "x": 0.24356267239798862, "y": 0.48958669373221997, "degree": 0, "words": 70, "explanation": "The likelihood of black scholars publishing on racial inequality will increase as news_inequality_mentions_3_years increases, because there are more events that are currently relatable for them. Social science scholars are more likely to publish the topic, as they observe more papers importantly dealing with the issues in recent years. White scholars, who are less likely to publish inequality issue, are more likely to publish when working with diverse set of scholars."}, {"id": "student-3", "name": "phd_contributor_c5sgk", "x": 0.4279184872316476, "y": 0.8371652121456353, "degree": 0, "words": 125, "explanation": "The likelihood that a published paper discusses racial inequality is driven by two mechanisms: the volume of racial inequality submissions and the probability that such submissions are accepted. Journals play a crucial role in shaping demand for inequality scholarship, and such demand is particularly pronounced when scholarly and public attention converge on the topic. Journal disciplinary orientation may be crucial because the acceptance probability for racial inequality submissions may approach zero in non-social science disciplines. In such cases, the variables influencing submission volume and acceptance likelihood may be stronger in social science journals than in other journals. However, disciplinary orientation has diminished marginal effects for scholars who already have strong intrinsic motivation, as reflected in their publishing inequality work in non-social science journals as well."}, {"id": "student-4", "name": "phd_contributor_45ypj", "x": 0.6355746384246453, "y": 0.7502526839544692, "degree": 0, "words": 53, "explanation": "Female authors may feel additionally comfortable tackling racial inequality research questions in a diverse team, which would attenuate the negative direct effect of female. Diverse groups of scholars may be more attuned to developments of publications in the research area, hence the positive effect of prior paper mentions may be exacerbated for them."}, {"id": "student-5", "name": "phd_contributor_5nazt", "x": 0.7827472656024984, "y": 0.8477549688997974, "degree": 0, "words": 27, "explanation": "I think a social science journal reaches a large audience, and as the number of papers and news articles increases, their combined effect can therefore predict race."}, {"id": "student-6", "name": "phd_contributor_mdmrd", "x": 0.2585234901957057, "y": 0.39153934601512774, "degree": 1, "words": 99, "explanation": "I would assume that the higher the share of black authors in a social science paper, the more likely the this paper is about racial inequality. Similarly, news_inequality_mentions should reinforce the share of racial inequality topics in social science papers. This is because African American are relatively speaking more prone to be victims of racial inequality and receive the most media coverage. Together, the two factors should reinforce each other such that when news cover more racial inequality and the authors are mostly made-up of black researchers, the probability of the topic being racial inequality rated should be higher."}, {"id": "student-7", "name": "phd_contributor_kmwj4", "x": 0.47936856370407027, "y": 0.6705239791125421, "degree": 1, "words": 180, "explanation": "As the number of authors increases, the diversity score becomes a more important signal, in terms of how much it deviates from a representative sample, and so does the proportion of Black authors; they seem about equally likely to be important. If there are more mentions of inequality in papers, then the fact that the journal is on engineering and technology should not be as important, though the number-of-authors factor would matter more just because the mathematics makes it harder to tell a convincing alternative just-so story. Since social science researchers should be more plugged into the news and papers on inequality discourse, they should be more influenced by a higher amount of discourse on the topic to research racial inequality themselves. Since women are less underrepresented in social science, female authorship should be less important there, particularly when discussing racial inequality; in social science there might be room to separate the two kinds of inequality, whereas in natural science, given the likely focus of the journals, they might be covered together in a special feature on inequality among researchers."}, {"id": "student-8", "name": "phd_contributor_zbjey", "x": 0.9199999999999999, "y": 0.5851895555660914, "degree": 0, "words": 36, "explanation": "If they are social science or news/papers related to female, it will direct the audience more towards gender issues. I believe they are not talking mainly about racial inequality. Therefore, I gave them all negative signs."}, {"id": "student-9", "name": "phd_contributor_2xy9o", "x": 0.3784467203894133, "y": 0.5654831284765782, "degree": 8, "words": 111, "explanation": "Authors in social science publish more papers on issues relating to racial inequality when they perceive news relating to inequality, or when they see more papers published on inequality, more so than other fields. This makes sense as social science is by itself fundamentally involved in the matters regarding social inequality as a whole. Hence the increase in racial inequality should follow the increase in inequality topics in general. Female authors are led to publish more papers mentioning gender inequality rather than racial inequality in social sciences, as they are more predominantly concerned with that topic, as they might've gone into social science with that interest in mind from the start."}, {"id": "student-10", "name": "phd_contributor_z7ttj", "x": 0.5903172512291898, "y": 0.8241469203665474, "degree": 0, "words": 113, "explanation": "The \"Hispanic and Other\" identifier is ranked as a primary positive predictor because marginalized groups often possess the \"positional knowledge\" required to investigate racial stratification, whereas the \"White\" and \"Asian\" identifiers are expected to have negative signs, assuming these groups are more likely to align with dominant, race-blind academic traditions or technical disciplines. \"Paper Inequality\" is a crucial positive indicator because it serves as a direct thematic precursor; a study already quantifying disparity is statistically adjacent to race inequality research. Conversely, \"Natural Science\" and \"Engineering and Technology\" are expected to have strong negative signs because these fields are \"topic-constrained,\" prioritizing objective physical or technical systems over the socio-political structures necessary to analyze race."}, {"id": "student-11", "name": "phd_contributor_le01h", "x": 0.4713751751924713, "y": 0.5037996462953819, "degree": 12, "words": 158, "explanation": "Paper and news attention to inequality is the most important factor, and the second order interaction compounds when the paper is published in social science platform because it is realistic outlet for opinions regarding racial ineqaulity. In addition, females are strong advocates for racial inequality in the field of social science. This may because of females being a gender minority in academia. When a paper is dominated by asian authors and the paper is published in engineering and technology, the paper tends to be irrelevant in discussion of racial inequality so it should be a strong negative predictor of second order interaction. On the other hand, social science paper with high author diversity implies a higher probability to discuss raical inequality because a paper regarding race may need different perspective from different races so a cross-race collaboration is likely. Finally, a social science paper published by a minority group like black tend to be discussing social inequality issues."}, {"id": "student-12", "name": "phd_contributor_giyw7", "x": 0.5570144935636003, "y": 0.5088429443159118, "degree": 16, "words": 158, "explanation": "These second-order effects are driven primarily by disciplinary opportunity structures and variations in how salient racial or gender inequality are in particular moments, with somewhat less emphasis on author-race-specific representation effects. The interaction between social science and paper inequality mentions over the prior three years suggests that racial inequality research is responsive to shifts in attention within social science. The interaction between social science and news inequality mentions over the prior three years expands this pattern beyond the academy, suggesting that work on racial inequality is shaped by the broader societal narrative or discourse as well as by disciplinary structure and focus. The negative female × social science interaction suggests that the marginal effect of female authorship is smaller within social science, and that identity effects might matter more in fields where racial inequality is not already being explored, unlike social science. Overall, identity effects are more conditional and potentially more visible in other fields than social science."}, {"id": "student-13", "name": "phd_contributor_7x004", "x": 0.7853892101694946, "y": 0.23464997116459557, "degree": 0, "words": 30, "explanation": "I think the interactions are positively associated overall. The main thing is the female * social_science interaction; it is the thing for the positive force in reducing the racial inequality."}, {"id": "student-14", "name": "phd_contributor_ayd29", "x": 0.5477336453868095, "y": 0.41522533503372955, "degree": 15, "words": 259, "explanation": "The interaction between social_science and paper_inequality_mentions_3_years (+) is the most important because social scientists are uniquely positioned to respond to rising academic discourse around inequality. When the broader scholarly community is paying more attention to inequality, social scientists have the disciplinary tools and incentive structures to translate that attention into racial inequality research specifically. Natural scientists and engineers are unlikely to shift their research agendas in response to academic trends about inequality, so the time-lagged academic mentions only matter meaningfully within social science. The interaction between social_science and news_inequality_mentions_3_years (+) follows similar logic. When media coverage of inequality increases, social scientists are the scholars most likely to respond by producing research on racial inequality. Public salience of inequality topics creates demand for academic engagement, but only scholars in disciplines that study social phenomena can supply that engagement. This reinforces the idea that the time-lagged measures operate conditionally through disciplinary context. The interaction between female and social_science is negative because the marginal contribution of female authorship is weaker within social science. A plausible explanation is that social science papers already have a high baseline probability of discussing racial inequality, so being female adds less predictive value in that context. It is also possible that female social scientists disproportionately channel their research orientation toward gender inequality rather than racial inequality. Outside social science, where any engagement with inequality is rarer, being female may be a stronger signal that the paper touches on racial inequality because it reflects a more deliberate choice to study marginalization topics despite lacking the typical disciplinary framing."}, {"id": "student-15", "name": "phd_contributor_558ea", "x": 0.6430485291522262, "y": 0.2863847283884431, "degree": 0, "words": 76, "explanation": "If a paper is both \"Social Science\" and \"Engineering and Technology\", then it could discuss racial inequality in the Engineering and Technology field. However, if it's just Engineering and Technology paper, then it's unlikely to discuss racial inequality. News/paper mentions are more informative once focused on a single field, i.e., social sciences. Both female and social_science have positive main effects, and having both would be too much, so the interaction is negative to tune that down."}, {"id": "student-16", "name": "phd_contributor_dwdg8", "x": 0.2884061681891346, "y": 0.680437566130559, "degree": 2, "words": 50, "explanation": "I think more authors and more race diversity of authors will increase the possibility of a paper discusses racial inequality. Similarly, more authors working in social science research area and more black people in a country that is more diverse will increase the possibility of a paper discusses racial inequality."}, {"id": "student-17", "name": "phd_contributor_fojz7", "x": 0.38127052425217867, "y": 0.48544470560812936, "degree": 5, "words": 92, "explanation": "Social_science x black is likely positive since racial inequality research is concentrated in social sciences, and Black authors may increase the likelihood that racial issues are explicitly addressed. They reinforce attention to racial inequality. For black x paper_inequality_mentions_3_years, it should be positive Black authorship may further increase the probability that inequality is framed in racial terms after seeing peer academic papers on similar issues. For social_science x paper_inequality_mentions_3_years, it's also likely positive, as inequality-focused trends within social science disciplines are especially likely to sustain and deepen discussion of racial inequality over time."}, {"id": "student-18", "name": "phd_contributor_ogfiu", "x": 0.09094294634400932, "y": 0.43293003260984075, "degree": 0, "words": 80, "explanation": "Human beings have a natural tendency to investigate problems that they encounter themselves, like in user entrepreneurship or women doctors researching diseases/syndromes such as endometriosis. Fewer White male researchers may do research on racial inequality than racial minority researchers or women who may have paid the price of the inequality. Being a social science researcher and being exposed to academic papers about racial inequality and reading news articles about racial inequality increases the likelihood of writing papers on racial inequality."}, {"id": "student-19", "name": "phd_contributor_rvget", "x": 0.823371320108997, "y": 0.34454628598905446, "degree": 0, "words": 92, "explanation": "If two features share the same channel of affecting the prediction, adding the interaction term of these two features will weaken each other's influence on Y. If the paper is in social science, the marginal impact of popularity on inequality topics in academia will be amplified, and similarly, the marginal impact of popularity on inequality topics in society will be amplified. Because the social science paper tends to have more female authors, if the paper is known to be in social science, the marginal impact of the female authorship will become smaller."}, {"id": "student-20", "name": "phd_contributor_zcof0", "x": 0.6719579863864814, "y": 0.5336720999119214, "degree": 4, "words": 137, "explanation": "These interactions divide into two clear mechanisms: how the academic domain amplifies external trends, and how it dampens demographic signals. The social sciences act as a massive multiplier for both public discourse (news_inequality_mentions) and academic momentum (paper_inequality_mentions). When inequality is trending in society or recent literature, social scientists are uniquely positioned to formalize that interest into new papers, meaning the domain and the environmental momentum positively reinforce each other (+). In technical fields outside the social sciences, a high percentage of female authors is a standout, highly predictive signal that the paper will focus on equity. However, within the social sciences, researching systemic inequality is already the baseline norm for the entire field. Because the domain itself drives the topic so strongly, the specific gender breakdown of the author team becomes less important for predicting the outcome."}, {"id": "student-21", "name": "phd_contributor_yg9p5", "x": 0.47534702440076354, "y": 0.4756402401635439, "degree": 21, "words": 145, "explanation": "social_science, paper_inequality_mentions_3_years: I think that although the social science field already provides a home for studying racial inequality, a high volume of recent academic publications on the topic signals a hot research trend/topic. This can act as a multiplier, encouraging more authors to frame their work around this topic to meet current peer-review interests. And the interaction should thus be positive. authors_race_diversity_score, news_inequality_mentions_3_years: A racially diverse team often brings a broader range of perspectives to a project. They are more likely to possess the experience and interest to study racial inequality. When there is more news coverage, the public interest serves as a catalyst, increasing the chance for them to publish on these topics. social_science, female: Social science already encourages inequality-related research, so the additional effect of female authorship is smaller within this field. Female may matter more outside social science, making the interaction negative."}, {"id": "student-22", "name": "phd_contributor_5wz57", "x": 0.4877208265040761, "y": 0.6085275059828326, "degree": 8, "words": 148, "explanation": "Social science is the disciplinary home of race inequality research. Citing recent academic papers on inequality signals active engagement with that specific literature. Thus, when a social science paper actively engages with recent inequality scholarship, it is highly likely to be contributing directly to the race inequality discourse. Social science studies social phenomena, including current events. Citing news on inequality indicates the paper is responding to real-world gender issues. Therefore, when a social science paper grounds itself in contemporary news about inequality, it is likely addressing race inequality as a live societal concern. Female authors are generally more likely to study race inequality. Social science papers already have a high baseline probability of addressing gender topics. Therefore, the \"boost\" from female authorship matters less within social science because the field itself already settles papers toward the topic. In non-social science fields, female authorship is a more critical signal."}, {"id": "student-23", "name": "phd_contributor_wqux6", "x": 0.3100348207121316, "y": 0.4493661137780497, "degree": 4, "words": 86, "explanation": "If the inequality related topics are published in the past 3 years, and the paper is a social_science paper, it would be a stronger indicator that the paper could be a racial inequality paper. Similar logic for the news inequality mentions. Finally, if the paper is a social science paper, and the authors are of different races, it would be more likely that the paper could be focusing on racial inequalities because the author team could be using their strenghten networks and experiences for the publication."}, {"id": "student-24", "name": "phd_contributor_mcaaw", "x": 0.5178033549027315, "y": 0.5201599932888635, "degree": 11, "words": 148, "explanation": "Interactions with the social science variable are going to have the largest effect on whether a paper discusses racial inequality, due to the base rate being so much larger than the other fields. Natural science papers rarely discuss racial inequality, though there may be some that do during periods where racial inequality is really popular in the public/academic discourse. For the specific variables, the discourse variables, such as paper and news mentions, are likely to have large positive interactions, as they will increase the likelihood that social science papers discuss racial inequality but probably have no effect on whether papers in other fields discuss racial inequality. The signal of female authors is much less in social science than in the other fields: authors do not necessarily need diverse author teams to discuss inequality because they study this topic already, and it is not a special article or something."}, {"id": "student-25", "name": "phd_contributor_1kwwe", "x": 0.4158052615599734, "y": 0.08, "degree": 0, "words": 63, "explanation": "Social science, news mentions, and paper mentions jointly determine the popularity and how timely the research is within the research community. News mentions and paper mentions boost each other in terms of the popularity of the topic, but all are provided by the condition that the paper will be submitted to the social science domain, which is most relevant for racial-equality typed research."}, {"id": "student-26", "name": "phd_contributor_iv4qg", "x": 0.3968383820840718, "y": 0.26816753935250803, "degree": 2, "words": 29, "explanation": "country_race_diversity_score, paper_inequality_mentions_3_years, and news_inequality_mentions_3_years all indicate that the paper is more likely to discuss racial inequality, but only if the paper studys social science. Therefore, social_science reinforces their effects."}, {"id": "student-27", "name": "phd_contributor_c9vs4", "x": 0.5908193072874166, "y": 0.09471475391275344, "degree": 0, "words": 65, "explanation": "My reasoning for these interactions and their signs is based on my own limited observations. While I do not have a formal theoretical explanation, social scientists are more aware of news and are more motivated by other literatures, thus creating positive second order interactions between social science and news inequality mentions, and between social science and paper inequality mentions. These factors appear together very frequently."}, {"id": "student-28", "name": "phd_contributor_mrqrj", "x": 0.2915523251318112, "y": 0.34221815796815036, "degree": 0, "words": 66, "explanation": "Because race is a politically charged topic, news inequality mentions in the last 3 years may be predictive. Social science aligns with these issues and would move hand-in-hand with both news inequality mentions and paper inequality mentions. A more racially diverse country could also be more likely to do research in this area as the news talks about it more and have a positive interaction effect."}, {"id": "student-29", "name": "phd_contributor_zi2lh", "x": 0.32941046502636795, "y": 0.7011940860365949, "degree": 3, "words": 63, "explanation": "Black authors in social science are more likely to discuss race than not in social science. With increasing diversity in author countries, the higher proportion of black authors are more vocal about race. Race in natural sciences is not necessarily a strong predictor of racial inequality, so the effect of race on racial inequality paper is heterogeneous based on field of the paper."}, {"id": "student-30", "name": "phd_contributor_559wp", "x": 0.5392928604492343, "y": 0.34251659411852703, "degree": 9, "words": 86, "explanation": "First of all, I think the social_science is the key factor here because there must be a huge difference for the number of racial inequality studies between social science journals and other ares. Therefore, the interaction between social_science and paper_inequality_mentions_3_years and the interaction between social_science and news_inequality_mentions_3_years are positive because when the popularity increases about this research, there should be more papers in social science area. Social_science and female has another logic behind. In social science, female authors might prioritize gender inequality than racial inequality research."}, {"id": "student-31", "name": "phd_contributor_34xvl", "x": 0.46042874003288514, "y": 0.3344022430999295, "degree": 8, "words": 105, "explanation": "For social_science × paper_inequality_mentions_3_years, the more there are mentions in the last 3 years, the more social_science papers are about inequalities. For social_science × news_inequality_mentions_3_years, the same reasoning applies: the more there are mentions in the news in the last 3 years, the more social_science papers are about inequalities. For female × social_science, natural_science and engineering papers about race are primarily written by women. This is similar, albeit phrased differently, to the idea that papers in natural_science and engineering_and_technology with large consortia of authors are often focused on hard science topics, and perhaps the only papers that discuss racial inequalities are commentaries with few authors."}, {"id": "student-32", "name": "phd_contributor_kyj4r", "x": 0.2779658547751757, "y": 0.2460797282606117, "degree": 0, "words": 61, "explanation": "1. Social science researchers have more interests and tendency to talk about the racial issue (not restricted in black guys), which will weaken the black variable's effect on Y. 2. Social science researchers will focus more on \"trendy\" social issues (they have more concentrated common interests), which will strengthen paper_inequality_mentions_3_years on Y. 3. The reason is the same to point 1."}, {"id": "student-33", "name": "phd_contributor_ama1n", "x": 0.26623387751202476, "y": 0.8833823572987373, "degree": 0, "words": 74, "explanation": "For black individuals to pursue a project in racial inequality, they probably need to be in a country with strong racial diversity, and they are much more likely to pursue that when inequality issue is very prominent and when there are well-established literature that enable them to build upon. This is basically a Kuhnian science story where if there are more editors and support in the journals it's more likely to get something published."}, {"id": "student-34", "name": "phd_contributor_0k61g", "x": 0.6575299567992899, "y": 0.3601649347014533, "degree": 0, "words": 90, "explanation": "These interaction terms are probably mostly positive because, combined, they become stronger indicators of interest in studying racially related problems, though the main effects already have a positive effect on the likelihood of a racial inequality paper. I think black people studying social science is a very strong signal, followed by the overall trends in the country and the academics interacting with the social science indicator. I include social science in my choices, but I am a bit hesitant to think the interaction between female and social science is negative."}, {"id": "student-35", "name": "phd_contributor_dpw1t", "x": 0.3966454340833974, "y": 0.6617230210775743, "degree": 3, "words": 180, "explanation": "Whether a paper discusses racial inequality is shaped by interactions among disciplinary context, broader inequality attention, and author background. Social science fields are structurally more oriented toward studying race, discrimination, and stratification, so periods of heightened academic or media attention to inequality should increase the likelihood that scholars address racial issues especially strongly within social sciences, because these fields are more responsive to inequality-related debates. Author composition also plays a meaningful role. A higher share of Black authors or authors from more racially diverse countries may increase the probability of discussing racial inequality, as lived experience and social context can influence research interests and topic selection. However, the impact of certain author characteristics, such as female representation, may depend on the disciplinary setting. In fields where racial inequality is already widely studied, additional demographic diversity may have a smaller marginal effect, while in fields where the topic is less common, author background may exert a stronger influence. Overall, research topics emerge from the interaction between institutional norms, societal attention to inequality, and the perspectives that scholars bring to their work."}, {"id": "student-36", "name": "phd_contributor_1gofd", "x": 0.32170412886325817, "y": 0.4077182149251756, "degree": 2, "words": 95, "explanation": "If the paper is in social science and mention other papers about inequality in 3 years, more likely it is about racial inequalities. If the paper is in social science and mention news articles about inequality in 3 years, more likely it is about racial inequalities. If the paper has both news and papers about racial inequality, there should be a positive interaction and it is more likely it is about racial inequalities. Others looks less relavent. Authors' positionalities in theory should play little to no roles in whether their view is progressive or not."}, {"id": "student-37", "name": "phd_contributor_4luvh", "x": 0.40997460000927943, "y": 0.5874337318067738, "degree": 4, "words": 163, "explanation": "Researchers who publish papers in social science journals generally have more care about social science topics, including racial inequality. Therefore, when both academic papers and news mention inequality issues more, they will become more aware and sensitive, and likely write more papers to address this topic that are published in social science journals. Social science journals will have higher positive response to mentions of inequality issues. Relatedly, researchers who publish papers on social science journals are generally aware of racial inequality, and willing to address it in papers, as they are already in the community of high awareness and willingness, and they are exposed to such discussions. Therefore, it does not matter much if the authors of social science papers are dominated by female. Similarly, if the author list is already dominated by female, the author group is generally aware of the inequality issue, and it is more likely to address it even if the paper is not published in social science journals."}, {"id": "student-38", "name": "phd_contributor_mfkek", "x": 0.5547860572623902, "y": 0.5640783149975858, "degree": 12, "words": 170, "explanation": "Research on racial inequality is shaped by disciplinary amplification of inequality salience and by how author identity interacts with field context. The positive social_science × paper_inequality_mentions_3_years interaction reflects that path dependence operates most strongly within social science: when academic attention to inequality is already high, social science fields are especially likely to channel that momentum into racial-inequality research. Similarly, the positive social_science × news_inequality_mentions_3_years interaction reflects that social sciences are particularly responsive to public discourse, so media attention to inequality disproportionately increases racial-inequality research in those disciplines. The negative female × social_science interaction suggests a diminishing marginal effect: because social science already has a high baseline probability of addressing racial inequality, the additional influence of female authorship is smaller there. In contrast, in non-social-science fields where racial inequality is less institutionally embedded, female authorship may play a stronger role in shifting research attention toward racial inequality. Thus, disciplinary structure is the main amplifier of inequality salience, while the influence of author gender is context-dependent and relatively stronger outside social science."}, {"id": "student-39", "name": "phd_contributor_81m5u", "x": 0.19171256165661796, "y": 0.8686030555865144, "degree": 0, "words": 92, "explanation": "1. number of authors x country_race_diversity_score measures the total impact of diverse culture on the team. A higher score leads to a higher possibility of the team working on diversity-related issues. 2. number of authors x white shows the total number of white people in the author team. More white people may give a sign on working on more traditional studies. 3. number of authors x author_race_diversity_score shows the total racial diversity of the team. A larger and more diversity team may work on topics that is more related to racial inequality"}, {"id": "student-40", "name": "phd_contributor_blzc1", "x": 0.6738401641054833, "y": 0.19664854660648018, "degree": 0, "words": 89, "explanation": "I would focus on interactions that combine the strong first-order factors: social_science × paper_inequality_mentions_3_years and social_science × news_inequality_mentions_3_years, since both variables are strong positive indicators in the first-order setting. I would also include social_science × female, since the proportion of female authors in social science may be higher than the proportion of male authors. However, this may not be fully accurate, because some feature combinations could be quite rare. As a result, the usefulness of second-order interactions may depend heavily on the modeling approach and the amount of regularization."}, {"id": "student-41", "name": "phd_contributor_c5rzh", "x": 0.4523639790855685, "y": 0.3844499395176108, "degree": 12, "words": 102, "explanation": "First, when a paper belongs to the social sciences, the effect of recent academic attention to inequality (paper_inequality_mentions_3_years) should become stronger, since social science disciplines are more responsive to ongoing scholarly debates about inequality. Similarly, the interaction between social_science and news_inequality_mentions_3_years should be positive because social science research often responds to issues that receive increased public and media attention. When inequality becomes a prominent topic in the news, scholars in social science fields are more likely to study and publish work on related topics such as racial inequality. Finally, the interaction between the proportion of Black authors and the authors_race_diversity_score is expected"}, {"id": "student-42", "name": "phd_contributor_iuy3c", "x": 0.34923535009135115, "y": 0.1437812776115222, "degree": 0, "words": 245, "explanation": "I'm less certain here, but I think publication lag would be incredibly important merely because of the utilitarian aspect of research. If we can't get published, we can't get jobs / tenure. Therefore it is smart to publish on something that you KNOW can probably get published, based on current trends. I also don't believe the literature on diversity is anywhere near saturated, so in this causal model I don't take into account a backward slide because there are \"too many\" diversity pubs. That said, I may be too bullish since the recent administration is negative on diversity; I'm influenced again here by local stories in my network, where researchers are pursuing diversity irrespective of the current administration's preferences. I would interact publication lag/current trends with social science journals/pubs -- it's going to have more influence on that giant main effect than on smaller personal level identity mechanisms. I bet it influences those as well, but they're not in the top set of interactions due to prevalence reducing power. I want to include the female x social science negative interaction here, but I have only weak hunches of the explanatory theory. Perhaps females notice racial inequality more in non-social science fields? Or perhaps there are more females in social science, so when you write about inequality it is only one of many topics you write about; versus when you are a female in a non social science, inequality is a more dominant topic for you."}, {"id": "student-43", "name": "phd_contributor_upzfq", "x": 0.4950599628280291, "y": 0.3020597409386539, "degree": 3, "words": 76, "explanation": "People from these race alone have less of an effect on racial inequality prediction, but these population in social science field might be a much stronger predictor. Social science combined with paper_inequality_mentions_3_years and social science combined with news_inequality_mentions_3_years are the strongest positive second-order interactions. Female combined with social_science has a negative interaction effect. I believe white people are less interested in racial inequality research whereas the other two groups, black and asian might be more interested."}, {"id": "student-44", "name": "phd_contributor_7nisc", "x": 0.5456277142093776, "y": 0.46620892590143515, "degree": 16, "words": 118, "explanation": "I believe that when articles focus more on social science and when inequality is discussed more frequently in either academic papers or news, they are more likely to address racial inequality. An increase in attention to inequality, whether in the news or in scientific publications, is most noticeable within the field of social science. Therefore, both interaction terms are positively correlated. The interaction between female authorship and social science is more difficult to interpret. It is negatively correlated, which may be due to the fact that the first-order terms female authorship and social science are already positively correlated with racial inequality. As a result, when the interaction term is included in the model, its estimated effect becomes negative."}, {"id": "student-45", "name": "phd_contributor_41mim", "x": 0.6467275015818142, "y": 0.5687968762648492, "degree": 1, "words": 97, "explanation": "The social science literature is highly reactive to news trends and the academic literature, so interactions involving social science and recent news or academic discussion of inequality would be expected to be nonzero rather than strictly linear. Interactions between categorical features are not likely to be strictly linear in general. In line with the idea of intersectionality, black women would be more likely to consider performing research on racial inequality; furthermore, when the share of female authors is high, one would expect that the paper would be more likely to discuss racial inequality regardless of the field."}, {"id": "student-46", "name": "phd_contributor_8fcno", "x": 0.51006040010654, "y": 0.9199999999999999, "degree": 0, "words": 54, "explanation": "I have a similar thinking process as to before: I expect that much of the work in racial inequity is published in social sciences and that the intersection of particular author groups -- that may have more firsthand experience being a minority race -- and the social sciences domain to have a strong correlation."}, {"id": "student-47", "name": "phd_contributor_9b8k7", "x": 0.19119682180002684, "y": 0.6447424096136467, "degree": 0, "words": 70, "explanation": "Black scholars opt more into social science and they are the most likely to study racial inequality because of personal experiences (or perceived biases). This bias can be reinforced when the disciplinary environment already treats inequality as a central topic (as it happens inside the social science discipline). When academic discourse on inequality is popular, these biases can get amplified making these scholars especially likely to engage with the topic."}, {"id": "student-48", "name": "phd_contributor_9pm5a", "x": 0.7239179784557642, "y": 0.4532705065880026, "degree": 0, "words": 67, "explanation": "Social science and the discussions about inequality in the past three years both suggest the theme of the paper; however, when both appear simultaneously, it almost confines the article's theme to the field of inequality, either racial or gender, so the second-order term is positive. Meanwhile, there are relatively more female researchers in social science, so their marginal effect diminishes, and thus the second-order term is negative."}, {"id": "student-49", "name": "phd_contributor_2rhpt", "x": 0.6078384570222708, "y": 0.44280331752034846, "degree": 8, "words": 151, "explanation": "Social science with paper mentions and news mentions are positive interactions because social science is the field most likely to absorb broader conversations about inequality happening in academic literature and public discourse. When inequality is already being discussed in papers or in the news, social science provides a space where those conversations can be taken up as legitimate research questions, so those factors reinforce each other. Female with social science is a negative interaction for racial inequality because scholars who experience gender inequality may focus their attention on gender topics rather than race, especially in social science where both are legitimate areas to study. Women might be concentrated in subfields like developmental psychology or health where racial inequality is less central, while racial inequality research happens in other subfields with more men. Identities do not stack neatly. Experiencing one form of marginalization does not automatically translate into engaging with all forms."}, {"id": "student-50", "name": "phd_contributor_z9ezk", "x": 0.16436228349769477, "y": 0.57620283942212, "degree": 0, "words": 106, "explanation": "Public reports and discussion of racial inequality draw the attention of scholars to the issue (IV). Those studies or even special issues are more likely to be published in social science journals (positive M1). In a country with higher racial diversity (e.g., the US compared to Japan), scholars are more likely to collect first-hand data and observation to conduct studies (positive M2). Racial minorities, such as black scholars, are more likely to collect first-hand data and observation to conduct studies as it is easier to gain trust from target sample groups from the same racial group (positive M3). It is unclear why female would be correlated."}, {"id": "student-51", "name": "phd_contributor_z2j87", "x": 0.5532334062214929, "y": 0.40124286971811807, "degree": 16, "words": 124, "explanation": "The most important interaction for predicting racial inequality discussion is social_science * paper_inequality_mentions_3_years (+): social science papers are more responsive to recent academic trends in inequality research, amplifying discussion when the broader academic community is already engaged. Similarly, social_science * news_inequality_mentions_3_years (+) captures responsiveness to public discourse, as social scientists are especially responsive to shifts in public discussion about inequality. The negative female * social_science interaction reflects a ceiling effect: social science papers discuss racial inequality at high rates regardless of author gender, so female authorship adds less predictive value within social science than in other disciplines. The female * social_science interaction is negative not because these features conflict, but because social_science already captures much of the variance that female authorship would otherwise explain."}, {"id": "student-52", "name": "phd_contributor_872ey", "x": 0.30528726485671775, "y": 0.5686799916033543, "degree": 6, "words": 122, "explanation": "Black people are more likely to suffer from racial inequality. However, this factor along may not be enough to conclude that the topic of the paper is racial inequality. Since social science concerns racial inequality more, a paper in social science with mostly black authors may imply a higher chance of racial inequality being the paper's topic. As research on racial inequality usually involves survey and lots of efforts, large number of black co-authors may imply higher chance of racial inequality being the paper's topic. Higher paper_inequality_mentions_3_years means that the topic of inequality in general, which subsumes racial inequality, is trendy. Under such circumstance, the mutual interest of an author list comprised of mostly black authors would more likely be racial inequality."}, {"id": "student-53", "name": "phd_contributor_7trlj", "x": 0.4341942471552688, "y": 0.43201564482159144, "degree": 9, "words": 197, "explanation": "Black researchers would be more likely to focus on race inequality. During periods of high media coverage of inequality, their motivation to publish on racial inequality would increase, going beyond what either variable predicts alone. This is the most important interaction because it puts two separate chains, author race and news coverage, together and creates the strong combined effect on the outcome. Papers in social science journals during periods when inequality is more frequently mentioned in papers over the prior three years would also have a higher probability of being about racial inequality, beyond what either social science or prior paper inequality mentions predict alone. This is a stronger interaction than Black and female representation together because it directly combines social science with broader paper-level attention to inequality. During periods of high news coverage of inequality, female authors, regardless of their race, might be more motivated to pick social science journals. High public coverage would boost the effect of female authorship through the social science mediator, thus increasing the probability of the paper being about racial inequality. This interaction is weaker than the first two because it operates through only one mechanism, social science as the mediator."}, {"id": "student-54", "name": "phd_contributor_1nw3h", "x": 0.17580586504612644, "y": 0.7468227145241716, "degree": 0, "words": 128, "explanation": "In a more racially diverse country, racially underpriviledged group--black and hispanic in this case-- are more likely to have experienced issues associated with racial inequality. Therefore, a higher country race diversity score would imply that the racially disadvantaged group has a higher chance of conducting research on racial inequalities, reinforcing the races' influence on predicting the content of the paper. Conversely, if more authors are from the underpriviledged group, the effect of living in a more diverse country is pronouced. Similarly, in a more racially diverse country, priviledged group--white in this case--would witness more issues associated with racial inequality, leading them to consider more working on this problem. Conversely, if more authors are from the priviledged group, the effect of living in a more diverse country is pronouced."}, {"id": "student-55", "name": "phd_contributor_0r0es", "x": 0.5789909172497381, "y": 0.4166084634802784, "degree": 14, "words": 163, "explanation": "The selected interaction effects reflect relationships between disciplinary context, temporal trends in academic and societal discourse, and author composition in shaping discussions of racial inequality. The interaction between social_science and paper_inequality_mentions_3_years is strongly positive, as social science disciplines are more sensitive to changes in academic attention and are more likely to amplify emerging trends in inequality research. Similarly, the interaction between social_science and news_inequality_mentions_3_years is positive, reflecting the responsiveness of these fields to broader societal discourse and media attention. The interaction between female and social_science is better understood as exhibiting diminishing marginal effects rather than reinforcement. While female authorship contributes to increased attention to inequality-related topics, this effect is stronger in disciplines where such topics are not already central. In social sciences, where racial inequality is already a well-established area of research, the additional contribution of female representation becomes smaller, leading to a negative interaction effect in marginal terms. This reflects a saturation or substitution mechanism, where multiple predictors operate through overlapping channels."}, {"id": "student-56", "name": "phd_contributor_ly6qj", "x": 0.46902810818688406, "y": 0.4395297887337674, "degree": 18, "words": 117, "explanation": "For racial inequality, the most important second-order interactions are social_science × paper_inequality_mentions_3_years, social_science × news_inequality_mentions_3_years, and gender × social_science. Social science papers are more likely to discuss racial inequality when there have been more recent inequality mentions in papers, since specifying social science along with paper_inequality_mentions_3_years should help narrow down the articles to those that are actually relevant. Social science researchers are also more likely to write about racial inequality if inequality appears often in the media, because they may feel backed up by the current political environment. Gender in combination with social_science is also likely to matter. Black authorship is likely not an important variable in these interactions, because there are not that many Black academics."}, {"id": "student-57", "name": "phd_contributor_drr4r", "x": 0.4122429209687313, "y": 0.7467445150890366, "degree": 1, "words": 178, "explanation": "Whether a paper discusses racial inequality is better understood as a question of how science/research topic is being selected as a professional activity, rather than simply who is more likely to care about racial inequality. Racial inequality is a much more important and popularly discussed theme in social science than natural science or engineering, while racial inequality and inequality in general are topics that are much further away from the typical pursuit of engineering and technology disciplines. Black female scholars, in my observation in life and academic interactions, may be the most likely to highlight racial inequality aspects of various topics, but writing a paper usually means that the authors both personally care about the topic and professionally think the topic is worth working on for professional rewards. Theories from science and technology studies (STS) can help explain how scientists make decisions on what topics to pursue. Second-order interactions make sense because a paper’s discussion of racial inequality depends on the combination of disciplinary setting, personal concern, and whether recent professional trends make the topic seem worth pursuing."}, {"id": "student-58", "name": "phd_contributor_u3rga", "x": 0.38020050793220284, "y": 0.36103634097777476, "degree": 0, "words": 66, "explanation": "I expect large social science papers to have gathered the most authors because of racial inequality mentions. I expect social science papers alone to be influenced by inequality mentions in the news and in academic papers. I expect females in social science settings to be particularly interested in racial inequality mentions. I expect large natural science papers to be focused more on large, complex natural phenomena."}, {"id": "student-59", "name": "phd_contributor_5cv1y", "x": 0.48259733488738443, "y": 0.5505356126026391, "degree": 8, "words": 190, "explanation": "For the second-order interaction of social_science-black, most of the studies on racial inequality are centered on the discrimination of black people in regions where white people are the majority; therefore, racial inequality benefits white people and harms black people, and therefore, is a topic that is highly influential for most black people who study social science. Based on this, black authors studying in the social sciences are more likely to study this topic. The inverse logic applies to papers with white authors. For the same reason, papers by authors with a lower diversity_score, favoring a higher fraction of black authors, may be more likely to be focused on racial inequality. For the female * social_science interaction, a low relationship can be read in light of the high proportion of females across social science domains. Concentration of female authors in a paper is not likely to happen in a natural science, engineering, or technology field, for which one would expect an equal distribution, or a distribution where male authors are concentrated. Given the high proportion of female authors across social science domains, this might be possible and could explain the results."}], "links": [{"source": "student-0", "target": "student-9", "similarity": 0.8525}, {"source": "student-0", "target": "student-12", "similarity": 0.8397}, {"source": "student-0", "target": "student-21", "similarity": 0.8629}, {"source": "student-0", "target": "student-22", "similarity": 0.8568}, {"source": "student-0", "target": "student-37", "similarity": 0.8289}, {"source
