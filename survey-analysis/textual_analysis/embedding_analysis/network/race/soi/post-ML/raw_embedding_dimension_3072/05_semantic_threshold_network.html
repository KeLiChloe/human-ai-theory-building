 new papers that explicitly discuss racial inequality, since the concepts, measures, datasets, and reviewer expectations are already there. I also expect social_science × news_inequality_mentions_3_years to be positive for a similar reason: social science is closer to public discourse and policy, so when inequality becomes more salient in the news, social scientists are more likely to treat it as urgent, frame their work around it, and see it as legitimate to emphasize. Female authorship matters more outside the social sciences, where the baseline likelihood of talking about racial inequality is lower and someone has to “push” the topic into the paper. Inside the social sciences, the baseline is already high and the topic is already normalized, so having more women on the team adds less on the margin, which makes the female effect look smaller there."}, {"id": "senior-1", "name": "senior_contributor_tjek9", "x": 0.31078183103636664, "y": 0.4762107870914688, "degree": 0, "words": 124, "explanation": "Women are more likely to publish on racial inequality because it is important to their political ideology, but this effect is less pronounced within the social sciences because people in those fields may have other incentives such as field-relevance to publish on gender inequality; in non-social sciences, being a woman and thus caring more about inequality on the basis of their politics may be a stronger predictor because there are fewer other motivations to publish on the topic. The public discourse which leads to increased 3-year mentions in news and papers predicts more publishing on racial inequality, but this effect is more pronounced within the social sciences, where racial inequality is relevant enough to those disciplines for public/field-level discourse to shift what people submit."}, {"id": "senior-2", "name": "senior_contributor_mkvct", "x": 0.08605489847916559, "y": 0.8389675369373195, "degree": 0, "words": 111, "explanation": "Multiauthor papers with mostly black authors are more likely to discuss racial inequality compared to multiauthor papers with lower % of black authors or single black author papers. Ditto for hispanics - the rationale in each case is that such papers are often position pieces targeting specific issues. The matter of racial inequality may also be more pronounced for multi-author (vs. single author) social science papers, though I imagine this is a non-linear relationship, as consortia papers (and papers with 7+ co-authors) would be a completely separate category, where other ideas apply (more aligned with the mission of corresponding and senior authors). Additional elements may also matter, though they are post-hoc."}, {"id": "senior-3", "name": "senior_contributor_jakh3", "x": 0.40086212561067713, "y": 0.3192790918955019, "degree": 0, "words": 140, "explanation": "This is about self selection, exposure, and the way scholars in the social sciences generate ideas based on what they observe in the real world. Scholars in the social science generate ideas based on what they observe in the real world, and so news should increase the number of possible paper ideas. In addition, as more publications in racial inequality appear, this stimulates interest from an academic audience, with published research being incomplete in answering questions, affording subsequent scholars the opportunity to do so. The identity/motivation for exploring questions still matters, but weakly so: black and hispanic graduate students tend to gravitate towards exploring questions of racial inequality, making them more likely to publish in that area. Females are less likely to publish on racial equality issues in social science journals, probably because they are publishing on gender equality issues."}, {"id": "senior-4", "name": "senior_contributor_unrjy", "x": 0.1197482873243215, "y": 0.5782872900588495, "degree": 0, "words": 93, "explanation": "Racial inequality is most likely mentioned in an academic paper when there is both a liberal political view present in the demographic group, strongest in social sciences and among female authors, and an appeal of doing so, strongest when there is an academic or public discourse of such topics ongoing. The overlap of these conditions would create a strong positive interaction, because authors with more awareness of inequality or stronger motivation to frame topics around this language are especially likely to discuss racial inequality when academic or public discourse makes the topic salient."}, {"id": "senior-5", "name": "senior_contributor_ogh5x", "x": 0.9199999999999999, "y": 0.5281750965465992, "degree": 0, "words": 19, "explanation": "I don't really have predictions about interactions. But the survey forced me to make choices so I made some."}, {"id": "senior-6", "name": "senior_contributor_ecdev", "x": 0.20284448980656847, "y": 0.4829312963893022, "degree": 0, "words": 56, "explanation": "As with gender, the social sciences publish on racial inequality more than other disciplines. Consequently, being black and topic popularity likely have little relation to racial inequality mentions in STEM fields, but much stronger relations in social science. Because racial inequality is a relatively rare topic in STEM, the effect of female is more obvious/larger there."}, {"id": "senior-7", "name": "senior_contributor_mxspa", "x": 0.34983428439380865, "y": 0.7796737515254218, "degree": 2, "words": 153, "explanation": "The core second-order interactions are social science × paper inequality mentions and social science × news inequality mentions, both taking a positive sign. Temporal features matter, but their effect is conditional on disciplinary domain: mentions of inequality in prior papers and news coverage are more likely to predict whether a paper discusses racial inequality within social science, where receptive journals, relevant funding, and established scholarly communities support this kind of research. Greater news coverage may motivate researchers, while a literature already saturated with inequality discourse may lower publication barriers; when these temporal conditions occur within social science, they may have compounding effects. A negative female × social science interaction is also plausible: female authors within social science may be more likely to focus on other inequality topics, redirecting research attention away from racial inequality specifically. Black author share may retain a meaningful main effect, but it is not central as a second-order interaction."}, {"id": "senior-8", "name": "senior_contributor_h1ror", "x": 0.300002573329207, "y": 0.6464514228505396, "degree": 1, "words": 96, "explanation": "I expect interactions between discipline, author demographics, and broader attention to racial inequality to matter. News and academic attention will lead more scholars from within the social sciences to conduct research on racial inequality, resulting in a positive interaction effect between the two. The likelihood of black predicting that the paper will discuss racial inequality will increase if the paper is in social sciences, and decrease if the discipline is the natural sciences. Being a female will be less predictive of paper topic in the social sciences, as women are more highly represented in those fields."}, {"id": "senior-9", "name": "senior_contributor_uhvrz", "x": 0.2797374817421253, "y": 0.08, "degree": 0, "words": 59, "explanation": "In the social sciences, an uptick in coverage of racial inequality, in either the news or the academic literature, will create a trend, which will attract authors to the topic. The tendencies of trends in a literature will lead to a rapid initial upsurge in inequality papers to start followed by a tapering off as the field becomes satuated."}, {"id": "senior-10", "name": "senior_contributor_5cvcm", "x": 0.3693118860807674, "y": 0.9199999999999999, "degree": 0, "words": 108, "explanation": "social science x paper_inequality_mentions_3_years: The positive effect of this interaction should be likely as the advancement of scientific knowledge is often shaped by paradigms that guide which topics are seen as important and legitimate (Kuhn, 1997). In addition, higher levels of prior inequality-related research may signal greater funding availability for these topics, which can further encourage subsequent work. social science x news_inequality_mentions_3_years: This interaction should also be included in the model regarding whether a paper discusses racial inequality. social science x black: The logic here is simply the combination of two positive effects. social science x female: The logic here is simply the combination of two positive effects."}, {"id": "senior-11", "name": "senior_contributor_8pxf3", "x": 0.1847713376900207, "y": 0.8627805361734593, "degree": 0, "words": 206, "explanation": "Mentions of race in the news are positively associated with mentions of race in papers because they increase both authors' interest and potentially data availability. This effect will be more pronounced for authors in the social sciences, who are already more focused on topics that have to do with race, rather than for those in the natural sciences and engineering - although they main increase their mentions of race as well. Mentions of race in papers are positively associated with mentions of race in papers because they increase both authors' interest and potentially data availability. This effect will be more pronounced for authors in the social sciences, who are already more focused on topics that have to do with race, rather than for those in the natural sciences and engineering - although they main increase their mentions of race as well. A less confident but theoretically plausible interaction is that issues of race will be more salient for authors in countries where there is more diversity, which should increase mentions of race in their research. However, this effect should be less strong for white authors, who may not experience issues of race in the same way as non-white authors, hence decreasing their interest in the topic."}, {"id": "senior-12", "name": "senior_contributor_wylyg", "x": 0.08, "y": 0.19127500539270897, "degree": 0, "words": 94, "explanation": "It's difficult to know! I think that the growing salience of race issues will be most strongly experienced in areas that are primed to recognize them. That includes countries where diversity increases the salience of racial issues, and fields (social science) where they are more relevant. Even as race takes on a growing importance in society, it will remain of less interest to other fields and in countries where it is seen as less relevant. I also suspect that within more diverse countries it is black academics who are more drawn to these questions."}], "links": [{"source": "senior-0", "target": "senior-7", "similarity": 0.8466}, {"source": "senior-7", "target": "senior-8", "similarity": 0.8195}]}, {"id": "GenAI", "title": "GenAI (n=25)", "color": "#66BB6A", "nodes": [{"id": "GenAI-0", "name": "GPT_5.3_instant", "x": 0.874384515338269, "y": 0.5850950581440358, "degree": 22, "words": 197, "explanation": "Disciplinary context is a key amplifier of macro-level discourse, but a potential attenuator of individual-level effects. social_science × paper_inequality_mentions_3_years has a strong positive interaction, because social science fields are structurally more responsive to shifts in academic agendas; when inequality becomes more salient in recent scholarship, these disciplines are especially likely to incorporate that framing into new work. social_science × news_inequality_mentions_3_years is also positive, reflecting the idea that social sciences are particularly permeable to broader societal discourse, translating real-world attention to inequality into academic output more readily than other fields. However, female × social_science has a negative interaction, where the marginal effect of female authorship is smaller within social science disciplines. This reflects a baseline saturation mechanism—because racial inequality is already widely studied and institutionally supported in social sciences, the additional influence of female authorship becomes less distinctive. In contrast, in non-social-science fields where inequality is less central, female authors may play a more pivotal role in introducing or emphasizing such topics, leading to a stronger marginal effect there. Overall, this theory distinguishes between macro-level amplification (discipline × discourse trends) and micro-level substitution or diminishing returns (discipline × author characteristics) in shaping whether racial inequality is explicitly discussed."}, {"id": "GenAI-1", "name": "GPT_5.2_instant", "x": 0.6849134711532553, "y": 0.4824769751262457, "degree": 23, "words": 212, "explanation": "Second-order interactions reflect disciplinary amplification of temporal discourse trends and a substitution effect between disciplinary context and female representation. First, social_science positively interacts with both prior academic inequality attention and recent news inequality attention, consistent with a field-amplification mechanism. Social science disciplines are structurally oriented toward studying stratification and injustice, so when inequality becomes more salient in academia or the broader public sphere, scholars in these fields are especially likely to translate that salience into explicit racial inequality framing. Thus, disciplinary context magnifies the influence of both academic and media agenda-setting dynamics. The interaction between female author share and social_science reflects a substitution or diminishing-returns mechanism: in social science fields—where racial inequality discourse is already institutionally normalized—the marginal contribution of female representation to increasing racial inequality mentions is smaller. In contrast, in non-social-science fields where inequality discourse is less central, a higher share of female authors may meaningfully increase the likelihood that racial inequality enters the research agenda. In other words, female representation appears to play a compensatory role outside social sciences, helping introduce inequality-oriented perspectives into disciplines where such frameworks are otherwise less dominant. Overall, disciplinary context amplifies responsiveness to broader inequality trends, while also reducing the marginal impact of female authorship within fields where inequality research is already structurally embedded."}, {"id": "GenAI-2", "name": "Gemini_3_fast", "x": 0.9178903267676681, "y": 0.4489457790146147, "degree": 18, "words": 159, "explanation": "Second-order interactions emphasize disciplinary sensitivity and thematic specialization. The interaction between social_science and both paper_inequality_mentions_3_years and news_inequality_mentions_3_years is fundamentally positive because social science disciplines act as high-sensitivity institutional \"receivers.\" They possess the specialized vocabulary and theoretical frameworks necessary to translate broader academic and public concerns regarding inequality into specific scholarly discourse on race. The interaction between the female author share and social_science is negative because of thematic trade-offs and saturation. While both are strong positive predictors of racial inequality mentions independently, within the social sciences, a higher share of female authors may lead to a disproportionate specialization in gender-specific inequality research rather than racial inequality. Furthermore, because social science papers already have a high baseline probability of addressing race, the marginal \"boost\" provided by female authorship is lower than in other fields, suggesting that in highly specialized environments, demographic identity markers may signal a pivot toward specific sub-fields rather than a universal increase across all forms of inequality discourse."}, {"id": "GenAI-3", "name": "Claude_sonnet4.6", "x": 0.5013660360667631, "y": 0.4685623660474202, "degree": 22, "words": 416, "explanation": "The key second-order interactions reflect a common theoretical logic: that the predictors of racial inequality scholarship are not independent but are instead conditioned by one another through mechanisms of institutional context, disciplinary permeability, identity salience, and agenda responsiveness. The interaction between social_science and paper_inequality_mentions_3_years rests on the assumption that social science disciplines are especially responsive to prior academic literature on inequality. Social scientists operate in fields where existing scholarly attention supplies conceptual vocabulary, methodological templates, peer legitimacy, and journal outlets that make inequality more available as a research agenda. When prior academic attention to inequality rises, social science papers are disproportionately responsive compared with natural science or engineering papers. The interaction between social_science and news_inequality_mentions_3_years reflects the assumption that academic disciplines vary substantially in their permeability to external social pressures. Social scientists operate with a professional norm of societal relevance and are embedded in institutional reward structures — grant agencies, journal editors, tenure committees — that are themselves responsive to public discourse. When media salience of racial inequality rises, these institutional transmission mechanisms selectively channel that pressure into social science research agendas far more than into natural science or engineering ones, producing a superadditive effect. The interaction between female and social_science may operate in the opposite direction for racial inequality. Female social scientists may disproportionately concentrate their inequality research on gender inequality specifically rather than racial inequality, meaning that the combination of female authorship and social science context redirects scholarly attention toward gender and away from race. There may also be a substitution dynamic between gender and racial inequality discourse within feminist social science traditions: papers that foreground gender inequality — using keywords like patriarchy, sexism, or gender stereotypes — may be less likely to simultaneously foreground racial inequality keywords, creating a negative conditional relationship even if both are positively associated with female social science authorship individually. It is also possible that within social science, the scholars most focused on racial inequality are disproportionately male — particularly Black male scholars in sociology, political science, and related fields — meaning that high female authorship within social science shifts the compositional balance away from the scholars most likely to use racial inequality keywords. Rather than gender and race scholarship being uniformly entangled, they may compete for discursive space within individual papers, with female social scientists disproportionately choosing gender over race as their primary inequality frame. This points to a specialization rather than integration model of intersectional scholarship for how feminist scholarly identity relates to racial inequality discourse specifically."}, {"id": "GenAI-4", "name": "Grok4_fast", "x": 0.08, "y": 0.6969418419647674, "degree": 20, "words": 248, "explanation": "The theory for predicting racial inequality keyword mentions emphasizes the powerful moderating role of disciplinary context while incorporating important nuances in how author demographics interact with field. The two strongest interactions are social_science × paper_inequality_mentions_3_years (+) and social_science × news_inequality_mentions_3_years (+): social science disciplines function as critical amplifiers because their institutional norms, journals, reviewers, and scholarly communities are highly responsive to broader academic and public salience of inequality topics, such that the positive effect of recent inequality discourse in papers and news media on the use of racial keywords is substantially larger within social sciences than in natural sciences or engineering/technology. The third key interaction, female × social_science (–), reflects an important saturation or substitution dynamic: while higher female author share generally increases the likelihood of discussing racial inequality as a main effect, this positive demographic influence is attenuated within social sciences, where racial inequality framing is already so deeply institutionalized and normatively expected that additional boosts from female authorship add less marginal predictive power; in contrast, in harder sciences where such discourse is less common, female authorship may serve as a stronger differentiating signal for papers that do adopt racial inequality language. Disciplinary moderation is the central mechanism: social sciences not only elevate baseline probabilities but also strengthen the impact of temporal discursive climate while partially substituting for certain author demographic effects, producing a more context-dependent understanding of how institutional field cultures shape the translation of both climatic signals and team composition into explicit racial inequality discourse."}, {"id": "GenAI-5", "name": "Grok4_expert", "x": 0.4111229204432414, "y": 0.6004976899120323, "degree": 23, "words": 247, "explanation": "The most important second-order interactions predicting whether a paper discusses racial inequality revolve around social_science as the primary institutional moderator that conditions the impact of broader academic and societal inequality discourse, alongside a more nuanced gender composition dynamic. The strongest interaction is social_science × paper_inequality_mentions_3_years (+), because social-science fields (sociology, political science, psychology, ethnic studies) are structurally far more responsive to recent surges in overall academic inequality scholarship than natural sciences or engineering; when the preceding three-year academic climate emphasizes inequality, citation networks, funding incentives, and disciplinary agendas strongly pull social-science papers toward explicit racial-inequality language. The second most important interaction, social_science × news_inequality_mentions_3_years (+), arises for similar reasons: social sciences are highly permeable to external media and public attention on inequality, so spikes in news coverage of inequality topics (including racial justice movements) translate much more readily into racial-inequality discourse within social-science journals than elsewhere. Finally, the third interaction female × social_science (–) reflects a specialization or substitution effect within social sciences: while female authorship generally increases inequality discussions, in social-science venues higher female shares appear to direct scholarly attention more toward gender-specific inequality topics (patriarchy, sexism, gender biases), thereby reducing the marginal probability of using distinctly racial-inequality keywords relative to papers with lower female authorship. Overall, these interactions underscore that disciplinary boundaries do not merely amplify author demographic effects but act as critical filters that determine how strongly temporal academic momentum and societal climate influence the uptake of racial inequality language in titles and abstracts."}, {"id": "GenAI-6", "name": "Mistral_balanced", "x": 0.4849605756821237, "y": 0.5637545481245607, "degree": 23, "words": 370, "explanation": "Second-order interactions shape the likelihood that an academic paper discusses racial inequality through the ways disciplinary focus, public discourse, academic discourse, and author demographics interact to influence research agendas. Social science disciplines serve as a critical amplifier for the effects of both academic and public discourse on racial inequality. The positive interactions between social_science × paper_inequality_mentions_3_years and social_science × news_inequality_mentions_3_years reflect that social science fields are uniquely responsive to contemporary conversations about inequality. When racial inequality is prominent in academic literature or public debate, social scientists are particularly likely to engage with the topic, reflecting the field's mission to analyze and address societal issues. This aligns with theories of disciplinary norms and issue-attention cycles, where external stimuli—such as heightened public or academic focus—trigger increased scholarly engagement, especially in fields already oriented toward these topics. The negative interaction between female × social_science challenges the assumption that female authors in social science disciplines would be more likely to discuss racial inequality due to their potential intersectional perspectives or commitment to social justice. Instead, the effect of female authorship on discussing racial inequality may be diminished within social science fields, and conversely, the effect of being in a social science discipline may be weaker when the share of female authors is higher. This counterintuitive pattern can be explained through several mechanisms: first, social science disciplines may already have a high baseline probability of discussing racial inequality, creating a \"ceiling effect\" that reduces the incremental impact of female authorship. Second, female authors in these fields might prioritize other forms of inequality, such as gender inequality, or adopt intersectional approaches that do not always center racial inequality explicitly. Third, the negative interaction could reflect disciplinary subfield dynamics, where female scholars are concentrated in areas less focused on racial inequality, such as gender studies or family sociology, or face implicit pressures to avoid controversial or politically charged topics. Overall, disciplinary norms and author demographics interact in complex, sometimes counterintuitive ways. While social science fields amplify the effects of public and academic discourse, the role of female authorship is more nuanced, shaped by subfield specialization, intersectional priorities, and disciplinary constraints. This presents a more dynamic and context-dependent understanding of the factors driving academic engagement with racial inequality."}, {"id": "GenAI-7", "name": "DeepSeek_expert", "x": 0.11831018606799434, "y": 0.5483009190811494, "degree": 21, "words": 796, "explanation": "Predicting whether a paper discusses racial inequality requires understanding not just who the authors are and where they publish, but when they are writing relative to shifting currents of public and academic discourse, and how disciplinary location conditions responsiveness to those currents. The two most important interactions, social_science × paper_inequality_mentions_3_years and social_science × news_inequality_mentions_3_years, both positive, form the core of this theory. The concept of discursive opportunity structure captures how the scholarly and societal attention environment alters the likelihood of engaging racial inequality, but only for papers in disciplines equipped to capitalize on it. When recent academic literature has paid heightened attention to inequality, a dense, citing, and vital intellectual conversation is underway. Social science papers are positioned to join this conversation because their theoretical frameworks, methodological toolkits, and professional incentive structures are designed to engage social hierarchy as a legitimate object of inquiry. A special issue may have been organized, reviewers may be primed to evaluate inequality manuscripts favorably, and the perceived contribution of an inequality-focused paper is amplified when it can speak to a thriving recent literature. This creates a positive-feedback dynamic: scholarly attention by social scientists begets more scholarly attention by social scientists. Critically, this discursive opportunity structure does not extend across the epistemological boundary into natural science or engineering. A biologist or computer scientist, regardless of personal interest, lacks the disciplinary infrastructure-the relevant theories, the appropriate journals, the receptive peer networks-to join a conversation about racial inequality, even if that conversation is academically vigorous. The positive interaction thus captures the role of social science as the unique institutional site where scholarly momentum toward inequality topics is converted into new published output. A parallel mechanism for the news interaction is societal relevance amplification. When racial inequality surges in public discourse-following catalyzing events, social movements, or political contests-a generalized societal attention to race emerges. This societal energy does not affect all academic production uniformly; it is filtered through disciplinary apparatus. Social scientists are professionally socialized to respond to socially salient problems, and the perceived relevance and fundability of inequality research increases precisely when the public cares most. The societal concern provides both motivation and legitimation, but only social science provides the channel through which this concern can become formal scholarship. The positive interaction thus encodes the institutional translation function of social science: converting societal attention into academic knowledge. The third interaction, female × social_science, with a negative sign, requires a more nuanced theoretical treatment. The simple synergy hypothesis should be rejected in favor of an alternative mechanism grounded in differential baseline constraints. The negative sign indicates that the marginal predictive contribution of female authorship on studying racial inequality diminishes within social science. This occurs not because women in social science are less motivated to study racial inequality, but because of a ceiling effect combined with cross-axis attentional channeling. Social science is already such a powerful positive predictor of racial inequality discourse-the disciplinary current is so strong-that it leaves limited variance for author gender to explain. Within the high-probability environment of social science, additional demographic signals contribute diminishing information. Moreover, the generalized inequality concern associated with female authorship is channeled differently across disciplinary contexts. In social science, where scholars have the full apparatus to study any axis of inequality, women's heightened sensitivity to hierarchy is likely directed toward the axis they experience most directly: gender. The disciplinary richness of social science permits fine-grained specialization, so the female effect manifests within gender-focused subfields rather than spilling over into race. In contrast, women outside social science who possess a generalized inequality concern have fewer legitimate outlets. When they do engage inequality-a rarer event-racial inequality, particularly during periods of high societal salience, may serve as the available and socially visible axis through which this concern is expressed. The negative interaction thus does not imply that social science suppresses female attention to racial inequality, but rather that social science provides the differentiated scholarly channels that allow concern to be directed toward gender specifically, while non-social-science environments compress generalized concern into the few inequality outlets that the broader societal moment makes accessible. This channeling mechanism preserves the underlying assumption that women scholars across disciplines carry a heightened orientation toward social justice, while accounting for the pattern that its disciplinary expression varies by axis. Together, these three interactions structure the theory around a temporal and contextual logic rather than a static compositional one. The likelihood that a paper discusses racial inequality is not merely a function of stable author and discipline characteristics, but of how the disciplinary apparatus-most powerfully social science-interacts with the shifting tides of scholarly conversation and public concern. Author identity features remain important as main effects, but their interactive dynamics are shaped by disciplinary baselines and channeling processes that produce effects more subtle and context-contingent than simple amplification."}, {"id": "GenAI-8", "name": "Claude_opus4.7", "x": 0.5634808220704862, "y": 0.16159181833142316, "degree": 12, "words": 343, "explanation": "A theory of second-order interactions distinguishes between two structurally different ways features combine—complementarity and substitution. The dominant pattern is complementarity between temporal attention and disciplinary opportunity: social_science × paper_inequality_mentions_3_years and social_science × news_inequality_mentions_3_years are both strongly positive because rising attention to inequality, whether originating inside academia or in the public sphere, can only convert into actual racial-inequality papers within disciplines that possess the vocabulary, venues, and legitimacy to absorb it. Neither input is sufficient alone—a salience surge is inert in technical fields, and disciplinary fit needs an activating climate—so they multiply. This interactive structure also explains why temporal variables can have weak standalone discriminating power: their causal force is conditional, expressed only through interaction with discipline, so they surface as important interaction terms even while being weak main effects. For standpoint × discipline, there is a substitution rather than complementarity logic for variables that proxy disciplinary location. The female × social_science interaction is negative because female authorship partly stands in for being situated in equity-oriented, female-dominated subfields; once a paper is already identified as social science, that proxy becomes largely redundant, so female authorship's marginal informational contribution is largest outside social science, where a female-authored technical paper is a rare and strong signal of a deliberate turn toward inequality themes. The two variables are therefore substitutes at the margin—each most diagnostic when the other is absent—driven by informational overlap and ceiling effects. The unifying assumption is that whether an interaction is positive or negative depends on the informational relationship between the two features: when they capture distinct, jointly necessary inputs, such as attention and opportunity, they complement and the sign is positive; when one feature is partly a proxy for the other, such as female authorship for equity-subfield location, which discipline already encodes, they substitute and the sign is negative. Genuine own-group or exposure-based standpoint variables, such as Black share, Asian share, and country diversity, are expected to interact positively with discipline, but this prediction is more tentative because any standpoint variable carrying a sub-disciplinary-location component may instead substitute for the social_science indicator."}, {"id": "GenAI-9", "name": "Claude_opus4.7_adaptive", "x": 0.3231241116246826, "y": 0.08, "degree": 3, "words": 490, "explanation": "A theory of interactions should abandon a single, uniform logic in which \"the discipline amplifies everything\" and instead use a two-logic framework distinguished by the nature of the interacting input. The organizing idea is that `social_science` functions as the master contextual moderator, but whether it amplifies or dampens another feature depends on whether that feature is a complement to the field's mandate or a substitute for it. The first logic is complementarity / super-additivity, which governs contextual-temporal inputs: the salience wave captured by `paper_inequality_mentions_3_years` and `news_inequality_mentions_3_years` cannot raise an individual paper's probability of discussing race on its own — ambient attention is shared by nearly all papers in a given window and is inert as a main effect — but it becomes potent precisely when it meets a field equipped to act on it. Social scientists are positioned to ride a rising tide of inequality attention, reframing projects, launching new ones, and citing the moment, whereas technical fields are insulated, so the marginal effect of the wave is concentrated inside social science and the product terms `social_science × paper_inequality_mentions_3_years` and `social_science × news_inequality_mentions_3_years` are strongly positive. The temporal climate matters predictively only in interaction with field, even when temporal main effects are weak. The second logic is substitution / saturation / sub-additivity, which governs author-identity inputs. Both being in social science and having a high female author share are partially redundant routes to the same outcome — each independently pushes a paper toward inequality framing — so when one route is already active the other adds less. Inside social science the legitimacy to discuss race is already near a ceiling, making the response surface concave, so additional female authorship yields diminishing marginal returns; conversely, outside social science female authorship becomes highly diagnostic, flagging the specific subset of medical, educational, or STEM-adjacent papers oriented toward diversity and disparities, where it is one of the few signals that a paper will invoke racial-diversity or racial-bias language. The result is that the female effect is largest where the field's mandate is weakest, producing a negative `female × social_science` interaction. `social_science × black` is not expected to be a leading interaction: the `black` main effect is weak and heavily attenuated by the race-imputation pipeline, so its interaction is too noisy to surface, and in any case the demographic-standpoint channel that does surface (`female`) operates by substitution rather than amplification. The cross-axis appearance of `female` in a racial-inequality model reflects a general \"inequality-oriented author\" disposition that travels across fields, which is exactly why it acts as a substitute for the field's own mandate rather than as a within-field amplifier. The governing assumption is therefore that interaction sign is determined by whether a feature complements or substitutes for disciplinary legitimacy: contextual/temporal forces are complements, producing positive interactions because they require the field to be activated, whereas portable author-identity dispositions are substitutes, producing negative interactions because they can supply inequality orientation even where the field does not."}, {"id": "GenAI-10", "name": "Qwen_3.6Plus_thinking", "x": 0.11102546154108575, "y": 0.41725494445988687, "degree": 20, "words": 329, "explanation": "These three interactions emphasize disciplinary translation capacity, public-academic boundary spanning, and a substitution rather than amplification dynamic for gendered standpoint effects. First, `social_science × paper_inequality_mentions_3_years` (+) operates through disciplinary infrastructure and path dependence: social science fields possess the theoretical frameworks (e.g., critical race theory, stratification research), peer review norms, and journal ecosystems necessary to convert general academic inequality discourse into specific, publishable racial inequality scholarship, making recent scholarly attention disproportionately impactful within these domains. Second, `social_science × news_inequality_mentions_3_years` (+) suggests that social sciences function as translational hubs between public discourse and academic production; when news media amplifies societal debates on racial injustice, social scientists are institutionally equipped to theorize, empirically investigate, and rapidly publish on these topics using established critical lenses, whereas technical or applied fields typically respond through methodological innovation or depoliticized framing rather than direct engagement with racial inequality concepts. Third, and most critically, `female × social_science` (–) supports a substitution or compensatory mechanism: within social sciences, racial inequality research is already highly institutionalized and normative, so the marginal predictive effect of female authorship is attenuated because scholars of all genders routinely engage with these topics as mainstream concerns. Conversely, in disciplines where racial inequality remains peripheral (e.g., engineering, computer science, business, or health sciences), female authors are disproportionately likely to introduce equity-focused perspectives, algorithmic fairness frameworks, or diversity agendas, thereby exerting a larger marginal effect outside social science contexts. Together, these interactions suggest that racial inequality discourse is driven not merely by additive author characteristics or internal academic trends, but by the interplay of disciplinary translational capacity, public-academic feedback loops, and gendered standpoint effects that operate most powerfully at disciplinary boundaries rather than within established epistemic cores. This framework assumes that gender and race estimation via names/countries preserves rank-order variation despite noise, that the Semantic Scholar corpus captures global rather than solely U.S.-centric scholarly dynamics, and that the institutionalization of inequality topics varies systematically across fields, creating distinct interaction patterns that linear main-effect models may obscure."}, {"id": "GenAI-11", "name": "Claude_opus4.8", "x": 0.30306226533437486, "y": 0.30375827459031063, "degree": 21, "words": 243, "explanation": "The second-order interaction structure governing racial-inequality discussion is best understood through two distinct logics—amplification and substitution—that apply to different pairs of features. The dominant logic is amplification between disciplinary context and discursive opportunity: the marginal effect of recent attention to inequality, whether academic (paper_inequality_mentions_3_years) or in the broader public sphere (news_inequality_mentions_3_years), is realized most strongly within social science, because only there is the topic conceptually actionable and legitimate. Social science fields function as the conversion mechanism that translates a favorable intellectual and media climate into actual racial-inequality scholarship, so both social_science × paper_inequality_mentions and social_science × news_inequality_mentions are positive. This also resolves why the discursive-opportunity variables can be weak as main effects but powerful as interactions: their influence is latent and conditional, switched on only by disciplinary receptivity rather than operating uniformly across the corpus. The second logic is substitution between disciplinary context and author standpoint: female × social_science is negative because field-level legitimation and individual-author disposition are partially redundant routes to the same outcome. Where the field already makes racial inequality broadly accessible, the additional predictive lift from female authorship diminishes; conversely, outside social science—in engineering, computing, or medicine—a high female share becomes a rare and strongly distinguishing signal that a paper engages racial inequality. Complementarity holds between context and external discursive opportunity, but substitution holds between context and internal author-composition signals, because once a topic is broadly legitimated by the field, individual-author markers become less marginally necessary and thus less predictive."}, {"id": "GenAI-12", "name": "Claude_opus4.8_adaptive", "x": 0.40145410640327467, "y": 0.29328620842246145, "degree": 22, "words": 406, "explanation": "The theory of how features combine to predict racial-inequality discussion rests on two distinct interaction logics—activation and substitution. The first and primary logic is activation of latent temporal variance through disciplinary admissibility, which explains why social_science × paper_inequality_mentions and social_science × news_inequality_mentions are the strongest interactions and both positive. The discourse-climate variables carry real causal information about the timing of inequality scholarship, but as main effects they are nearly time-constant across papers and so cannot discriminate at the paper level; crossing them with discipline unlocks that information, because the rise and fall of public and academic attention to inequality is converted into actual racial-inequality content overwhelmingly within social-science fields and barely at all in technical fields. The interaction is therefore positive and large not because salience and discipline are redundant but because discipline is the channel through which temporal salience becomes paper-level variation—the differential responsiveness of fields to the discourse climate is itself the predictive signal. I rank the paper-attention interaction at or above the news-attention one because academic publishing tracks its own field's attention cycles more directly and with shorter lag. The second logic is substitution / diminishing returns between author standpoint and disciplinary admissibility, which explains the negative female × social_science interaction. Female authorship and social-science membership are positively correlated and both raise the probability of inequality content, so when both are present they overlap rather than stack; the social-science baseline probability is already high, compressing any additional lift against the logistic ceiling; and, most substantively, female authorship is a more informative differentiator where it is least expected—a female-heavy team engaging racial inequality outside the social sciences signals an inequality orientation that exceeds its field's norm, whereas inside the social sciences such discussion is already normalized and female composition adds little marginal discrimination. The unifying principle is that disciplinary admissibility interacts with the other two mechanisms in opposite directions: it is complementary with the discourse-climate variables, because it activates a signal that would otherwise be invisible, but substitutive with author-composition variables, because it absorbs a signal that is most distinctive when the field itself does not supply it. The substitution logic would tentatively predict that social_science × black is also negative or near-zero rather than a positive gating effect, and the activation logic would predict that author-composition × discourse-climate interactions such as black × news_inequality_mentions should be positive but weaker, since author composition—unlike discipline—is not the principal channel converting temporal salience into paper-level content."}, {"id": "GenAI-13", "name": "Mistral_thinking", "x": 0.7015214253869339, "y": 0.5684339085484446, "degree": 22, "words": 188, "explanation": "The most important second-order interaction is social_science × paper_inequality_mentions_3_years, which reflects how social science papers are particularly sensitive to trends in academic inequality discourse; when the academic community is focused on inequality, social scientists are more likely to contribute to racial inequality research, and the effect of being in social sciences is amplified during such periods. The second interaction, social_science × news_inequality_mentions_3_years, similarly captures the responsiveness of social sciences to societal discourse, where heightened news attention to inequality further increases the likelihood of social science papers addressing racial inequality. The third and most nuanced interaction, female × social_science, carries a negative sign, suggesting that the marginal effect of female authorship on racial inequality discussion is smaller within social sciences—possibly because female scholars in these fields often prioritize gender inequality or other intersectional topics, or because the baseline rate of racial inequality discussion is already high in social sciences, reducing the additional impact of female authorship. While social sciences and temporal context, both academic and news, strongly reinforce each other in predicting racial inequality discourse, the role of female authorship interacts in a more complex way than initially expected."}, {"id": "GenAI-14", "name": "Qwen_3.7Plus_thinking", "x": 0.7042454612383919, "y": 0.37971020406203626, "degree": 22, "words": 237, "explanation": "The theoretical framework for the second-order interactions reflects the conditional roles of disciplinary contexts in mediating both macro-level external influences and micro-level author demographics. First, the positive interaction between `social_science` and `paper_inequality_mentions_3_years` demonstrates that social science disciplines act as the primary epistemological conduit for academic path dependence; when there is high scholarly momentum regarding inequality, social sciences are uniquely equipped to absorb this established infrastructure and translate it into specific research on racial inequality, amplifying the effect compared to STEM fields. Second, the positive interaction between `social_science` and `news_inequality_mentions_3_years` refines agenda-setting theory by showing that social sciences are the specific institutional responders to external societal pressures; they translate media-driven public salience into formal academic inquiry on racial inequality much more effectively than other disciplines. Finally, the negative interaction between `female` and `social_science` reveals a phenomenon of \"disciplinary saturation\" or a \"ceiling effect\" regarding author demographics. Because discussing racial inequality is already an institutionalized, central norm within the social sciences, male authors in these fields are also highly likely to research it, resulting in a high baseline probability. Consequently, the marginal effect of adding female authors to a social science team is relatively small. In contrast, in non-social science fields where researching racial inequality is not the disciplinary norm, the presence of female authors plays a much more critical and disruptive role in introducing these non-traditional topics, making their marginal effect significantly stronger outside of the social sciences."}, {"id": "GenAI-15", "name": "GPT_5.5_thinking_standard", "x": 0.532487433591618, "y": 0.6606945221004004, "degree": 22, "words": 216, "explanation": "Disciplinary context moderates the effect of broader inequality discourse more strongly than author racial identity does. The most important interaction is social_science × paper_inequality_mentions_3_years, with a positive sign, because recent academic attention to inequality is most likely to translate into racial inequality mentions in fields that already possess the relevant theories, journals, methods, and vocabularies. The second most important interaction is social_science × news_inequality_mentions_3_years, also positive, because public attention to inequality should shape academic agendas most strongly in social science, where scholars are institutionally positioned to convert news salience into research questions about racial discrimination, racial justice, racial violence, or racial bias. The negative female × social_science interaction reflects a substitution or ceiling effect: female authorship has a positive main association with racial inequality mentions, but its marginal effect appears smaller within social science because social science papers are already much more likely to discuss racial inequality regardless of author gender composition. Conversely, female authorship may be especially informative outside social science, where gendered or feminist orientations may distinguish the relatively small subset of non-social-science papers that explicitly engage racial inequality. Thus, racial inequality mentions are produced by the combination of field receptivity and discourse salience, while author gender composition matters more as a differentiating signal in less obviously inequality-oriented fields than within social science itself."}, {"id": "GenAI-16", "name": "GPT_5.5_thinking_extended", "x": 0.7704818030431189, "y": 0.47401550666658043, "degree": 23, "words": 221, "explanation": "Second-order interactions distinguish between amplification effects and substitution effects. Social_science strongly amplifies the effects of both academic and public inequality discourse: when recent academic papers mention inequality more often, social-science papers are especially likely to translate this broader scholarly attention into explicit racial-inequality language because these fields already possess the theories, concepts, methods, and journals for studying race, discrimination, and inequality. Similarly, when recent news coverage of inequality is high, social-science papers are especially likely to respond because social scientists are more oriented toward public problems, political conflict, social movements, and institutional injustice than are many natural-science or technical fields. Therefore, the interactions between social_science and paper_inequality_mentions_3_years and between social_science and news_inequality_mentions_3_years should be positive. However, female × social_science should be a negative or substitutive interaction. Female authorship may be especially predictive of racial-inequality mentions outside the social sciences, where a higher share of female authors may signal broader engagement with inequality, fairness, bias, discrimination, or social justice in fields where these topics are otherwise less common. Within social science, by contrast, racial inequality is already sufficiently institutionalized as a topic that the additional marginal effect of female authorship becomes smaller. Thus, disciplinary context amplifies macro-discursive influences, while author gender composition matters more as a differentiating signal in fields where racial-inequality discourse is not already part of the dominant disciplinary toolkit."}, {"id": "GenAI-17", "name": "GPT_5.4_thinking_standard", "x": 0.7710439280144828, "y": 0.7183856937751951, "degree": 22, "words": 260, "explanation": "Social science functions as the main amplifier of temporal inequality salience, but not necessarily of all author-composition effects. social_science × paper_inequality_mentions_3_years is the most important positive interaction because when inequality has recently become more visible in academic discourse, social science fields are especially likely to absorb that attention and convert it into explicit racial-inequality framing; these disciplines already possess the concepts, audiences, and normative legitimacy needed to translate general inequality salience into research on race. social_science × news_inequality_mentions_3_years is likewise a strongly positive interaction, because social science is more porous to public events, media narratives, and political conflict than many other fields, so rising news attention to inequality should have a larger effect there on whether papers explicitly mention racial inequality. female × social_science is a negative interaction. Female authorship may generally increase the likelihood of inequality-oriented framing, but this added effect becomes smaller within social science because social science already has a high baseline probability of discussing racial inequality. In other words, social science may create a ceiling effect that reduces the marginal contribution of female authorship. A second possibility is that within social science, female authorship is often associated with attention to inequality broadly, but not always specifically to racial inequality, whereas outside social science female authors may be especially important carriers of explicit inequality framing into fields where such discourse is otherwise less common. Overall, field context strongly magnifies the impact of broader academic and public inequality salience, while the effect of female authorship is positive on average but comparatively weaker inside social science than outside it."}, {"id": "GenAI-18", "name": "GPT_5.4_thinking_extended", "x": 0.9199999999999999, "y": 0.7031012248829079, "degree": 20, "words": 216, "explanation": "The key conditioning force is social_science, which amplifies broad discourse effects more than it amplifies author-composition effects. First, social_science × paper_inequality_mentions_3_years is positive because recent academic attention to inequality is especially likely to be converted into explicit racial-inequality language in social science, where scholars have the concepts, norms, and publication conventions that legitimate such framing. Second, social_science × news_inequality_mentions_3_years is also positive because public attention to inequality should spill over most strongly into social science, whose research agendas are more permeable to current events and public discourse than many other fields. Third, the negative female × social_science interaction suggests that female authorship increases the likelihood of racial-inequality mentions less within social science than outside it. This does not mean that female authorship becomes unimportant in social science, but that social science already has a relatively high baseline tendency to use racial-inequality framing, so the additional marginal contribution of female authorship is smaller there; by contrast, outside social science, female authorship may be a stronger signal of an inequality-oriented perspective and therefore more sharply distinguishes the subset of papers that explicitly discuss racial inequality. Overall, social science strengthens the impact of broader academic and public inequality discourse, while reducing the marginal distinctiveness of female authorship because the field itself already strongly predisposes papers toward explicit racial-inequality framing."}, {"id": "GenAI-19", "name": "gemini_3.1_pro_standard", "x": 0.23856523634597732, "y": 0.7724579425673507, "degree": 20, "words": 221, "explanation": "The interplay between academic disciplines, temporal momentum, and demographic specialization dictates the likelihood of a paper discussing racial inequality. The most significant driver is the positive interaction between social science disciplines and prior academic attention to inequality. Social science fields are deeply sensitive to internal scholarly cycles; when academic interest and funding for general inequality research surge, disciplines like sociology and political science disproportionately amplify this momentum into concrete publications specifically focused on racial disparities. Similarly, the positive interaction between social sciences and recent news mentions highlights the unique responsiveness of these fields to external cultural shocks. A spike in public discourse regarding societal inequality rapidly reshapes research agendas within the social sciences, directly translating cultural urgency into peer-reviewed research on race. Conversely, the negative interaction between female authorship and the social sciences introduces a critical boundary of thematic specialization and baseline saturation. While female authors generally raise the likelihood of inequality discourse across academia, within the already saturated domain of the social sciences, a higher share of female authors often correlates with a specialized focus on gender dynamics rather than racial ones. This thematic specialization-combined with the limited space of a paper's abstract-effectively crowds out racial keywords, thereby attenuating the marginal predictive power of female authorship for racial inequality when the paper is already situated within a social science framework."}, {"id": "GenAI-20", "name": "Theorista_GPT5.5_instant", "x": 0.7718588181523386, "y": 0.6160773734355397, "degree": 22, "words": 169, "explanation": "The interaction between social_science and paper_inequality_mentions_3_years is the strongest positive interaction because social-science disciplines are especially responsive to developments in the academic literature, making recent scholarly attention to inequality more likely to translate into new research on racial inequality. Social_science also interacts positively with news_inequality_mentions_3_years, since public attention to inequality is more readily incorporated into research agendas in disciplines that focus on social and political issues. For female × social_science, rather than reinforcing one another, the negative interaction suggests that the positive association between female authorship and racial inequality research is weaker within social science than outside it. One possible explanation is that social science already has a strong institutional orientation toward studying racial inequality, reducing the additional influence of author gender. Conversely, in disciplines where racial inequality is less central, a higher share of female authors may have a larger effect on whether such topics are investigated. Overall, disciplinary context amplifies the effects of academic and public inequality discourse while partially substituting for the influence of female authorship."}, {"id": "GenAI-21", "name": "Theorista_GPT5.5_thinking_standard", "x": 0.5807240206980424, "y": 0.9199999999999999, "degree": 15, "words": 161, "explanation": "Racial-inequality mentions are most likely when social-science disciplinary receptivity is activated by broader discursive salience, but author standpoint does not always amplify the social-science effect. Social-science fields are especially responsive to both academic and public inequality discourse. When inequality becomes more prominent in recent scholarship or news, social-science papers are more likely than papers in other fields to translate that salience into explicit racial-inequality language. However, author standpoint and disciplinary receptivity do not simply reinforce each other. Female authorship may have its strongest marginal effect outside social science, where it signals a more distinctive critical or inequality-oriented research orientation. Inside social science, racial inequality is already institutionally legitimate and common enough that female authorship adds less additional predictive power. Thus, the theory is one of complementarity between discourse and field, but partial substitution between female authorship and field: social-science location amplifies the effect of public and academic inequality discourse, while reducing the marginal predictive contribution of female authorship for racial-inequality mentions."}, {"id": "GenAI-22", "name": "Qwen_3.8Max_thinking", "x": 0.25560770761228085, "y": 0.5078481685931909, "degree": 22, "words": 1022, "explanation": "The three most important second-order interactions predicting whether a paper discusses racial inequality are: (1) `social_science × paper_inequality_mentions_3_years` (+), (2) `social_science × news_inequality_mentions_3_years` (+), and (3) `female × social_science` (–). The most important interaction is `social_science × paper_inequality_mentions_3_years` (+), because the self-reinforcing cycle of cumulative inequality scholarship is strongly conditional on disciplinary context. Academic momentum does not operate uniformly; rather, it creates a self-reinforcing feedback loop primarily within social sciences, where the institutional infrastructure for absorbing, citing, and building upon prior inequality literature is concentrated. When the preceding three years show high levels of inequality-related academic output, this signals an active research ecosystem with established citation networks, specialized journals, conference panels, and funding streams. However, this ecosystem exists almost entirely within social science disciplines. A surge in inequality publications in sociology, political science, and psychology generates more inequality publications in those same fields through cumulative advantage, Merton's Matthew Effect, graduate student socialization, and editorial path dependence. But this momentum has virtually no transmission mechanism into chemistry, physics, or engineering, where the conceptual frameworks, methodological tools, and peer review norms are not oriented toward inequality research. The positive interaction captures this disciplinary amplification of academic momentum: the marginal effect of prior academic inequality output on the probability of racial inequality discussion is substantially larger for social science papers than for non-social-science papers. This interaction ranks first because it captures the most powerful dynamic in the academic knowledge system—the self-reinforcing accumulation of research within the disciplinary domains where it is institutionally supported—and because the temporal variation in `paper_inequality_mentions_3_years` interacting with the stable disciplinary classification creates meaningful between-paper variation that is highly informative for cross-sectional prediction. The second interaction, `social_science × news_inequality_mentions_3_years` (+), captures the conditional permeability of disciplinary boundaries to external societal shocks. When inequality becomes salient in public discourse—driven by events such as police killings, mass protests, or the rise of Black Lives Matter—social science disciplines are uniquely positioned to absorb and translate this public energy into academic production. Social scientists study society; when society experiences a racial justice crisis, the crisis falls squarely within their epistemological domain. Journals issue calls for papers, funding agencies create targeted programs, and departments hire cluster faculty. By contrast, a spike in news coverage of racial inequality has virtually no mechanism through which it would alter the research agenda of a condensed matter physicist or an organic chemist. The positive sign reflects the complementarity between societal salience and disciplinary receptivity: news attention provides the stimulus, and social science provides the receptive apparatus. This interaction ranks second rather than first because, while the societal-to-academic transmission channel is powerful, it is more episodic and event-driven than the academic momentum interaction. News salience fluctuates with specific events, such as Ferguson 2014 and George Floyd 2020, creating temporal spikes, whereas academic momentum operates as a more continuous self-reinforcing process that accumulates over time. The momentum interaction therefore explains a broader swath of the temporal variation in racial inequality scholarship, while the news interaction explains specific surges. The third interaction, `female × social_science` (–), reflects a pattern of diminishing marginal returns and differential diagnosticity across disciplinary contexts. Within social science disciplines, racial inequality is a mainstream, institutionalized research topic studied by scholars of all genders. The disciplinary norms, journal infrastructure, and intellectual traditions of social sciences make racial inequality a legitimate and accessible topic for both male and female scholars. Because the baseline probability of racial inequality discussion is already elevated in social sciences regardless of author gender, the additional marginal contribution of female   }

  function readOpenSections() {
    const storage = navStorage();
    if (!storage) return new Set();
    try {
      const raw = storage.getItem(OPEN_SECTIONS_KEY);
      if (!raw) return new Set();
      const parsed = JSON.parse(raw);
      return new Set(Array.isArray(parsed) ? parsed : []);
    } catch {
      return new Set();

  }

  function writeOpenSections(openIds) {

    if (!storage) return;

    } catch {

  }

  // Drop legacy persistence so reopening the site starts collapsed.
  try {
    localStorage.removeItem(OPEN_SECTIONS_KEY);
  } catch {
    /* ignore */
  }

  function sectionId(task, theory) {

  const PAGE_SUFFIX_RE =
    /((?:gender|race)\/(?:main-effects|soi)\/(?:pre-ML|post-ML)\/[^/]+\/[^/]+?)(?:\.html)?$/i;

  function normalizeNavPath(path) {
    if (path == null) return "";
    let p = decodeURIComponent(String(path)).trim();
    if (p.includes("://")) {
      try {
        p = new URL(p).pathname;
      } catch {
        /* keep p */
      }
    }
    const pageMatch = p.match(PAGE_SUFFIX_RE);
    if (pageMatch) {
      return pageMatch[1].toLowerCase();
    }
    const marker = "/network/";
    const markerIndex = p.indexOf(marker);
    if (markerIndex !== -1) {
      p = p.slice(markerIndex + marker.length);
    }
    p = p.replace(/^\//, "").replace(/\/$/, "");
    if (!p || p === "index" || p === "index.html" || !p.includes("/")) return "";
    if (p.endsWith(".html")) p = p.slice(0, -5);
    if (p === "index") return "";

  function resolvedPathFromHref(href) {

  /** Path to current page relative to the network site root (no leading slash). */
  function networkPathSuffix() {
    const path = decodeURIComponent(window.location.pathname);
    const pageMatch = path.match(
      /((?:gender|race)\/(?:main-effects|soi)\/(?:pre-ML|post-ML)\/[^/]+\/[^/]+\.html)$/i
    );
    if (pageMatch) return pageMatch[1];
    const marker = "/network/";
    const markerIndex = path.indexOf(marker);
    if (markerIndex !== -1) {
      const rest = path.slice(markerIndex + marker.length).replace(/\/$/, "");
      return rest || "index.html";
    }
    if (/\/index\.html$/i.test(path) || /\/$/.test(path)) return "index.html";
    return path.replace(/^\//, "").replace(/\/$/, "");

  function currentNavPath() {
    return currentResolvedPath();
  }

  function isHttpDeployment() {
    const p = window.location.protocol;
    return p === "http:" || p === "https:";
  }

  /**
   * Host-absolute site root for http(s), e.g. "/human-ai-semantic-network" or "/network".
   * Relative links break when the URL omits a trailing slash
   * (/human-ai-semantic-network + "gender/..." => /gender/...).
   */
  function networkSiteRoot() {
    if (!isHttpDeployment()) return null;

    const scripts = document.getElementsByTagName("script");
    for (let i = 0; i < scripts.length; i++) {
      const src = scripts[i].src;
      if (!src || !/sidebar\.js(\?|$)/i.test(src)) continue;
      try {
        const pathname = new URL(src, window.location.href).pathname;
        return pathname.replace(/\/network_interactive\/sidebar\.js$/i, "") || "";
      } catch {
        /* keep looking */
      }
    }

    const path = decodeURIComponent(window.location.pathname);
    const underPage = path.match(
      /^(.*)\/(?:gender|race)\/(?:main-effects|soi)\/(?:pre-ML|post-ML)\//i
    );
    if (underPage) return underPage[1];

    let root = path.replace(/\/index\.html$/i, "").replace(/\/$/, "");
    return root || "";

  /** Build href for a catalog entry from the current page location. */

    return navBasePrefix() + target;

        const details = document.createElement("details");
        details.className = "nav-theory";
        const summary = document.createElement("summary");
        summary.textContent = THEORY_LABELS[theory];
        details.appendChild(summary);
        let sectionHasActive = false;

        const sid = sectionId(task, theory);
        if (opts.expandAll || openSections.has(sid)) {
          details.open = true;
        }

        details.addEventListener("toggle", () => {
          if (details.open) openSections.add(sid);
          else openSections.delete(sid);
          writeOpenSections(openSections);
        });

        const theoryBody = document.createElement("div");
        theoryBody.className = "nav-theory-body";

        PHASE_ORDER.forEach((phase) => {
          const phaseEntries = tree[task][theory][phase];
          if (!phaseEntries) return;

          const phaseEl = document.createElement("div");
          phaseEl.className = "nav-phase";
          const phaseIsActive = VARIANT_ORDER.some((vk) => {
            const item = phaseEntries[vk];

          if (phaseIsActive) phaseEl.classList.add("has-active");
          phaseEl.innerHTML = '<div class="nav-phase-label">' + phase + "</div>";

          const links = document.createElement("div");
          links.className = "nav-links";

          VARIANT_ORDER.forEach((vk) => {
            const item = phaseEntries[vk];

            const a = document.createElement("a");

            a.textContent = VARIANT_LABELS[vk];
            if (pathsMatch(item.href)) {
              a.classList.add("active");
              a.setAttribute("aria-current", "page");
              sectionHasActive = true;
              taskHasActive = true;
            }
            links.appendChild(a);
          });

          phaseEl.appendChild(links);
          theoryBody.appendChild(phaseEl);
        });

        if (sectionHasActive) {
          details.classList.add("has-active");
          details.open = true;
        }

        taskEl.appendChild(details);
      });

      if (taskHasActive) taskEl.classList.add("has-active");
      scroll.appendChild(taskEl);

    root.appendChild(scroll);

    const activeLink = root.querySelector(".nav-links a.active");
    if (activeLink) {
      requestAnimationFrame(() => {
        activeLink.scrollIntoView({ block: "nearest", behavior: "auto" });
      });
    }
  };
})();

    buildNetworkSidebar(JSON.parse(document.getElementById("nav-data").textContent));

    const detailHeader = document.getElementById("detail-header");
    const detailEmpty = document.getElementById("detail-empty");
    const panelRoots = new Map();
    let pinnedNode = null;
    let hoveredNode = null;

    function nodeRadius(degree) {
      return 9.5 + Math.min(degree, 8) * 1.5;
    }

    function hitRadius(degree) {
      return nodeRadius(degree) + 12;
    }

    function showDetail(node, panel) {
      detailEmpty.style.display = "none";
      detailEl.classList.add("visible");
      detailHeader.style.setProperty("--detail-accent", panel.color);
      document.getElementById("detail-dot").style.color = panel.color;
      document.getElementById("detail-group").textContent = panel.title;
      document.getElementById("detail-name").textContent = node.name;
      document.getElementById("detail-neighbors").textContent = node.degree;
      document.getElementById("detail-words").textContent = node.words ?? "—";
      document.getElementById("detail-explanation").textContent =
        node.explanation || "(No theory text available for this participant.)";
    }

    function hideDetail() {
      if (pinnedNode) return;
      detailEl.classList.remove("visible");
      detailEmpty.style.display = "block";
    }

    function resetAllHighlights() {
      panelRoots.forEach(root => {
        root.selectAll(".node").classed("focused faded", false);
        root.selectAll(".link").classed("highlight faded", false);
      });
      document.querySelectorAll(".panel-card").forEach(card => {
        card.classList.remove("active");
      });
    }

    function highlightNode(nodeId, panelId) {
      resetAllHighlights();
      const root = panelRoots.get(panelId);
      const card = document.querySelector(`.panel-card[data-panel-id="${panelId}"]`);
      if (!root || !card) return;

      card.classList.add("active");
      const neighborIds = new Set([nodeId]);
      root.selectAll(".link").each(d => {
        if (d.source === nodeId || d.target === nodeId) {
          neighborIds.add(d.source);
          neighborIds.add(d.target);
        }
      });

      root.selectAll(".node")
        .classed("focused", d => d.id === nodeId)
        .classed("faded", d => !neighborIds.has(d.id));
      root.selectAll(".link")
        .classed("highlight", d => d.source === nodeId || d.target === nodeId)
        .classed("faded", d => d.source !== nodeId && d.target !== nodeId);
    }

    function activateNode(node, panel) {
      hoveredNode = node;
      highlightNode(node.id, panel.id);
      showDetail(node, panel);
    }

    function deactivateNode() {
      if (pinnedNode) return;
      hoveredNode = null;
      hideDetail();
      resetAllHighlights();
    }

        .append("circle")

        .attr("fill", "rgba(15,23,42,0.06)");
      svg.insert("rect", ":first-child")
        .attr("width", SCALE).attr("height", SCALE)
        .attr("fill", `url(#${patId})`);
    }

      const head = document.createElement("div");
      head.className = "panel-head";
      head.innerHTML = `<h2>${panel.title}</h2><span class="dot" style="color:${panel.color}"></span>`;
      card.appendChild(head);

      const svg = d3.select(card).append("svg")
        .attr("class", "panel-svg")
        .attr("viewBox", `0 0 ${SCALE} ${SCALE}`);

      addPanelGrid(svg, panel.id.replace(/\W/g, "_"));
      const root = svg.append("g");
      panelRoots.set(panel.id, root);

      const x = d3.scaleLinear().domain([0, 1]).range([PANEL_PAD, SCALE - PANEL_PAD]);
      const y = d3.scaleLinear().domain([0, 1]).range([SCALE - PANEL_PAD, PANEL_PAD]);

      const links = panel.links.map(l => ({ ...l, panelId: panel.id }));
      const nodes = panel.nodes.map(n => ({ ...n, panelId: panel.id }));

      root.selectAll(".link")
        .data(links)
        .join("line")
        .attr("class", "link")
        .attr("stroke-opacity", 0.34)
        .attr("stroke-width", 1.2)
        .attr("x1", d => x(nodeById.get(d.source).x))
        .attr("y1", d => y(nodeById.get(d.source).y))
        .attr("x2", d => x(nodeById.get(d.target).x))
        .attr("y2", d => y(nodeById.get(d.target).y));

      const nodeSel = root.selectAll(".node")
        .data(nodes)
        .join("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${x(d.x)},${y(d.y)})`);

      nodeSel.append("circle")
        .attr("class", "hit")
        .attr("r", d => hitRadius(d.degree));

      nodeSel.append("circle")
        .attr("class", "shell")
        .attr("r", d => nodeRadius(d.degree) + 4)
        .attr("stroke", panel.color)
        .attr("stroke-opacity", 0.35);

      nodeSel.append("circle")
        .attr("class", "core")
        .attr("r", d => nodeRadius(d.degree))
        .attr("fill", panel.color)
        .attr("fill-opacity", 0.92);

      nodeSel
        .on("pointerenter", (event, d) => {
          if (pinnedNode && pinnedNode.id !== d.id) return;
          activateNode(d, panel);
        })
        .on("pointerleave", (event) => {
          if (pinnedNode) return;
          const related = event.relatedTarget;
          if (related && event.currentTarget.contains(related)) return;
          deactivateNode();
        })
        .on("click", (event, d) => {
          event.stopPropagation();
          if (pinnedNode && pinnedNode.id === d.id) {
            pinnedNode = null;
            deactivateNode();
            return;
          }
          pinnedNode = d;
          activateNode(d, panel);
        });

      panelsEl.appendChild(card);
    });

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      panelRoots.forEach(root => {
        root.selectAll(".node").classed("faded", d => q && !d.name.toLowerCase().includes(q));
        if (!q) root.selectAll(".link").classed("faded highlight", false);
        else root.selectAll(".link").classed("faded", true).classed("highlight", false);
      });
      if (!q && !pinnedNode && !hoveredNode) resetAllHighlights();
      else if (pinnedNode) highlightNode(pinnedNode.id, pinnedNode.panelId);
      else if (hoveredNode) highlightNode(hoveredNode.id, hoveredNode.panelId);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      pinnedNode = null;
      hoveredNode = null;
      document.getElementById("search").value = "";
      hideDetail();
      resetAllHighlights();
      panelRoots.forEach(root => {
        root.selectAll(".node").classed("faded", false);
      });
    });

    document.getElementById("canvas-wrap").addEventListener("click", (e) => {
      if (e.target.closest(".node")) return;
      if (!pinnedNode) return;
      pinnedNode = null;
      hoveredNode = null;
      hideDetail();
      resetAllHighlights();
    });
  </script>
</body>
</html>
