d in the population of scholars in the social sciences, and in particular in sociology and social psychology, and because questions of social inequality are among the topics that may be perceived as more \"feminine\" because other-focused, communal, etc., and, through the effect of social expectations, likely to attract and retain more female scholars."}, {"id": "senior-9", "name": "senior_contributor_uhvrz", "x": 0.9199999999999999, "y": 0.48301545326864903, "degree": 0, "words": 78, "explanation": "Similar to gender, I expect that the relevance of these topics will be more pronounced in the social sciences (where it is an established topic of study) and will follow the tendencies of me-search (i.e., issues of racial inequality will be more personally relevant to black academics) and the flow of trends. In addition, this topic will be more relevant among academics in more diverse countries, where racial tensions are an experience more widely shared among the population."}, {"id": "senior-10", "name": "senior_contributor_5cvcm", "x": 0.3086482352085314, "y": 0.7936626159964622, "degree": 6, "words": 262, "explanation": "1. social science: Compared to other fields, research in social science is more likely to foucs on the topics of diversity, social stratification, and discrimnation, making the discussion of racial inequality more probable (cf. controlling for the number of publications by field; or measured by ratios). 2. paper_inequality_mentions_3_years: At least in the social sciences, research trends show a degree of path dependency. That is, the more papers have discussed inequality-related topics in recent years, the more likely new papers are to discuss racial inequality as well. 3. black: This is based more on observation than theory-driven reasoning, but Black scholars seem more likely to write papers on racial inequality on black versus white than other ethnic minority scholars. 4. female: Women remain underrepresented in many fields including academia, which may make female scholars more sensitive to a broader range of inequality issues, including racial inequality. 5. authors_race_diversity _score: I am not sure of directions of this effect. On the one hand, greater racial diversity among authors, compared with all White author teams, may make papers more likely to address racial inequality. On the othe hand, racially diverse coauthor teams, compared with the author team composed of members of the same racial minority group, may lead to less discussion of racial inequality, as there may be conflicting views about which ethnic groups face the most severe inequality. 6. country_race_diversity_score: It may positively predict racial inequality mentions because authors linked to countries with more racially diverse populations are more likely to be exposed to race as a visible and socially consequential dimension of inequality."}, {"id": "senior-11", "name": "senior_contributor_8pxf3", "x": 0.43070068648122006, "y": 0.5386361757828056, "degree": 8, "words": 312, "explanation": "Studies of racial inequality are much more common in the social sciences than in the natural sciences or engineering/computer science, and this disciplinary focus should by far be the most important driver of discussing the topic. Discussions of racial inequality are also shaped by the salience of this topic in a given society, such as the explosion of papers on race around the Black Lives Matter movement, although measures such as mentions of all types of inequality in news and academic research may be too broad or may not use a long enough lag to specifically capture mentions of racial inequality in papers. Race is often a controversial theme and one for which it is very difficult to get good data. When there is a higher interest in society, authors should be more likely to engage with the topic and more likely to access data, particularly from organizations interested in doing something about it. The racial diversity of a country should matter because diversity would bring up issues of inequality and racial tension in ways that are less likely in more homogeneous countries. The race of the authors also matters, but much less than disciplinary focus and societal salience: non-white authors, including Asian and Black authors, are more likely to be interested in issues of race, while white authors would be negatively associated with mentions of racial inequality. Female authors may also be associated with discussions of racial inequality, but this is likely a compositional effect rather than a causal relationship between gender and mentions of race inequality. Women authors may tend to work in sub-fields within the social sciences where interests in inequality of all types, including racial inequality, are more pronounced; for example, there are many more women in Sociology than in Finance, and issues of racial inequality are much more often discussed in the former than in the latter."}, {"id": "senior-12", "name": "senior_contributor_wylyg", "x": 0.7325249369459388, "y": 0.26741269569319953, "degree": 0, "words": 95, "explanation": "My sense is that racial inequality has become a focal topic within much of the social sciences but is less central to natural sciences. I also suspect that it is much more focal as an interest both to those who are black (although I worry about how well your measures will pick that up, particularly in the US) and in countries where diversity has become more salient. It is also a topic that will be more salient to those who have been sensitized to the effects of group memberships on outcomes, notably women and Asians."}], "links": [{"source": "senior-0", "target": "senior-1", "similarity": 0.8307}, {"source": "senior-0", "target": "senior-4", "similarity": 0.8259}, {"source": "senior-0", "target": "senior-5", "similarity": 0.8301}, {"source": "senior-0", "target": "senior-7", "similarity": 0.8327}, {"source": "senior-0", "target": "senior-8", "similarity": 0.8601}, {"source": "senior-0", "target": "senior-10", "similarity": 0.8452}, {"source": "senior-0", "target": "senior-11", "similarity": 0.8994}, {"source": "senior-1", "target": "senior-3", "similarity": 0.8448}, {"source": "senior-1", "target": "senior-8", "similarity": 0.8561}, {"source": "senior-1", "target": "senior-10", "similarity": 0.8208}, {"source": "senior-1", "target": "senior-11", "similarity": 0.8403}, {"source": "senior-3", "target": "senior-11", "similarity": 0.8242}, {"source": "senior-4", "target": "senior-10", "similarity": 0.856}, {"source": "senior-4", "target": "senior-11", "similarity": 0.844}, {"source": "senior-5", "target": "senior-7", "similarity": 0.8349}, {"source": "senior-5", "target": "senior-10", "similarity": 0.8671}, {"source": "senior-5", "target": "senior-11", "similarity": 0.8266}, {"source": "senior-7", "target": "senior-10", "similarity": 0.8847}, {"source": "senior-7", "target": "senior-11", "similarity": 0.8391}, {"source": "senior-8", "target": "senior-11", "similarity": 0.8564}, {"source": "senior-10", "target": "senior-11", "similarity": 0.8565}]}, {"id": "GenAI", "title": "GenAI (n=25)", "color": "#66BB6A", "nodes": [{"id": "GenAI-0", "name": "GPT_5.3_instant", "x": 0.9199999999999999, "y": 0.5235875715623529, "degree": 14, "words": 174, "explanation": "Social_science is the strongest positive predictor because these disciplines are structurally oriented toward studying and explicitly naming social inequalities. Female_score is a key positive predictor, capturing a broader sensitivity to inequality and social justice issues that extends beyond gender-specific topics, possibly reflecting shared intellectual networks or norms. Country_race_diversity_score is also an important positive factor, because authors originating from more racially diverse societies may have greater exposure to racial heterogeneity and related tensions, which increases the likelihood of engaging with racial inequality in their research. Asian author share is a positive predictor, not simply as a direct effect of identity but as a proxy for institutional and geographic contexts, such as scholars trained or working in diverse, globalized academic environments, that are more likely to engage with race-related topics. Black author share is positively associated with discussing racial inequality due to positionality and research interests shaped by lived experience. Overall, individual author characteristics and their broader social and geographic contexts interact with disciplinary norms to shape whether racial inequality is explicitly discussed in academic work."}, {"id": "GenAI-1", "name": "GPT_5.2_instant", "x": 0.6603656609622763, "y": 0.5660795370126209, "degree": 22, "words": 272, "explanation": "Social_science is the strongest predictor because racial inequality is institutionally and theoretically central to social science disciplines, making explicit inequality language more legitimate and common. Author composition and contextual exposure mechanisms also matter alongside disciplinary structure. Female author share plays a prominent role and appears to substantially increase the likelihood of racial inequality mentions. Rather than viewing this purely as a gender-standpoint effect limited to gender inequality topics, this can be interpreted through an intersectional inequality orientation mechanism: scholars with greater representation of women may be more broadly engaged in critical inequality research, including race, due to overlapping intellectual networks, theoretical traditions (e.g., feminist and critical race theories), and shared normative commitments to studying structural disadvantage. Country_race_diversity_score is also important as a contextual salience mechanism: scholars inferred to originate from more racially diverse societies may experience race as a more visible and politically contested dimension of social life, which increases the likelihood that race becomes an explicit analytical focus in their research. The positive association for Asian author share further suggests that racial inequality discourse is not driven solely by Black representation but may reflect broader minority or globally situated scholarly engagement with race, possibly influenced by transnational academic networks or experiences of racialization in Western institutions. Black author share has a positive effect, consistent with standpoint theory, but it is part of a broader pattern in which multiple dimensions of author diversity—gender, racial composition, and national racial context—jointly increase the salience of racial inequality in research agendas. Overall, structural disciplinary incentives combine with intersectional and global diversity mechanisms to explain why certain papers are more likely to explicitly discuss racial inequality."}, {"id": "GenAI-2", "name": "Gemini_3_fast", "x": 0.7848514848503011, "y": 0.7617689686587039, "degree": 15, "words": 186, "explanation": "My theory is grounded in epistemic positioning and emphasizes individual origins and identity markers over collaborative team dynamics or external temporal trends. Social_science is the primary predictor because the disciplinary infrastructure provides the necessary specialized vocabulary to articulate concepts of racial justice, and the keywords defining racial inequality are foundational to the nomenclature and theoretical frameworks of these fields, making them the primary site for such discourse. The geographic-cultural background of authors, as represented by the country_race_diversity_score, is also important because being born in a racially diverse nation acts as a powerful socialization agent, pre-disposing researchers to engage with inequality discourse regardless of their current team composition. The asian and black author shares support a multi-ethnic standpoint theory, where researchers from various minoritized or historically marginalized groups are statistically more likely to pivot toward topics like racial bias or discrimination. The female score reflects an intersectional scholarly interest, suggesting that gender-diverse teams are more attuned to social hierarchies in general, including those of race, which makes demographic identity a more robust signal for predicting a paper's content than either team-level diversity scores or general academic momentum."}, {"id": "GenAI-3", "name": "Claude_sonnet4.6", "x": 0.19849327988172982, "y": 0.46678952045358807, "degree": 20, "words": 442, "explanation": "Racial inequality mentions in academic papers reflect three interlocking theoretical mechanisms: disciplinary gatekeeping, intersectional scholarly identity, and contextual racialization. The first and most foundational mechanism is disciplinary gatekeeping. `Social_science` is the strongest predictor of racial inequality mentions because academic disciplines function as institutional filters that determine which vocabularies, frameworks, and normative concerns are considered legitimate objects of inquiry. The critical vocabulary of racial inequality — discrimination, racial bias, racial justice — was developed within and remains most densely concentrated in social science traditions, making disciplinary membership the single most powerful structural predictor of keyword presence in a paper's title or abstract. The second mechanism is intersectional scholarly identity. The prominence of `female` as a predictor, alongside `black` and `asian`, suggests that gender and race scholarship are not parallel but institutionally and intellectually entangled traditions. Feminist scholarship has long operated through an intersectional framework that treats race, gender, and class as co-constitutive systems of oppression, meaning that female scholars are disproportionately embedded in theoretical traditions and scholarly communities that simultaneously foreground both gender and racial inequality. This is not merely a positionality effect but a structural feature of how feminist intellectual traditions have developed: engaging with racial inequality is in many subfields a constitutive feature of feminist scholarship rather than an optional extension of it. Additionally, the positive role of `asian` suggests that minority racialization in Western academic contexts produces a broader solidarity-based orientation toward racial inequality research that extends beyond scholars whose communities are the primary subjects of the keywords, pointing to a more general minoritized identity effect rather than a narrowly group-specific positionality effect. The third mechanism, contextual racialization, centers on `country_race_diversity_score`. Scholars who originate from or are embedded in racially heterogeneous national contexts develop heightened sensitivity to racial dynamics as a feature of their lived social environment, independent of their own individual racial identity. Growing up or being trained in societies where racial boundaries, hierarchies, and conflicts are visible features of everyday life may cultivate a scholarly disposition to perceive and name racial inequality as an analytically important phenomenon. This contextual mechanism operates at a level of aggregation above individual identity — it is about the racial ecology of the societies that produce scholars — and suggests that racial inequality discourse in academia is shaped not only by who scholars are individually but by the social environments that formed their perceptual and analytical sensibilities. Together, these three mechanisms — disciplinary gatekeeping, intersectional scholarly identity, and contextual racialization — provide an account of the predictors of racial inequality mentions in academic papers in which field membership, feminist intellectual traditions, minoritized identity, and national racial context shape scholarly attention to racial inequality."}, {"id": "GenAI-4", "name": "Grok4_fast", "x": 0.5858042344387087, "y": 0.08, "degree": 21, "words": 261, "explanation": "The dominant driver is social_science (+), as social science disciplines have deeply institutionalized racial inequality as a core analytic and moral frame, creating strong normative, reviewer, and citation incentives that dramatically increase the likelihood of using terms like “racial discrimination,” “racial bias,” or “racial justice.” Ranked second is female (+), which carries greater causal weight: higher female author share serves as a robust proxy for progressive scholarly orientations and greater engagement with identity-based inequality topics, reflecting both supply-side experiences and demand-side encouragement across disciplines. Third, country_race_diversity_score (+) is highly important because authors inferred to come from racially diverse countries of origin tend to bring broader, more global, or non-Western perspectives on race and ethnicity that make explicit racial inequality framing more natural and salient in their work. Fourth and fifth are asian (+) and black (+), indicating that author teams with higher shares of Asian or Black scholars are more likely to center racial inequality, with Asian authorship possibly capturing international scholars studying migration, globalization, or comparative race relations, while Black authorship reflects lived experience and targeted research agendas. Recent news and paper inequality climate variables, news_inequality_mentions_3_years and paper_inequality_mentions_3_years, are less central once discipline and author demographics are accounted for; these temporal factors likely operate more indirectly through their correlation with social science publishing trends rather than exerting strong independent effects. This theory emphasizes institutional field norms combined with supply-side author characteristics, including gender and inferred racial/national background diversity, while still acknowledging that broader discursive environments set the stage but do not dominate once field and team composition are controlled for."}, {"id": "GenAI-5", "name": "Grok4_expert", "x": 0.44935836100769333, "y": 0.3604747396824395, "degree": 23, "words": 299, "explanation": "Racial inequality discourse in academia is overwhelmingly shaped by disciplinary gatekeeping, standpoint epistemology with strong intersectional dimensions, and the geographic/cultural origins of authors, which together explain why social_science ranks first with the strongest positive association: papers published in social-science journals (sociology, political science, psychology, ethnic studies) are structurally oriented toward power, identity, and stratification topics, whereas natural sciences, engineering, and technology fields rarely engage these specific racial keywords. This disciplinary primacy is followed by female_score (second, positive) because female scholars disproportionately drive intersectional scholarship that routinely links gender and racial inequality, reflecting both standpoint theory and the historical mobilization of feminist frameworks within the social sciences. Third, country_race_diversity_score (positive) emerges as a key predictor because authors inferred to originate from more racially heterogeneous countries—particularly the United States, United Kingdom, Canada, and similar contexts—bring entrenched research traditions, institutional incentives, and lived or cultural familiarity with racial dynamics that heighten the likelihood of foregrounding racial bias, discrimination, and justice. This geographic signal is followed by asian (fourth, positive), which likely captures the growing presence and contributions of Asian scholars, especially Asian-American or Asian scholars trained in Western institutions, who increasingly participate in critical race and diversity scholarship within social-science venues. Finally, black (fifth, positive) has a positive but more modest standalone effect, consistent with standpoint theory yet operating alongside rather than dominating other demographic and contextual drivers once intersectionality and country origins are accounted for. Lagged temporal-momentum variables such as paper_inequality_mentions_3_years and news_inequality_mentions_3_years, along with team-level authors_race_diversity_score, are secondary or redundant because they are presumably collinear with the broader expansion of social-science output and the more direct signals provided by author gender and country-of-origin racial diversity; overall, these five features better operationalize the core institutional, intersectional-identity, and geographic mechanisms while rendering pure temporal trends and Shannon-entropy team diversity secondary or redundant."}, {"id": "GenAI-6", "name": "Mistral_balanced", "x": 0.5110646851534432, "y": 0.5267532835948374, "degree": 23, "words": 391, "explanation": "The likelihood that an academic paper discusses racial inequality is shaped not only by disciplinary norms and author demographics but also by broader, often intersectional, dynamics. A strong positive association with social_science disciplines is foundational. Social science fields, such as sociology, political science, and psychology, are inherently oriented toward studying societal structures, power dynamics, and inequalities, and these fields provide the theoretical frameworks and methodological tools to examine racial inequality. The prominence of female_score as a key predictor introduces an important intersectional dimension. Female authors, regardless of their racial background, may be more likely to engage with topics related to inequality due to their own experiences with marginalization or their commitment to social justice and intersectional scholarship. This suggests that gender and racial inequality are often studied in tandem, reflecting the interconnected nature of systems of oppression. The importance of country_race_diversity_score points to the influence of authors' broader socio-cultural contexts. Authors from countries with higher racial diversity may be more attuned to issues of racial inequality, either due to personal experiences or exposure to diverse perspectives in their countries of origin. This feature captures a contextual effect that goes beyond individual or team-level diversity, indicating that the racial composition of an author's country of origin can shape their scholarly interests and priorities. The positive association with asian authors suggests that Asian scholars are also actively engaged in research on racial inequality, possibly due to their experiences with discrimination, such as anti-Asian bias and model minority myths, or their involvement in comparative racial studies. It underscores the importance of recognizing that racial inequality is a concern across multiple racial and ethnic groups, each of which may bring unique perspectives to the topic. Black authors remain a significant predictor, but their influence is part of a broader constellation of factors. This does not diminish the importance of Black scholars in driving research on racial inequality but instead highlights that their contributions are embedded within a larger ecosystem of disciplinary, gender, and contextual influences. Overall, the study of racial inequality in academic papers is shaped by a complex interplay of disciplinary norms, author gender and racial identity, and the broader socio-cultural contexts in which authors are embedded, including the importance of social science disciplines, Black authorship, female scholars, global racial diversity, and the engagement of Asian authors in shaping academic discourse on racial inequality."}, {"id": "GenAI-7", "name": "DeepSeek_expert", "x": 0.4698610894614866, "y": 0.8703266956337785, "degree": 14, "words": 668, "explanation": "My theoretical framework retains the foundational logic that disciplinary context sets the stage for what can be studied, and author social position shapes the motivation and lens brought to inquiry, but it recognizes a broader, more globally distributed set of authorial positionalities and a cross-axis solidarity mechanism. At the broadest structural level, a paper's disciplinary home remains the most powerful determinant of whether it discusses racial inequality. Social science disciplines-sociology, political science, psychology, economics, history-are organized around the systematic study of social structures, power, and humanly constructed hierarchies. Racial inequality is thus not a peripheral topic but a central and theoretically prized object of inquiry, with dedicated journals, established theoretical frameworks, and professional incentives that actively reward such work. This disciplinary context provides the essential condition of possibility for racial inequality discourse in published academic work, and it operates prior to and more powerfully than any author-level characteristic. Author positionality matters not primarily through a single axis of identity but through a generalized inequality concern-a scholarly orientation toward social justice that can arise from multiple forms of marginalized experience. Women scholars, by virtue of their own encounters with gender-based subordination within academia and beyond, may develop a heightened sensitivity to hierarchy and exclusion in general. This is not simply empathy but a learned critical consciousness-an epistemic standpoint forged through navigating male-dominated institutional spaces-that makes the study of one form of inequality cognitively and affectively adjacent to the study of others. Moreover, the academic division of scholarly labor channels women disproportionately into inequality-focused subfields across multiple axes, a pattern sustained by both individual preference and structural sorting mechanisms such as mentoring networks and departmental expectations. This cross-axis mechanism means that female authorship is not merely a proxy for gender-focused research but a robust marker of broader engagement with social justice topics, including racial inequality. Racial inequality is also a genuinely global scholarly discourse, produced by researchers embedded in diverse national contexts where race and ethnicity are salient axes of social organization. Scholars from racially diverse countries-whether South Africa, Brazil, Malaysia, Singapore, or the United Kingdom-are socialized in environments where negotiating racial difference is a routine feature of public and institutional life. This socialization cultivates a scholarly attentiveness to race that travels with the researcher regardless of their specific national origin, and it provides a comparative lens that enriches and motivates engagement with the topic. Asian authorship can reflect multiple plausible pathways: Asian scholars in diaspora contexts studying racial dynamics in multiracial host societies; scholars in Asian societies with salient ethnic hierarchies (e.g., Malaysia, Singapore, India) applying frameworks of racial or ethnic inequality to their own contexts; and the growing internationalization of academic networks that brings scholars from Asia into collaborative projects on race. The geography of knowledge production shapes scholarly attention to race through a mechanism of contextual exposure-living and working in environments where race is visibly and discursively salient makes one more likely to see it as a legitimate and pressing object of study, irrespective of one's own racial category. Black author share remains important but sits within a broader constellation of positionalities rather than standing alone. The mechanism linking Black authorship to racial inequality discourse remains what standpoint theory would predict: direct, embodied experience of anti-Black racism provides both personal motivation and unique epistemic insight into the workings of racial hierarchy. Black scholars are a vital, concentrated source of this scholarship, but they operate within a global academic ecosystem where multiple identity pathways converge on the topic. The epistemological boundary between social and natural science is real, but the positive signal of social science is so powerful that the negative signal of natural science contributes relatively little additional predictive value. The compositional complexity of the team also matters less than the specific identity shares and the structural contexts from which authors are drawn. Collaborative diversity may be a consequence rather than a cause of engagement with racial inequality, or it may simply be too coarse a measure to capture the nuanced interpersonal dynamics hypothesized by team-level accounts."}, {"id": "GenAI-8", "name": "Claude_opus4.7", "x": 0.27669421089584, "y": 0.3000310044827055, "degree": 20, "words": 306, "explanation": "Whether a paper discusses racial inequality is governed by three forces—disciplinary opportunity, author standpoint broadly construed, and temporal salience. Disciplinary scope remains the master variable and strongest predictor: the racial-inequality lexicon is the native vocabulary of the social sciences, so social_science is the dominant positive driver and engineering/natural-science scope suppresses the topic by denying it vocabulary, venues, and legitimacy. Author composition matters through a broader, two-part standpoint account rather than only through own-group membership. First, there is a general equity-disposition channel: women, regardless of race, are disproportionately drawn to inequality scholarship of all kinds, partly as a dispositional orientation and partly because the equity-oriented subfields that house racial-inequality work are themselves female-dominated, so female authorship proxies both a disposition and a sub-disciplinary location that a coarse social_science binary fails to capture. Second, there is an exposure-to-racial-difference channel that supplements—rather than replaces—own-group standpoint: authors from racially diverse countries and Asian authors, often internationally mobile and themselves racialized within host academic systems, acquire heightened salience of race through lived heterogeneity, so racial topics become salient not only to those who belong to a marginalized group but to those exposed to racial difference generally; this is why diversity and Asian share, alongside Black share, all carry positive signs. Finally, temporal/contextual variables such as paper_inequality_mentions_3_years and news_inequality_mentions_3_years matter causally in an absolute sense—rising societal and intra-academic attention genuinely lifts the volume of racial-inequality work—but they are weak cross-sectional discriminators because they vary little across papers within a given time window, so a feature can be causally real yet uninformative for classifying one paper against another. The core assumptions are that journal scope constrains topical content; that author composition matters through a broadened standpoint logic combining general equity-disposition, exposure to racial difference, and own-group membership; and that slow-moving attention cycles are causally relevant but empirically low-variance predictors at the paper level."}, {"id": "GenAI-9", "name": "Claude_opus4.7_adaptive", "x": 0.08, "y": 0.17621717013364308, "degree": 11, "words": 450, "explanation": "The theory rests on a structural foundation organized around three layers and around a distinction between forces that explain the longitudinal rate of racial-inequality discourse and forces that discriminate among contemporaneous papers. The first layer is disciplinary jurisdiction: fields are institutionalized epistemic ecologies with their own legitimate objects, vocabularies, journals, and reward structures, and racial inequality is a core, fundable, publishable object in the social sciences but largely outside the mandate of engineering and the natural sciences. This is why `social_science` (+) is the strongest predictor, and why `engineering_and_technology` (−) remains its negative pole: field membership is the master sorting variable. The second layer treats author identity, standpoint, and societal exposure as the primary engine of paper-level variation, not a secondary noisy channel. Who writes the paper is what separates a racial-inequality paper from its same-year, same-field neighbors. This is not a single \"Black-scholar standpoint\" path but a broader latent construct, an \"inequality-oriented author profile,\" generated by several distinct sub-mechanisms: (a) an intersectional / general social-justice orientation that explains the `female_score` (+) effect — women in academia are overrepresented in inequality-attuned subfields and questions, so female authorship proxies a disposition to study social disadvantage across axes, including race, rather than gender alone; (b) a societal-exposure mechanism behind `country_race_diversity_score` (+) — scholars from racially heterogeneous societies (above all the United States, also Brazil and South Africa) experience race as a salient social fact and dominate the production of racial-inequality scholarship, so exposure operates at the level of the author's social context, not just team composition; and (c) a minority-representation / standpoint mechanism behind `black` (+) and `asian` (+), where members of racially marked groups, and teams situated in diverse academic settings, are disproportionately motivated to name and study racial inequality — with the caveat that `asian` may partly co-travel with country diversity and warrants a controlled test. The persistence of these demographic effects despite the heavy measurement error in the race-imputation pipeline suggests that the underlying standpoint/exposure signal is strong. The third layer is temporal/discursive climate: `paper_inequality_mentions_3_years` and `news_inequality_mentions_3_years` almost certainly govern the aggregate rise of racial-inequality discourse over time (e.g., the post-2013 and 2020 surges), but because ambient salience is shared by nearly all papers in a given window — most of which still do not discuss race — these variables have little power to classify individual papers. The two assumptions anchoring the theory are: first, that the keyword label captures explicit topical framing, so the decision to name race is driven jointly by field permission and authorial disposition; and second, that feature importance in this task reflects cross-sectional separation, which rewards paper-varying identity and field variables over time-varying contextual ones, elevating author identity to the center of the explanation."}, {"id": "GenAI-10", "name": "Qwen_3.6Plus_thinking", "x": 0.10577591531222139, "y": 0.7772200070738098, "degree": 7, "words": 315, "explanation": "A multi-scalar framework explains how author-level standpoint, macro-contextual exposure, and disciplinary infrastructure jointly shape racial inequality discourse, with cross-inequality engagement as a central mechanism. First, `social_science` (+) is the strongest predictor because disciplinary paradigms provide the theoretical frameworks (critical race theory, stratification research), methodological training, and journal ecosystems that legitimize racial inequality as a scholarly object. Second, `female_score` (+) suggests that women scholars engage with racial inequality not merely as a secondary topic but as part of intersectional or broad social justice agendas—suggesting that standpoint epistemology operates across inequality domains, with women scholars more likely to recognize interconnected systems of oppression regardless of their primary research focus. Third, `country_race_diversity_score` (+) indicates that macro-contextual exposure—scholars' formative experiences in racially heterogeneous societies or migration from diverse countries—shapes research sensibilities more powerfully than immediate team composition; scholars from countries with balanced racial distributions may develop heightened awareness of racial stratification, comparative frameworks, or transnational perspectives that predispose them to center racial inequality. Fourth, `asian` (+) and `black` (+) both matter in ways that move beyond a Black/Hispanic-centric model of racial inequality scholarship: Asian scholars may engage racial inequality through model minority critique, immigration/racialization research, comparative race frameworks, or responses to rising anti-Asian violence, while Black scholars' engagement reflects longstanding traditions of Black sociology and community-engaged scholarship. Path dependence may be less central relative to author-level and contextual factors, perhaps because racial inequality scholarship is driven more by who scholars are and where they come from than by recent discursive trends alone. This theory assumes that (a) gender and race estimation via names/countries preserves rank-order variation despite noise, (b) the Semantic Scholar corpus reflects global rather than solely U.S.-centric dynamics, and (c) author-level characteristics interact with disciplinary and contextual factors in non-linear ways. The result is a multi-level account that integrates standpoint epistemology, transnational contextual exposure, cross-inequality scholarly engagement, and disciplinary infrastructure as co-constitutive drivers of racial inequality discourse."}, {"id": "GenAI-11", "name": "Claude_opus4.8", "x": 0.4749645050390158, "y": 0.2144291206091406, "degree": 21, "words": 318, "explanation": "Racial inequality is fundamentally a social phenomenon, so the disciplinary location of a paper is the strongest predictor: social science fields possess the conceptual vocabularies, theoretical traditions, and normative concerns that make racial inequality a legitimate and recurring object of study, so social_science is positive and dominant, while natural_science is negative because its scope structurally crowds out such discussion. The second mechanism is an equality-oriented authorial disposition that is not topic-specific: female authors are more likely to discuss racial inequality (female_score, positive) not because of a gendered standpoint on race per se, but because women are disproportionately selected into the fields, subfields, and research communities (sociology of race, social psychology, education, public health) where all forms of inequality are studied, and because there appears to be a general orientation toward equality-related scholarship that crosses topic boundaries; racial standpoint is not the only standpoint that matters, and a broader disposition-plus-field-selection mechanism operates. The third mechanism is standpoint and lived experience in the narrower sense: authors from groups that experience racial marginalization are more likely to study it, so black is positive and asian is positive—the latter can be interpreted partly as a genuine standpoint effect and partly as a measurement-linked artifact, since asian and the diversity scores are all derived from country-of-birth name inference, and internationally mobile Asian-origin authors may concentrate in Anglophone institutions where racial-inequality discourse is salient. The fourth mechanism is exposure to racial heterogeneity: country_race_diversity_score is positive because authors socialized in racially diverse societies are more attuned to racial dynamics; the relevant exposure is societal and biographical rather than merely the immediate co-author team. Finally, the discursive-opportunity logic remains theoretically relevant: recent academic attention to inequality should raise the probability of racial-inequality framing, but it is empirically less central, most plausibly because the variable has limited within-sample variance once the corpus is concentrated in time, leaving stable author- and field-level signals to dominate the predictive work."}, {"id": "GenAI-12", "name": "Claude_opus4.8_adaptive", "x": 0.3025377121219556, "y": 0.16579167983948503, "degree": 20, "words": 373, "explanation": "Whether a paper discusses racial inequality is organized around three mechanisms—disciplinary admissibility, author attentiveness to marginalization, and discourse climate—with disciplinary admissibility and author composition doing most of the work and discourse climate operating at a level the prediction task barely registers. The first mechanism is disciplinary admissibility and is still the strongest single force: racial-inequality scholarship requires the concepts, methods, and publication venues that are essentially native to the social sciences, so social_science is the dominant positive predictor. The discipline axis is best captured by this one variable rather than by a social_science/engineering contrast, because the negative technical-field signal is largely redundant once disciplinary admissibility is encoded positively; the omission of engineering_and_technology reflects collinearity, not the absence of a real aversion in technical fields. The second mechanism is author attentiveness to marginalization, and it is the empirical heart of the account: rather than a narrow claim that members of one disadvantaged group study their own disadvantage, female_score, asian, black, and country_race_diversity_score all being positive points to a broader disposition in which women authors and authors of minority or racially diverse origins are disproportionately drawn to racial-inequality topics. This reflects a combination of an intersectional standpoint effect—heightened sensitivity to all forms of marginalization, not only one's own group's—and a compositional sorting effect, in which such authors cluster in fields and subfields where inequality is a legitimate object of study. The positive country_race_diversity_score adds an exposure component: authors socialized in racially heterogeneous societies are more likely to perceive and problematize racial relations, independent of their own inferred race. The third mechanism, discourse climate—news and prior-literature attention to inequality—is causally real but less central in this context, because these features are nearly time-constant across papers within a period and therefore cannot discriminate between individual papers in a cross-sectional classifier; their causal influence is on the temporal rate of racial-inequality scholarship, which a paper-level model is structurally poorly equipped to detect. Overall, the account shifts from a macro, agenda-driven account toward a micro, composition-driven one: who is in the author team—their gender, inferred race across multiple groups, and the racial diversity of their origins—predicts racial-inequality discussion far more powerfully than the surrounding discourse environment, with disciplinary admissibility setting the stage on which these author-composition effects play out."}, {"id": "GenAI-13", "name": "Mistral_thinking", "x": 0.6953210293899752, "y": 0.35466265829377036, "degree": 20, "words": 231, "explanation": "The most important predictor of whether a paper discusses racial inequality is social_science, as social science disciplines—such as sociology, political science, and anthropology—are institutionally and thematically centered on studying social structures, power, and systemic inequities, making them far more likely to engage with racial inequality topics. Female_score is the second-strongest predictor, indicating that papers with a higher share of female authors are more likely to address racial inequality, likely due to the intersectional nature of much gender and racial scholarship, where female researchers often lead or collaborate on work that examines the interplay of race, gender, and other social categories. The third-ranked feature, country_race_diversity_score, suggests that authors from racially diverse countries are more likely to study racial inequality, possibly because their national contexts expose them to diverse racial dynamics or inspire comparative research. The positive association with asian authors, ranked fourth, reflects the growing academic focus on anti-Asian discrimination, model minority myths, and the racialization of Asian communities. Finally, black authorship remains positively associated with racial inequality mentions, though its lower-than-expected ranking suggests that while Black scholars are important contributors to this discourse, racial inequality research is also driven by scholars from other racial backgrounds and disciplines. Temporal features are less central in this theory: disciplinary and demographic factors are more predictive than temporal context, though the latter may still play a role in shaping the broader landscape of inequality research."}, {"id": "GenAI-14", "name": "Qwen_3.7Plus_thinking", "x": 0.30117907162229723, "y": 0.6450791270301357, "degree": 22, "words": 272, "explanation": "A theoretical framework for predicting mentions of racial inequality places emphasis on intersectionality, environmental socialization, and the specific dynamics of micro-level author demographics, while contextualizing the role of macro-level temporal trends. First, `social_science` is a foundational positive driver, as these disciplines are epistemologically aligned with studying structural and societal issues, providing the necessary theoretical frameworks to investigate racial inequality. Second, the `female` author share suggests that the motivation to research racial inequality is not exclusively tied to racial identity, but is also strongly driven by female scholars' broader experiences with systemic marginalization and their leadership in intersectional research that examines how race, gender, and power intertwine. Third, the positive effects of both the `black` and `asian` author shares confirm standpoint theory but broaden its demographic scope. While Black scholars are primary drivers of discourse on anti-Black racism, the significant contribution of Asian scholars highlights how specific racialization processes, such as the \"model minority\" myth or experiences with anti-Asian discrimination, and comparative global perspectives actively shape racial inequality research. Fourth, `country_race_diversity_score` introduces a crucial environmental socialization factor: scholars socialized in racially diverse countries are more frequently exposed to complex stratification dynamics, making them more attuned to and likely to research racial inequality, independent of their individual racial backgrounds. Finally, macro-level temporal factors like prior academic and news mentions of inequality theoretically shape the research agenda via path dependence and agenda-setting, but their predictive power is secondary at the individual paper level. Their effects are likely mediated by, or absorbed into, the more granular, high-variance micro-level features of author demographics and disciplinary norms, which more directly and variably determine a specific paper's thematic focus."}, {"id": "GenAI-15", "name": "GPT_5.5_thinking_standard", "x": 0.6262696609816393, "y": 0.42606271426941056, "degree": 21, "words": 267, "explanation": "Racial inequality mentions are driven not only by disciplinary location and Black authorship, but by a broader ecology of social-positioned scholarship, diversity exposure, and critical inequality-oriented research agendas. Social science remains the strongest positive predictor because social science fields provide the concepts, journals, methods, and legitimacy structures through which racial discrimination, racial bias, racial justice, and related topics are explicitly named. Author-team composition matters in a multidimensional way. A higher female_score may predict racial inequality mentions because women scholars are often more represented in, or more likely to engage with, critical, feminist, intersectional, and social justice research traditions that connect gender, race, power, and discrimination. A higher country_race_diversity_score may matter because authors inferred to come from racially diverse national contexts may have greater exposure to race, ethnicity, migration, pluralism, or discrimination as socially salient issues, making racial inequality more likely to appear in their research language. The positive effect of asian suggests that racial inequality discourse is not only associated with Black authorship; Asian and Asian-diaspora scholars may also contribute to race-related scholarship through work on migration, ethnicity, minority status, discrimination, diversity, and comparative racialization. Black authorship remains positively associated, consistent with the expectation that scholars from groups directly affected by anti-Black racism may be especially likely to study racial inequality, but Black author share is one part of a broader pattern of minoritized and diversity-linked authorship. Overall, papers are most likely to discuss racial inequality when they are located in social science fields and produced by author teams whose gender and racial/national backgrounds make inequality, diversity, and discrimination more cognitively salient, professionally relevant, or theoretically central."}, {"id": "GenAI-16", "name": "GPT_5.5_thinking_extended", "x": 0.5962521369913033, "y": 0.2509018532789528, "degree": 19, "words": 255, "explanation": "Papers are most likely to mention racial inequality when they are located in disciplinary fields that legitimate race as an object of study and when the author team is socially positioned or intellectually connected to contexts where race, racialization, diversity, migration, discrimination, or minority status are salient. The strongest positive effect should come from social_science because social-science journals provide the concepts, methods, and publication venues for explicitly discussing racial bias, racial discrimination, racial justice, and related terms. Racial-inequality discourse is not driven only by field-level opportunity or by broad temporal discourse; it is also strongly associated with who produces the research. Female author share, country_race_diversity_score, asian author share, and black author share should have positive effects. Female author share may matter because women scholars are often more engaged with inequality, discrimination, power, and social justice research broadly, including intersectional work that connects gender and race. Country_race_diversity_score may matter because authors inferred to come from more racially diverse countries are more likely to treat race and ethnicity as visible, meaningful, or contested social categories. The positive effects of black and asian author shares may reflect standpoint, research specialization, diaspora and migration experiences, and scholarly networks in which race, minority status, and discrimination are especially salient. Lagged news and academic inequality mentions are background conditions that may shape the general opportunity structure for inequality research, but they are less central as direct main-effect predictors because they are broad measures of all inequality discourse and may not distinguish racial-inequality papers as sharply as discipline and author-composition variables do."}, {"id": "GenAI-17", "name": "GPT_5.4_thinking_standard", "x": 0.5558546738805978, "y": 0.37308910022954345, "degree": 21, "words": 265, "explanation": "The strongest predictors of whether a paper mentions racial inequality combine disciplinary location with author positionality and the broader racial context inferred from authors' backgrounds. Social_science is the most fundamental positive predictor, because social science fields provide the clearest theoretical vocabulary and normative legitimacy for discussing racial discrimination, stereotypes, justice, and inequality explicitly. Female_score is also a positive predictor, as a signal that women scholars may be disproportionately represented in research communities that are attentive to inequality in general and intersectional forms of disadvantage in particular, which makes racial inequality more likely to be named in titles and abstracts. Country_race_diversity_score is especially important: when authors are inferred to come from more racially heterogeneous national contexts, they may be more likely to perceive race as a meaningful axis of social organization and thus more likely to foreground racial inequality in research. Both asian and black author share are positive predictors, not only because of possible lived experience or minority-status sensitivity, but also because these variables may capture entry into scholarly networks, substantive specialties, or institutional settings where race-related questions are more actively studied. Broad temporal salience variables such as prior news and paper inequality mentions may still matter conceptually, but relatively stable features of field membership and author composition may be more powerful than short-run fluctuations in public or academic attention. Overall, explicit discussion of racial inequality is most likely when papers are produced in social science settings by author teams whose gender and racial composition, as well as inferred country-of-origin diversity, place them closer to intellectual environments where race is salient, discussable, and theoretically developed."}, {"id": "GenAI-18", "name": "GPT_5.4_thinking_extended", "x": 0.7386372314433793, "y": 0.2270454483389795, "degree": 20, "words": 252, "explanation": "I rank social_science first because papers in social science fields are most likely to treat racial inequality as a central object of analysis and to use explicit language such as discrimination, bias, stereotypes, diversity, or justice in titles and abstracts. I place greater weight on the composition and inferred background of the author team than on broader discourse measures. In particular, female_score should have a positive effect because teams with more female authors may be more engaged with inequality-oriented scholarship overall, perhaps because of stronger ties to critical, feminist, or intersectional research traditions that make race-related inequality more visible and more likely to be explicitly named. The positive effect of country_race_diversity_score suggests that authors inferred to come from more racially diverse national contexts may be more exposed to heterogeneous social environments, which can heighten awareness of racial boundaries, intergroup relations, and inequality. I also expect a positive role of asian, which may reflect the fact that Asian scholars are often embedded in globalized academic networks, migration-related research, or minority-status perspectives that increase attention to race and discrimination. Finally, the positive sign on black is consistent with the reasoning that lived experience, standpoint, and topic selection can increase the likelihood of studying and explicitly naming racial inequality. Overall, explicit mentions of racial inequality are driven first by disciplinary norms in social science, but are also strongly shaped by who the authors are, the kinds of social environments they are inferred to come from, and the inequality-sensitive intellectual networks in which they are embedded."}, {"id": "GenAI-19", "name": "gemini_3.1_pro_standard", "x": 0.4887752368519906, "y": 0.6333169004132146, "degree": 22, "words": 197, "explanation": "The likelihood of a paper discussing racial inequality is fundamentally driven by a combination of structural disciplinary boundaries, intersectional research orientations, and the demographic origins of the author team. Publishing within the social_science domain acts as the primary structural catalyst, as journals in sociology, political science, and economics are explicitly designed to investigate human stratification and systemic power dynamics. Beyond the disciplinary venue, demographic characteristics exert a profound influence through the lens of standpoint epistemology and intersectionality. Specifically, a higher female author share strongly predicts engagement with racial inequality, suggesting that scholars who experience gender marginalization often demonstrate a heightened, empathetic focus on other axes of systemic bias. Additionally, geographic upbringing plays a crucial role; author teams with a high country_race_diversity_score come from nations with heterogeneous populations, providing a cultural and structural exposure to multiracial dynamics that naturally translates into academic inquiry. Finally, the racial composition of the team itself is a critical driver. Higher shares of both asian and black authors positively predict mentions of racial inequality, reinforcing the principle that scholars from diverse or historically marginalized racial backgrounds frequently leverage their unique social positions and perspectives to pioneer and sustain research on systemic racial disparities."}, {"id": "GenAI-20", "name": "Theorista_GPT5.5_instant", "x": 0.7963212434515725, "y": 0.5248138282877199, "degree": 20, "words": 176, "explanation": "Social_science is the strongest positive predictor because research on racial inequality is primarily conducted in disciplines that focus on social institutions, discrimination, and inequality. Characteristics of the author team are also important. The positive association of the share of female authors suggests that scholars who engage with broader issues of social justice or intersectionality may also be more likely to study racial inequality. Similarly, the positive effects of the share of Asian authors and the share of Black authors indicate that researchers from different racial backgrounds may contribute to racial inequality scholarship through distinct perspectives, research interests, and professional networks. The importance of country_race_diversity_score further suggests that authors originating from more racially diverse societies may be more likely to recognize, prioritize, or investigate issues of racial inequality. Recent academic and media attention to inequality may matter less than the composition and background of the research team as determinants of whether a paper discusses racial inequality. Overall, disciplinary specialization and the demographic and geographic backgrounds of researchers jointly shape the likelihood that a paper addresses racial inequality."}, {"id": "GenAI-21", "name": "Theorista_GPT5.5_thinking_standard", "x": 0.32914534046424215, "y": 0.48360053170077955, "degree": 17, "words": 253, "explanation": "Explicit mentions of racial inequality in academic papers are primarily shaped by a combination of disciplinary receptivity and scholarly positionality, rather than by broad temporal inequality discourse alone. The strongest driver remains whether a paper is located in the social sciences: social-science fields provide the concepts, journals, audiences, and legitimacy structures that make racial inequality a natural and publishable object of inquiry. Author-team composition also matters broadly. Papers with higher estimated shares of female, Asian, and Black authors, as well as papers whose authors are inferred to come from more racially diverse countries, are more likely to mention racial inequality. This is not a simple biological or demographic effect, but a proxy for standpoint, network location, international exposure, and intellectual community. Female authorship may predict racial-inequality mentions because gender and race inequality are often studied through overlapping critical, intersectional, and discrimination-oriented frameworks. Black authorship plausibly increases attention to racial inequality through lived experience, topic specialization, and scholarly networks centered on race. Asian authorship and country-level racial diversity may capture transnational, migration, minority-status, or comparative diversity perspectives that make racial categories and racialized inequality more salient. Broad news and academic inequality discourse are less central as top predictors because those variables may be too general, aggregating gender, racial, economic, and other inequality forms. Racial-inequality mentions are most likely when a paper is produced within a social-science field and by author teams whose inferred demographic or geographic composition places them closer to scholarly communities where inequality, diversity, discrimination, and minority status are salient research frames."}, {"id": "GenAI-22", "name": "Qwen_3.8Max_thinking", "x": 0.10190767438024582, "y": 0.313793344439629, "degree": 15, "words": 1122, "explanation": "The ranking of the five most important features for predicting whether a paper discusses racial inequality is: (1) `social_science` (+), (2) `female` (+), (3) `country_race_diversity_score` (+), (4) `black` (+), and (5) `asian` (+). `social_science` sits at the top of the hierarchy because disciplinary location is the single most powerful structural filter determining whether a paper engages with racial inequality. The conceptual apparatus required to frame racial relations as a problem of structural inequality—rather than, say, a biological fact or an individual-level attribute—was developed within and is sustained by social science disciplines such as sociology, political science, psychology, economics, and history. These fields provide the institutional infrastructure, including dedicated journals, tenure lines, and funding streams, that makes racial inequality a recognizable and publishable research topic, and without this infrastructure, the base rate of racial inequality keywords in a paper approaches zero regardless of other author characteristics. `female` is second because the production of racial inequality scholarship is driven not only by race-specific lived experience but also by a generalized sensitivity to structural domination that cuts across specific identity categories. Women scholars, through their lived experience with gender-based hierarchy, develop an “inequality lens”—a cultivated attentiveness to how power operates through social categories to produce systematic disadvantage. This lens does not stop at the boundary of gender; it extends to race, class, and other axes of stratification. Feminist intellectual traditions, particularly intersectional feminism (Crenshaw, 1989; Collins, 2000), explicitly theorize the interconnection of multiple oppression systems, and women scholars socialized in these traditions are therefore more likely to study racial inequality as part of a broader analytic commitment to exposing structural domination. Additionally, women are overrepresented in the social science subfields where racial inequality is studied, such as sociology of race, social psychology of prejudice, and social work, meaning that `female` partially captures within-discipline clustering in the most inequality-focused research areas, above and beyond the binary `social_science` indicator. `country_race_diversity_score` is third because authors from racially diverse countries such as the United States, Brazil, South Africa, and the United Kingdom are more likely to be embedded in social contexts where racial stratification is a visible, contested, and politically institutionalized feature of everyday life. This feature captures not merely individual exposure to racial diversity but also the national intellectual tradition in which scholars are trained. Countries with high racial diversity tend to have developed robust academic infrastructures for studying intergroup relations, colonial legacies, and racial stratification. Scholars trained in these traditions carry their intellectual frameworks with them regardless of where they publish, making `country_race_diversity_score` a carrier of epistemic culture rather than merely a demographic indicator. This cultural-institutional channel operates independently of and in addition to the direct disciplinary effect captured by `social_science`. `black` is fourth: Black scholars, by virtue of their direct experience with anti-Black racism, are naturally motivated and epistemically positioned producers of racial inequality scholarship, consistent with standpoint epistemology. This remains a valid causal mechanism, but its empirical magnitude is attenuated by several factors. First, the `black` variable is inferred indirectly through surname-based country-of-origin probabilities, introducing substantial measurement noise that likely attenuates its estimated predictive power relative to more cleanly measured features like `female`, which is inferred from first names. Second, Black scholars constitute a relatively small share of the total academic workforce, meaning that even if their conditional probability of studying racial inequality is high, their marginal contribution to prediction across a large corpus of papers is limited by base rates. Third, the identity channel for racial inequality scholarship is distributed across multiple social positions—women, Asian scholars, scholars from diverse countries—rather than being exclusively Black-centric. This does not diminish the theoretical importance of Black scholars’ contributions, but it suggests that the prediction of racial inequality discourse requires attending to a broader coalition of identity positions than standpoint theory’s focus on the most directly affected group would predict. `asian` is fifth because the keyword set for racial inequality, including racial bias, racial diversity, racial discrimination, racial stereotypes, and racial justice, is not limited to anti-Black racism; it encompasses racial inequality broadly, including discrimination against Asian communities, such as the model minority myth, anti-Asian hate crimes, and bamboo ceiling phenomena, which has generated a growing body of scholarship, particularly after the surge in anti-Asian violence during the COVID-19 pandemic. Asian scholars are also well-represented in fields such as computer science, public health, and education, where research on racial bias in algorithms, racial health disparities, and racial achievement gaps has expanded rapidly. This means that the `asian` variable may capture a positive association with racial inequality keywords that operates partly outside traditional social science venues, in applied and interdisciplinary fields where the `social_science` binary does not reach. Scholars inferred as Asian based on surnames linked to countries like India, China, and various Southeast Asian nations may also be studying forms of ethnic and racial hierarchy in their own national contexts—caste discrimination, ethnic conflict, post-colonial racial hierarchies—that generate papers containing the relevant keywords. There may also be a selection effect whereby Asian scholars who enter social science fields in Western academia are disproportionately drawn to inequality research as a way of making sense of their own experiences as racialized minorities, creating a positive association between `asian` and racial inequality discourse within the social science subset. `news_inequality_mentions_3_years` and `paper_inequality_mentions_3_years` remain theoretically important for explaining temporal variation in the aggregate level of racial inequality discourse, such as why there is more racial inequality scholarship in 2021 than in 2005, but they are poorly suited for cross-sectional prediction of which individual papers discuss racial inequality. Because these temporal-contextual features are constant for all papers published within the same three-year window, they cannot discriminate between a sociology paper on racial discrimination and a chemistry paper on molecular bonding published in the same year. Their predictive power is confined to explaining between-year shifts in the base rate, which constitutes a small fraction of the total variance in a dataset of approximately 150,000 papers spanning multiple decades. These features therefore belong to a secondary tier of explanatory factors that shape the background rate of racial inequality discourse without being the primary differentiators of which specific papers engage with the topic. Overall, racial inequality scholarship is centered on disciplinary location, generalized inequality sensitivity, national intellectual tradition, and distributed racial identity. It is produced by a broader coalition of scholars than a narrow race-specific standpoint theory would predict: women scholars contribute through intersectional consciousness and generalized sensitivity to domination; scholars from racially diverse countries contribute through nationally embedded intellectual traditions of studying intergroup relations; and Asian scholars contribute through research on anti-Asian racism, algorithmic bias, and ethnic hierarchy in non-Western contexts. The prediction of racial inequality discourse therefore requires attending to this full coalition rather than focusing exclusively on the group most directly affected by anti-Black racism."}, {"id": "GenAI-23", "name": "gemini_3.6flash_extended", "x": 0.30229774743126536, "y": 0.9199999999999999, "degree": 7, "words": 189, "explanation": "The theoretical framework integrates institutional sociology, expanded standpoint epistemology, and macro-demographic reflexivity to explain academic engagement with racial inequality. At the institutional level, `social_science` serves as the foundational structural gating mechanism, providing the requisite theoretical paradigms, qualitative and quantitative methodologies, and editorial mandates necessary to formally operationalize structural racism and social stratification. At the author level, standpoint theory expands into a broader coalitional critical consciousness: author identity acts as a powerful epistemic motivator where marginalized or non-dominant group representation—encompassing Black scholars (`black`) who possess direct lived experience of racial hierarchies, female scholars (`female`), and Asian scholars (`asian`)—substantially heightens engagement with inequality topics. Female co-authors exhibit a well-established cross-domain affinity for equity and civil rights discourses generally, while Asian researchers increasingly drive racial inequality discussions through scholarship on migration, anti-bias frameworks, algorithmic fairness, and health disparities. Finally, at the contextual level, an author’s exposure to demographically diverse origin environments (`country_race_diversity_score`) fosters early awareness of multi-ethnic relations and post-colonial structures, instilling a heightened socio-cultural reflexivity that influences research agendas. Together, academic discourse on racial inequality is governed by the structural alignment of institutional discipline, intersectional scholar identity, and macro-national demographic background."}, {"id": "GenAI-24", "name": "GPT_5.6Sol_high", "x": 0.8351974059120256, "y": 0.2912604265204408, "degree": 19, "words": 302, "explanation": "Disciplinary context comes first, with author-team composition and national background also central. `social_science` is the strongest positive predictor because these fields provide the concepts, methods, journals, and audiences through which racial bias, discrimination, diversity, and justice are studied explicitly. `female`—reported as `female_score`—has an important positive association because women scholars may be more concentrated in research areas concerned with discrimination, identity, health disparities, education, and social justice, and may also be more likely to adopt intersectional perspectives that connect gender with race. `country_race_diversity_score` has a positive role: authors inferred to come from more racially heterogeneous countries may have greater exposure to multicultural institutions, migration, minority-majority relations, and public debates about r
