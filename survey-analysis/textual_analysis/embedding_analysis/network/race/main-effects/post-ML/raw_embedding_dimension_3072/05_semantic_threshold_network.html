  <script id="network-data" type="application/json">{"title": "Semantic Network", "subtitle": "Race · Main Effects · Post ML", "threshold": 0.8196, "threshold_quantile_pct": 85, "collapsed": false, "panels": [{"id": "student", "title": "PhD Students (n=60)", "color": "#7DB7E8", "nodes": [{"id": "student-0", "name": "phd_contributor_wbgok", "x": 0.4713264966098256, "y": 0.28475100053148766, "degree": 0, "words": 115, "explanation": "Country race diversity affects the probability of developing interest in this area by helping people develop interest examining their background. Social science also has a natural positive impact. Female, asian, and black authors are more likely to do research in this area because exposure to inequality increases the probability that authors do research in this area. Authors race diversity matters because if you want to do research in this area you would be more likely to form a diverse author team. Or, if you have a diverse community at university/ research group, you would be more likely to be interested in such research. Paper mentions affect the future research. News mentions might raise academic attention."}, {"id": "student-1", "name": "phd_contributor_ul2n5", "x": 0.2739406827619813, "y": 0.290229258092115, "degree": 0, "words": 132, "explanation": "Race is a social construct and thus will be studied more in social sciences. Since white people are less likely have been exposed to racism directly and indirectly, they are less likely to be interested in researching racial inequality. By the same reasoning, people who are from more diverse countries are expected to be more aware of racial inequalities, and therefore are more likely to want to publish on racial inequality. Because women have more direct and indirect exposure to gender inequality, and gender and racial inequalities share similarities in a structural sense, they are more likely to also be interested in racial inequality. When racial inequality issues are more prominent in papers, it is more likely that people get published in this space and that people find it interesting to research."}, {"id": "student-2", "name": "phd_contributor_yedjp", "x": 0.20565497214582457, "y": 0.36457788987616785, "degree": 1, "words": 110, "explanation": "For black scholars, racial issues are more relatable. This will lead to more publication likelihood of racial inequality. Intersectionality hypothesis may take hold. News mention indicates that there are a lot of racial issues at the moment, driving scholars to publish more on this issue. Social science is the home of racial inequality topic. It is likely that scholars will submit to social science journals. Natural science rarely discuss about inequality, and it will be rare to see racial inequality studies in Natural science field. When the country is diverse, it is less likely that scholars will be able to find common ground on inequality topics due to different experience."}, {"id": "student-3", "name": "phd_contributor_c5sgk", "x": 0.1996703318757112, "y": 0.18053615013819796, "degree": 0, "words": 132, "explanation": "I posit that the likelihood that a published paper addresses racial inequality is driven by the supply of and demand for scholarship on this topic. On the demand side, journal receptivity is central. Social science journals, in particular, are particularly receptive venues for inequality research: they both attract a higher volume of submissions on racial inequality and exhibit a greater propensity to publish such work. On the supply side, individual scholarly interest shapes the supply of gender inequality works. Interest in gender inequality stems from both general and specific sources. General interest arises among scholars attentive to inequality broadly, including those focused on racial inequality, suggesting a spillover effect across inequality domains. Specific interest emerges among scholars directly engaged with gender inequality discourse, reflecting targeted attention to this particular form of stratification."}, {"id": "student-4", "name": "phd_contributor_45ypj", "x": 0.6004820913112713, "y": 0.530788440226577, "degree": 0, "words": 103, "explanation": "I believe social science is the most likely field for this research hence high positive predictive power. I hypothesize that there may be an aversion from majority white author teams to work on racial inequality as they may not see it as their place/may not be comfortable claiming space in this discussion leading to lower topic fit which would make these negative predictors. Alternatively, high scores on asian, black and other racial identity variables may be more nuanced positive predictors. Positive prediction should then hold for more racially diverse author teams/papers whose authors are inferred to be born in more racially diverse countries."}, {"id": "student-5", "name": "phd_contributor_5nazt", "x": 0.3895826742849736, "y": 0.08, "degree": 0, "words": 39, "explanation": "Racial minority groups may care more about the topic due to self-identity. I personally know many women doing research in racial fairness as well. I also think the social sciences are the main area for this type of work."}, {"id": "student-6", "name": "phd_contributor_mdmrd", "x": 0.22392162749916944, "y": 0.494607451253845, "degree": 3, "words": 97, "explanation": "Firstly, similar to gender inequality, racial inequality is also a socio-economic topic and naturally papers from fields in social science have higher probability to discuss it. Secondly, racial inequality often hurts minorities, therefore I would expect authors from countries with dominant race to resonate and contribute more to this topic. Finally, news_inequality_mentions would increase the probability of studies in racial inequality because media coverage and exposure may subconsciously affect researchers' motivation to conduct related research. However media coverage of racial inequality topics may come in waves, therefore this may not have a top 5 strength of association."}, {"id": "student-7", "name": "phd_contributor_kmwj4", "x": 0.6007281008071795, "y": 0.6113795961838986, "degree": 0, "words": 109, "explanation": "It's a similar situation to the situation with gender, for the social_science variables. Since Hispanics are grouped with other races, probably the most correlated would be the estimated share of Black and Asian authors, because those wouldn't be impacted by grouping together radically different experiences under one variable. A more racially diverse country of origin seems likely to predict that authors are interested in investigating racial inequality as well (considering the company they are keeping for writing the paper). Moreover, it should be noted that interest in being one kind of minority also seems correlated with interest in being another kind, so female score should be relevant here too."}, {"id": "student-8", "name": "phd_contributor_zbjey", "x": 0.19262648270683458, "y": 0.9199999999999999, "degree": 0, "words": 67, "explanation": "The first four are directly races. If they highlight race terms in the title, they are more likely to be associated with race inequality to me. The last one is the news coverage of inequality. There could be many different types of inequalities in the news. Also, I think there will be more race inequality appearing on news than papers. That's why I exclude paper as features."}, {"id": "student-9", "name": "phd_contributor_2xy9o", "x": 0.5313659934915096, "y": 0.6090282086758593, "degree": 0, "words": 422, "explanation": "My line of reasoning structures around social science as the main indicator resulting in mentions of racial inequality, and around race saliency and personal experience as mediators for race-related and demographic variables. Social science should have a positive association due to the nature of the field itself. This should be very intuitive as social science related fields are fundamentally involved with the question of social harmony, equality, morality and interindividual differences. Not only are racial concerns fundamentally associated with the fields involved, such as economics, psychology, sociology, politics, etc., but furthermore, racial concerns have been very salient in these fields through previous mentions of it in research papers and through direct association with it in textbooks. I am strongly led to believe that people would publish or conduct research on racial concerns, and that more so, people interested in racial concerns would also lead themselves to study social sciences. Race-related predictors are better separated into race saliency and personal experience directly, rather than combined into a single race diversity variable. Country_race_diversity_score relates to the notion that the more salient a social issue is, the more inclined people are to think about it and study it. Countries that are highly diverse in ethnic population will have much larger ethnic or racial social issues due to the nature of its inequality structure, such as France, the UK, USA, Canada, etc., whereas highly homogenous countries often focus more on social issues within a collective racial ethnicity, such as Japan, China, South Korea. For instance, while both such countries study gender inequalities, I would not be surprised to find much more papers on gender inequality or gender differences in the homogenous countries relative to racial papers, whereas in diverse countries, racial and gender papers might be closer in proportion. Black, asian and female relate to the notion of racial saliency, and also to the notion of personal experience. Authors' own personal racial or demographic experience could play a large role because it influences the saliency of racial concerns towards an author. I would like to note however in the race saliency, personal experience and social science categories, that there is also the legal issue involving whether authors are allowed to collect data on racial related information in participating individuals. For instance, France treats racial data in a highly sensitive manner, often disallowing researchers to handle it entirely for experimental studies. This might slightly affect my line of reasoning, although due to the majority of research being conducted in the US, I stand by my initial arguments."}, {"id": "student-10", "name": "phd_contributor_z7ttj", "x": 0.5057948384567256, "y": 0.4269874286295749, "degree": 5, "words": 187, "explanation": "The prediction of racial inequality research is driven by a combination of disciplinary infrastructure and a broadened marginalized standpoint epistemology. Social science is the primary predictor because it serves as the necessary \"methodological container,\" providing the specific qualitative and quantitative tools required to analyze race as a structural rather than biological construct. The female_score suggests a theory of intersectional solidarity or shared marginalization. This assumes that scholars who navigate gender-based hierarchies are theoretically more attuned to other forms of systemic power imbalances, making them more likely to apply their analytical focus to racial stratification. This is further supported by the country_race_diversity_score, as well as Asian and Black identifiers, which reflect contextual and positional salience. These features assume that a researcher’s lived experience in diverse or racially stratified environments increases the personal and professional urgency to investigate race. Collectively, the positive correlations across these features indicate that research on racial inequality is not a neutral occurrence but a byproduct of a \"critical mass\" of outsider perspectives—where being female, being from a diverse background, or being trained in social-scientific critique all converge to prioritize the study of systemic inequality."}, {"id": "student-11", "name": "phd_contributor_le01h", "x": 0.5754551548325207, "y": 0.25999418298017857, "degree": 0, "words": 60, "explanation": "Social_science is a broad field that includes discussion of racial inequality, so i ranked it as most important because it is an umbrella term. Asian and black are minority groups compared to white. Since scholars tend to focus on minority groups, I put white as less important. Finally, author_race_disverstiy_score implies a metric regarding race, so I considerd it as important."}, {"id": "student-12", "name": "phd_contributor_giyw7", "x": 0.4110707305443929, "y": 0.48411896718046454, "degree": 9, "words": 144, "explanation": "social_science is the most predictive in both the gender and racial inequality contexts, suggesting that disciplinary focus/location can really drive whether or not inequality is a focal topic. Gender composition might be a proxy for broader orientation/focus towards inequality research broadly; teams with greater gender representation may be more likely to engage in inequality related work in general. country_race_diversity_score is also predictive: rather than author race itself driving a focus on racial inequality, authors interpreted as coming from more diverse countries are more likely to study inequality. this might be because these authors might be socialized to more diverse contexts where inequality is more salient, although I'm not totally sold on this operationalization. paper_inequ_mentions would be another positive predictor, although the weakest, because rising academic attention to racial inequality could have similar diffusion effects to the gender context and lead to an epistemological shift."}, {"id": "student-13", "name": "phd_contributor_7x004", "x": 0.9199999999999999, "y": 0.49365017721224685, "degree": 0, "words": 39, "explanation": "individuals are posiive, and the effects are still positive. asia may be significant, although there are so many heterogeneity of the data and asia is too hard to isolate the effects. hispanic_and_other is more likely to isolate the effect."}, {"id": "student-14", "name": "phd_contributor_ayd29", "x": 0.3384168565885413, "y": 0.5094100506063854, "degree": 20, "words": 275, "explanation": "Racial inequality is a social phenomenon, so the discipline of a paper is likely important and hence social_science would be a predictor. Papers published in journals covering sociology, political science, economics and psychology are probably very likely to engage in inequality research. Since scholar identities shape their research agenda, Black and female authors are likely to explore inequality, and as a consequence, racial inequality within their research. This is well-documented in the sociology of science literature on \"positional knowledge\" and demographic patterns in research topic selection. Author demographic composition matters in ways beyond Black and female authorship. The country_race_diversity_score suggests that authors from racially diverse countries bring greater awareness of racial dynamics to their research. Perhaps growing up in a multiracial society likely exposes scholars to racial tensions and discourse that shape their intellectual interests. The positive association with Asian authorship is unexpected but plausible. Asian scholars, particularly those working in Western academic institutions, may engage with racial inequality research because they themselves navigate racialized experiences as minorities. This reflects a broader pattern where minority scholars of various backgrounds, not only Black scholars, are drawn to studying racial dynamics. Time-lagged news and academic inequality mentions capture meaningful broader societal and intellectual trends, and can motivate authors willing to write relevant research to focus on racial inequality, but they are less predictive than author-level demographic features because the time-lagged measures vary only across publication years and lack the individual-level variation needed to discriminate between papers published in the same period. The composition of the author team appears to be a more granular and therefore more powerful predictor of whether a specific paper engages with racial inequality."}, {"id": "student-15", "name": "phd_contributor_558ea", "x": 0.1854542171196472, "y": 0.2528646659968378, "degree": 0, "words": 54, "explanation": "Racial inequality is a topic in Social Science, which many female researchers are active in. Black people are the victims of racial discrimination, whereas asian people have political correctness needs to blend in the white society. People from a country with more racial diversity is more likely to be interested in racial inequality topics."}, {"id": "student-16", "name": "phd_contributor_dwdg8", "x": 0.19477371464548904, "y": 0.4799626790488713, "degree": 2, "words": 50, "explanation": "I believe social science majors with a higher probability that a paper discusses racial inequality than STEM. Similarly, female people and black people may talk about racial inequality more as well. Authors' race and news mentioned may also have some influence on the probability that a paper discusses racial inequality."}, {"id": "student-17", "name": "phd_contributor_fojz7", "x": 0.27663863782038606, "y": 0.7222830950023402, "degree": 0, "words": 70, "explanation": "My assumptions are (1) disciplines have unequal focus and attention on latest \"social issues\" -- social science naturally and inherently build themselves on these discussions, in contrary to engineering, (2) underrepresented groups will pay more attention to inequality issues, and this case, black people and racial inequality issues, and (3) papers whose authors are inferred to be born in more racially diverse countries are more likely to discuss racial inequality."}, {"id": "student-18", "name": "phd_contributor_ogfiu", "x": 0.3830251859401783, "y": 0.194770135164889, "degree": 0, "words": 174, "explanation": "Social science (as opposed to engineering and most natural sciences) has subdisciplines such as labor economics that investigate the distribution of earnings, human capital attainment across individuals, status theory from sociology and different IAT measures from social psychology, etc. - by nature these subfields are interested in hierarchies among human beings. I further believe that the race of the authors influences their field of interest within their chosen discipline (e.g. Cindy Dupree at UCL who has developed a new measure of racial hierarchies) and if these researchers come from different countries they may also be more open towards the experience of being a foreigner, working in a foreign (non home country) country or dealing with international students of different racial backgrounds - all factors that could contribute to a strenghtened interest in racial inequality. Being a minority academic (e.g. Asian or Black) could also contribute to a strenghtened interest in racial inequality. Lastly, women academics may be more attuned to racial inequality given their own lower status position as measured against their male counterparts."}, {"id": "student-19", "name": "phd_contributor_rvget", "x": 0.5243174274784431, "y": 0.7800832795569135, "degree": 0, "words": 98, "explanation": "If this paper is about social science, it's more likely to discuss the racial inequality issue. So I think the subject of the paper is the most important thing. Therefore, the subject variables is the top feature. Female researchers will be more interested in inequality topics, so the second most important feature is female score. country_race_diversity_score is also an important feature as people from racially diverse countries may be more interested in racial inequality problem. As minority in english speaking countries, asian authors may be more interested in racial inequality. Similarly, black score is also an important feature."}, {"id": "student-20", "name": "phd_contributor_zcof0", "x": 0.4367307669308536, "y": 0.2714078253160955, "degree": 1, "words": 93, "explanation": "Being in the social sciences naturally increases the focus on structural issues like racial inequality because the academic domain is the primary filter and the field is built to analyze these kinds of questions. People study what they experience and what their field is built to analyze. Specific demographic features such as female_score, black, and asian, along with country_race_diversity_score, also matter because direct, specific lived experiences of marginalization, whether by race or gender, provide a much stronger, clearer signal for researching systemic inequality than a generic mathematical diversity metric or broad news trends."}, {"id": "student-21", "name": "phd_contributor_yg9p5", "x": 0.5213953461722158, "y": 0.48895706773687053, "degree": 7, "words": 110, "explanation": "I believe that social_science is the strongest positive predictor because social science provides stronger incentives for studying social inequality. There should be more work on racial inequality in social science, and field-related variables matter because research is often incentivized differently across fields. female_score is also an important factor, operating through greater prosocial orientation or attention to inequality-related issues, increasing the likelihood that research involves racial inequality. country_race_diversity_score may influence outcomes through exposure to more diverse social contexts, which could shape researchers’ ideas and make inequality-related topics more salient. asian and black may reflect differences in lived experience, research interests, or academic networks, increasing the likelihood that research involves racial inequality."}, {"id": "student-22", "name": "phd_contributor_5wz57", "x": 0.2691432791584538, "y": 0.6124820827202654, "degree": 2, "words": 129, "explanation": "First, news and papers mentioned in the past three years are a strong indicator of the main question discussed in the paper. They show the ongoing research interest of the author, and a higher percentage of race inequality citations indicates a higher likelihood of this topic. Second, country's race diversity and author's race diversity are also correlated with the topic. If authors come from diverse background, they are more likely to be aware of this subject. Country's race diversity is stronger correlated, as the growing-up background and original culture are a stronger connection with authors. Third, race inequality is a research topic in social science, which is strongly correlated. Most race inequality papers are associated with a tag of social science, even if it uses computational or mathematical methods."}, {"id": "student-23", "name": "phd_contributor_wqux6", "x": 0.1772552232368005, "y": 0.5745294636104556, "degree": 1, "words": 83, "explanation": "The domain which the paper belongs to is the most important indicator, in my opinion. A social science paper is more likely to talk about racial inequality rather than natural science or engineering and technology papers. If there is a Black author of the paper, the paper is more likely to be on racial inequality. And inequality being mentioned in the news for the past 3 years is a less strong indicator that academics could be interested in conducting research in this topic."}, {"id": "student-24", "name": "phd_contributor_mcaaw", "x": 0.340965143692595, "y": 0.36054520742919627, "degree": 3, "words": 149, "explanation": "While racial inequality has been a massive societal issue for a long time, academics seem more likely to study it when it is an issue in the gender discourse. Then, academic papers are likely to cause more academic papers on the topic. I think the authors' race is two sided. First, more diverse authors might be more interested in this topic due to their own experience with racial inequality. Secondly, author teams might be wanting to have more diverse author teams in order to signal that they are not part of the problem that their article is discussing. This makes the effect cyclic. Black, Asian, and Hispanic features are likely to have large positive effects for the same reason. Lastly, I think social science papers are going to actually study this issue, while natural sciences (and again engineering to a lesser degree), do not focus on racial inequality directly."}, {"id": "student-25", "name": "phd_contributor_1kwwe", "x": 0.3016490156329949, "y": 0.38985836291318876, "degree": 5, "words": 99, "explanation": "Based on my limited personal experience (and most likely not representative), a large number of researchers who work on equity-related issues will touch on both gender inequality and racial inequality in their research works, though these two topics might be studied in their separate papers. Social science is the most relevant domain for racial-equity issues, so papers in this domain will have a strong positive correlation with discussing racial inequality. Furthermore, black and country_race_diversity_score are important because racial inequality issues might be more prevalent for authors belong to black and authors whose country has a higher diversity of race."}, {"id": "student-26", "name": "phd_contributor_iv4qg", "x": 0.2926542091762389, "y": 0.640950548392663, "degree": 2, "words": 73, "explanation": "I think natural_science and engineering_and_technology papers are very unlikely to study racial inequality, so they are ranked highest. Authors from countries with diverse races are more likely to study racial inequality, so country_race_diversity_score is ranked third. Black authors are more likely to discuss racial inequality, so it is mentioned fourth. Paper_inequality_mentions_3_years signals the popularity of the topic, and can be associated with social compaigns related with racial inequality, so it are ranked fifth."}, {"id": "student-27", "name": "phd_contributor_c9vs4", "x": 0.15002207358805808, "y": 0.3357458847637295, "degree": 0, "words": 67, "explanation": "Racial inequality is a human issue rather than a physical one, so it does not relate closely to natural science. Social inequality stems from human interaction, which ties it directly to social science. Based on limited observational patterns, female, Black, and Asian are positively associated with whether a paper discusses racial inequality, although it is not clear how to construct causal relationships or theories from these observations."}, {"id": "student-28", "name": "phd_contributor_mrqrj", "x": 0.28664220179334277, "y": 0.27766788486776456, "degree": 0, "words": 106, "explanation": "Social science is more likely to do research on racial inequality, as opposed to STEM or medicine, where gender is a basic characteristic used in analysis. White might be less likely because they are less affected by racial inequality and while they recognize it might not pursue it as a research topic. The diversity of the country racial composition could indicate interest and awareness in this area and similarly encourage research in racial inequality. Racial inequality is more politically charged, so news inequality mentions in the last 3 years could be predictive. Females may be more sensitive to the topic and to research inequalities in general."}, {"id": "student-29", "name": "phd_contributor_zi2lh", "x": 0.40765502332264975, "y": 0.6922538205042843, "degree": 0, "words": 321, "explanation": "My interpretations are based on trying to infer the coefficients of factors in a probability of discussing racial inequality on exogenous factors. Social science is an important factor, as racial inequality is generally considered a social science topic, and not considered under natural science purview. Among papers that are not social sciences, however, natural science versus engineering-tech does not vary too much. Across racial groups, blacks are more likely to discuss race, as members of the black community are the highest recipients of racial discrimination and hate-crimes. Asian and Hispanic-other effects may be similar, though hate across Asians is significantly discussed in academic papers; this depends on the corpus of papers analyzed, and more context would be needed to form a stronger belief on this aspect. Members of the white community in academia are generally vocal about racial biases, and are dwarfed generally by their black peers. Diversity in authors' countries is a strong predictor, as it raises exposure to the perils of racial hate. If a country is relatively diverse, like the US, UK, countries in the EU, etc., then the historically privileged community in academia is likely to be vocal about these issues. Whereas if an author coming from a less diverse country, predominated by one race, is likely to have fewer exposure to the perils of racial inequality, and hence less likely to write about it. Historical immigration rates in the author's countries may also be included into this model. I do not think sex, number of authors, computer science papers and historical trends in academic racial discussions have a significant effect on whether a paper discusses race. The historical trends in academic racial discussions is marginally associated, but not conditionally accounting for articles in the news media. The news media articles would have an effect on discussing racial hate, for example the George Floyd incident, but this effect may be dwarfed by the importance of race-related factors."}, {"id": "student-30", "name": "phd_contributor_559wp", "x": 0.40958898550929856, "y": 0.5282346649818996, "degree": 11, "words": 163, "explanation": "Social_science feature positively related to racial inequality because racial inequality is a social science topic, so there must be more articles/papers published in social science journals than others. Related to this, female variable is important because in social science, there might be more female authors and these authors interest in racial inequality more than others because they might interest in inequality topics generally. Black and asian variables might be positively related since racial inequality research is more popular in the western countries where authors from these identities live and produce research. Also, since these groups are historically disadventagous groups, the authors from these groups might interest in racial inequality research more than other groups. The variable of country_race_diversity_score is also important because this research mostly requires to contact people from different groups, so if the diverse group of people might be more common, racial inequality research might be more important in that country and authors might interest in this research more than others."}, {"id": "student-31", "name": "phd_contributor_34xvl", "x": 0.5790185223286121, "y": 0.41531316185626327, "degree": 0, "words": 185, "explanation": "My reasoning is similar to my previous long explanations. The only difference here is that I believe that \"black\" plays a significant role, as most race studies focus on black individuals in Western countries. The concerns for asian, Hispanic, white, etc., and other geographies are seen as much less important. Also, with affirmative action programs, many positions have been created to focus on the inequalities faced by black individuals. Often, such positions have been filled in by black individuals, so I believe there is a very strong positive association between \"black\" and \"race inequality\", although not 100% as not all black authors focus on racial inequalities. Thus, it is not as strong as natural_science and engineering_and_technology, where such discussions are totally absent. country_race_diversity_score is also positively associated with discussions of racial inequality. asian may also be associated with discussions of racial inequality, though this is hard to comprehend; perhaps there are studies that focus on racial inequalities related to Asian. It would help to define \"Asians\", since this could mean central asians, indians, chinese, etc., and the term is too vast to actually conclude much."}, {"id": "student-32", "name": "phd_contributor_kyj4r", "x": 0.3919559113939693, "y": 0.5831792552781271, "degree": 6, "words": 218, "explanation": "I hypothesize that paper_inequality_mentions_3_years has the strongest positive relationship with the probability that a paper discusses racial inequality. Academic research often follows a \"lead-follow\" pattern. When specific topics become trending, an increasing number of researchers will shift their focus and follow this trend. I rank social_science as the second most important variable regarding subject characteristics and publication practices. Firstly, because racial inequality is a societal issue, social science researchers have more training and higher sensitivity toward these topics. Secondly, racial inequality can be more naturally integrated into social science framework than into STEM fields. I rank Asian third. Asian may involve the majority of the sample. Meanwhile, asian researchers may think that they experienced significant racial discrimination in academia and increase their motivation to include this issue in their research. I rank black as the fourth most important variables since black people may have a live understanding of racial discrimination. Such kind of individual identity will increase their their interests and social responsibility towards this issue; on the other hand, their research will be naturally justified, which will give them more credits to do such kind of research. I rank female fifth. Female researchers may also experience potential discrimination in daily life, not restricted to racial discrimination. Shared experience may increase their tendency and awareness of racial inequality."}, {"id": "student-33", "name": "phd_contributor_ama1n", "x": 0.3973872314467053, "y": 0.26928831018270605, "degree": 2, "words": 109, "explanation": "Social science is the primary field in which racial diversity is studied. In my experience, black and minority race individuals are much more likely to focus on conducting research on topics of racial inequality. While individuals, on the other hand, is much less likely to do that given the lack of knowledge on the issue. Country race diversity score is an important factor as racial inequality is much less of an issue in countries that lack diversity to begin with, e.g. China. Other factors like female and Asian might also be predictive as there could be intersectionality effects. I guess racial inequality with asian is also a prominent issue."}, {"id": "student-34", "name": "phd_contributor_0k61g", "x": 0.5084364630900187, "y": 0.31253350685341874, "degree": 0, "words": 65, "explanation": "I believe two components are important: 1) the identity of the authors, and 2) the country's racial inequality background. So I think the authors' own races (asian or black) and the racial composition of the author team are very important, followed by the trend in the country's racial inequality background. Social science is important, as I assume inequality is rarely discussed outside of social science."}, {"id": "student-35", "name": "phd_contributor_dpw1t", "x": 0.4327086923168427, "y": 0.5767479344315843, "degree": 10, "words": 190, "explanation": "I rank social_science as the most important predictor with a positive sign because racial inequality is a core topic within many social science disciplines, such as sociology, political science, and economics. Journals in these fields are structurally more likely to publish work that explicitly engages with race and inequality. Second, I rank paper_inequality_mentions_3_years positively because research tends to follow ongoing academic conversations. When inequality has recently been widely discussed in scholarly publications, new papers are more likely to build on those themes, including racial inequality. Third, I assign a positive sign to authors_race_diversity_score because a more racially diverse research team may bring a wider range of perspectives, experiences, and research interests, potentially increasing the likelihood that racial inequality is addressed. Fourth, I expect the share of Black authors to have a positive association, under the assumption that lived experiences and identity can influence research interests and sensitivity to racial inequality topics. Finally, I assign a modest positive effect to num_authors, as larger teams may be more interdisciplinary or include broader viewpoints, though I expect this effect to be weaker and more indirect compared to disciplinary focus and recent academic trends."}, {"id": "student-36", "name": "phd_contributor_1gofd", "x": 0.17063340941953686, "y": 0.7007255854069063, "degree": 0, "words": 154, "explanation": "Being in natural science means to me the study/research will be negatively correlated with the topic of racial injustice and will not be related to racial difference at all, because we have moved beyond the era that differentiate human races with eugenics perspectives. Social sciences is listed at least important to be concerned with the racial issue and discussion, but only partially, there are a large number of social science study that does not relate to inequalities at all. news and paper mentioned should be positively correlated because if it is mentioned, there are some relationship between the argument the paper is making and the news/paper mentioned. If the news/paper is related to inequality, the argument is likely to be related. The diversity scores is not necessarily related, but I think if there is a categorical data, there may be a pattern in researcher from certain country may be more/less interested in the topic."}, {"id": "student-37", "name": "phd_contributor_4luvh", "x": 0.29415861802548227, "y": 0.5098206260456817, "degree": 13, "words": 364, "explanation": "First of all, racial inequality is a topic that should be categorized under social sciences, so papers published in a social science-related journal should have a higher probability to address racial inequality. While authors from countries which do not have high racial diversity can still study racial inequality because they can become aware of the issue itself through books and papers (and general media), for authors who live in countries with high racial diversity it is easier for them to become aware of the issue of racial inequality, and get the incentive to write papers to address it. As mentioned above, texts and media coverage can serve as the source of problem awareness, so if papers or news mentioned racial inequality, some researchers may realize that racial inequality can become the topic of their future studies, thus leading to paper production in the future. Among news and academic papers, I think academic papers have a higher impact, because we focus on academic papers. Researchers may tend to lean more on academic literature to determine their research topics. Racial profile of the author list does have correlation with the probability to address racial inequality. Black group's experiencing of racial inequality should be one of the most significant demonstrations of racial inequality, so the higher black author share implies higher awareness of the racial inequality issue and willingness to address it, thus higher probability of writing the papers on this issue. For asian authors it is actually similar, as asian is minor in many Western countries, so that they also experience racial inequality in person, which also gives them higher awareness and willingness to address racial inequality. Moreover, if the black author share is higher, the authors are also more likely to come from countries with higher racial diversity, thus instances of racial inequality. For female author share, I would consider that this is a result of racial inequality being a counterpart of gender inequality. Female's awareness of gender inequality also develops their awareness of racial inequality, and the willingness to address racial inequality. In addition, I think when female author share is higher, the paper is also more likely to be a social science paper."}, {"id": "student-38", "name": "phd_contributor_mfkek", "x": 0.32157428599410015, "y": 0.4405521109103047, "degree": 7, "words": 171, "explanation": "Racial inequality research is driven primarily by disciplinary structure and demographic/contextual composition, rather than being primarily path dependent on prior inequality attention or short-term academic or media salience. social_science is the strongest predictor because racial inequality is institutionally embedded in disciplines such as sociology, political science, and related fields. Racial inequality research is also strongly shaped by both individual-level and macro-level demographic contexts. Scholars’ social identities and the diversity of their national contexts systematically influence topic selection. A higher share of Black authors likely reflects lived experience and community engagement mechanisms. The positive effect of female authorship suggests that female scholars may disproportionately engage in broader structural inequality research, not only gender-related topics. The importance of country_race_diversity_score indicates that being embedded in more racially diverse societies may heighten awareness of racial stratification and stimulate related research. Finally, the positive association for Asian authorship may capture regional academic contexts, transnational inequality debates, or collaboration patterns linked to diversity. Overall, disciplinary institutions and demographic context are the main drivers of racial inequality research."}, {"id": "student-39", "name": "phd_contributor_81m5u", "x": 0.4967145972071661, "y": 0.5505252493787188, "degree": 6, "words": 108, "explanation": "\"social_science\" is an important sign as most of the studied focusing on racial inequality are published in social science journals. \"asian\" and \"black\" gives positive impact on the prediction. Since they are non-white groups and may suffer from the racial inequality in western sociality, they are more likely to study the racial inequality. \"white\" is a negative sign for prediction as the more ratio of white people, the more likely that they focus on other traditional topics rather than racial inequality. \"author_race_diversity_score\" matters because when the team is more diverse, the authors respect and aware more about the diversity, and thus they tend to work on racial inequality."}, {"id": "student-40", "name": "phd_contributor_blzc1", "x": 0.5790417931159724, "y": 0.4728199153106429, "degree": 0, "words": 121, "explanation": "I ranked social_science first because I believe racial inequality is widely studied in social science research, so the association should be strongly positive. Next, I placed engineering_and_technology and natural_science, since these fields tend to focus more on scientific facts and phenomena and therefore are less likely to explicitly discuss racial inequality (so the relationship may be weaker or negative). Then, I selected female, since female authors may be more prevalent in social science fields (i.e., the proportion of female authors in social science may be higher than the proportion of male authors). I also expect minoritized groups, such as Asian and Black authors, to be positively related. I consider the remaining features too noisy to show a clean or consistent relationship."}, {"id": "student-41", "name": "phd_contributor_c5rzh", "x": 0.4277631403202251, "y": 0.6234094094579733, "degree": 6, "words": 173, "explanation": "I expect that papers in the social sciences are more likely to discuss racial inequality because this topic is central to disciplines such as sociology, political science, and social psychology. Therefore, the feature social_science should have the strongest positive effect. I also expect that teams with a higher proportion of Black authors may be more likely to study racial inequality because researchers’ backgrounds and lived experiences can influence their research interests. Similarly, a higher authors_race_diversity_score may increase the probability that racial inequality is studied, as diverse teams may be more attentive to issues related to race and discrimination. In addition, broader social and academic attention to inequality should shape research agendas. When inequality is frequently mentioned in recent academic publications (paper_inequality_mentions_3_years) or in public discourse such as news coverage (news_inequality_mentions_3_years), scholars may be more likely to investigate related topics. For these reasons, I expect all selected features to have positive effects, with social_science being the most important predictor, followed by academic and news trends, and then the demographic composition of the author team."}, {"id": "student-42", "name": "phd_contributor_iuy3c", "x": 0.3716541021028831, "y": 0.7220265077303752, "degree": 1, "words": 361, "explanation": "My theory is that first and foremost, articles on inequality are published in social science journals. That's just a base rate -- the topic of social science journals are social topics, and diversity / racial inequality is more a a social topic than anything else. The mechanism here isn't anything psychological but statistical so I am not including a mediator. Second, I believe that one's own racial identity may motivate one to research in equality, partly due to a salience argument: if you experience it in your everyday life, you will have more inspiration to research it and tackle it, and partly due to motivation: you likely want to help reduce it for future generations, your kids, your family, your friends, etc. I have a lay intuition that personal motivation may appear higher for people who identify as Black and Asian, because a larger percentage of published research comes from the US, UK, and China. Third, I included Female partly due to my own \"sampling\". It seems that people studying diversity of any kind in my network tend to be female. Sometimes they study gender diversity but often they also study racial diversity. I think the mechanism is actually quite similar to race though: Women may feel more discriminated against (Salience) and want to change that (Motivation) including for social categories not their own (Prosocial). Fourth and finally, I include the diversity of the country in which an author was born. The theory I could come up with is that being born in a diverse region does not mean you live in one now; perhaps the US, where much research is done, is less diverse, and that makes inequality more salient. Conversely, if the US is considered diverse in this sample, then I suppose it means that inequalities are more salient; i.e., if we have a lot of people with a lot of racial ethnicities, shouldn't they all be treated equally? If we were homogenous, then inequalities wouldn't really matter or stand out. So the mechanism would be Salience again, as well as Values likely, ie if I grew up in a diverse country I should value diversity and dislike inequality."}, {"id": "student-43", "name": "phd_contributor_upzfq", "x": 0.4909317287816678, "y": 0.4553743319662542, "degree": 2, "words": 68, "explanation": "Social science should be a strong positive predictor and the other two categories should be strong negative predictors, since racial inequality papers should be almost all from the social science categories and not the other two. Female might be more interested in inequality research in general. country_race_diversity is likely positive related to racial inequality research since people from multi-racial backgrounds might be more interested in racial inequality research."}, {"id": "student-44", "name": "phd_contributor_7nisc", "x": 0.2608403391177232, "y": 0.41862169598523924, "degree": 10, "words": 93, "explanation": "Papers discussing racial inequality will almost always be in the field of social science. They are also more likely to come from countries where this is a popular topic of discussion, particularly countries with high racial diversity. They are also more likely to be written by female authors, which suggests that female researchers may be more likely than their male counterparts to conduct research on racial inequality. Additionally, factors related to the race of co-authors are important, with Asian and Black authors providing especially strong indicators that a paper will discuss racial inequality."}, {"id": "student-45", "name": "phd_contributor_41mim", "x": 0.5251353941107147, "y": 0.6908315287937212, "degree": 1, "words": 143, "explanation": "One would expect that papers in natural science and engineering and technology would be far less likely to discuss race than those in the social sciences. I would expect that only social_science and np.logical_or(natural_science, engineering_and_technology) would matter. These features are collinear, and so it is safe to choose only one. A reasonable a-priori hypothesis is that authors who have experienced discrimination in their lives would be more likely to perform research on it. I therefore chose the female and black categories, and the asian category may also be likely to influence the outcome. The diversity_score features are rather complex in construction. I would be willing to believe that authors from ethnostates would not necessarily care much about racial inequality, and therefore chose that over the author score. In practice, I chose at least one feature from each category as a means of regularization."}, {"id": "student-46", "name": "phd_contributor_8fcno", "x": 0.33164035424116955, "y": 0.6874009727687249, "degree": 0, "words": 146, "explanation": "I believe that authors who have experienced racial issues firsthand or have been in environments where race was salient to write more work in the same topic: for this reason, I expect race indicators and the country the author was born to be a strong predictor. I believe that social sciences will also be a strong predictor of work regarding race; as many disciplines under the category connect naturally to adjacent topics of public policy and economics, where social welfare is of primary interest. I think racial inequality has been more studied in the US -- a major producer of research -- than gender inequality, thus I don't expect public interest to drive research, as much of foundational work has already been done, and rather that more research in this area will be inspired by new work in the field, that poses new questions to answer."}, {"id": "student-47", "name": "phd_contributor_9b8k7", "x": 0.08, "y": 0.5171996861785184, "degree": 0, "words": 27, "explanation": "Papers are more likely to discuss racial inequality when authored by Black scholars and scholars who focus on racial diversity or being affected by the latest news"}, {"id": "student-48", "name": "phd_contributor_9pm5a", "x": 0.3544837455609348, "y": 0.42394622649787517, "degree": 10, "words": 77, "explanation": "According to personal observation, most discussions about racial inequality are related to social science. At the same time, because Black people are subject to racial inequality, more black authors are willing to focus on this topic. Additionally, country_race_diversity is a highly plausible predictor, as authors from those diverse backgrounds have more frequent opportunities to observe and document racial inequality firsthand. And since a lot of social science researchers are Asian and female, they may be highly correlated."}, {"id": "student-49", "name": "phd_contributor_2rhpt", "x": 0.38603471280544444, "y": 0.4126645111595154, "degree": 6, "words": 243, "explanation": "Social science is the most important predictor of whether a paper discusses racial inequality. The field you work in shapes what questions count as legitimate research, and social science has built entire subfields around race and inequality. After field, individual characteristics and context matter. If an author is a woman or Black, that probably increases the chances their work engages with racial inequality, not because of any hard rule, but because people's backgrounds and experiences tend to shape what they find interesting or important. Scholars who experience one form of inequality may become more attuned to others, or women may be concentrated in social science fields in ways that overlap with this pattern. Black still matters, but lived experience alone may not be enough if scholars are working in fields where these questions are harder to publish, and name-based estimates may miss some people. Researchers working in more racially diverse countries are also more likely to write about racial inequality, because working in a diverse environment exposes researchers to conversations about race in ways that shape what they study. Asian authors may also be positive predictors because Asian scholars may be engaging with racial dynamics in their own contexts, whether that is anti-Asian discrimination, colonialism, or immigration. Identity is more complicated than a simple US Black-white frame. Who you are shapes what you study, but where you are, the field you work in, and how the model sees you matter just as much."}, {"id": "student-50", "name": "phd_contributor_z9ezk", "x": 0.20368548246082613, "y": 0.4210994405356778, "degree": 4, "words": 94, "explanation": "A paper on racial inequality is more likely to get published in social science journals, compared to natural science or engineering. From my reading experience, I observe that most of the papers on this topic are written by black or asian authors in the US, where racial diversity is high. A heated discussion of racial inequality in public will increase the attention to authors and editors, which will increase the submission and acceptance rate of papers on racial inequality, especially when there are more special issues announced by editorial teams under such a call."}, {"id": "student-51", "name": "phd_contributor_z2j87", "x": 0.3537794956261356, "y": 0.4573654388376236, "degree": 11, "words": 123, "explanation": "Social science is the strongest predictor of whether a paper discusses racial inequality, as these disciplines (sociology, political science, economics) have racial inequality as a core research topic. Author demographics also matter: papers with higher shares of female, Asian, and Black authors are more likely to discuss racial inequality, reflecting that researchers from underrepresented groups and those with greater awareness of social disparities tend to engage with these topics. Country-level racial diversity of authors' origins positively predicts discussion of racial inequality, as researchers from more diverse national backgrounds bring broader perspectives on race. Disciplinary context provides a stronger signal than any single demographic feature, likely because it captures the systematic study of race within entire fields rather than relying on individual author identity."}, {"id": "student-52", "name": "phd_contributor_872ey", "x": 0.23972858564786642, "y": 0.5738883462321126, "degree": 6, "words": 117, "explanation": "This topic of racial inequality is usually more considered in social science. The black people tend to experience racial inequality more, so a paper with many black authors may be an indicator of this topic. Since this topic of research is inherently diverse, a paper with high diversity score imply that racial inequality is one potential good fit in terms of research topic. Author list with lower country_race_diversity_score may imply that most of the authors are from countries that are not diverse in races (like some European countries) and thus more likely exhibit racial inequality. Finally, many papers discussing inequality in the past 3 years mean that the topic of inequality subsuming racial inequality is trendy now."}, {"id": "student-53", "name": "phd_contributor_7trlj", "x": 0.25846415608741674, "y": 0.49247625462202665, "degree": 4, "words": 274, "explanation": "If a paper is published in a social science journal, compared to other journals from other domains, it has a higher probability of being about racial inequality. So, journal domain is one of the most determinative effects compared to other factors. If inequality is a current theme that the population is concerned about, and this can be due to any population-level issue (e.g., Black Lives Matter), we would expect an increase in media coverage of inequality. This increase in public concern leads to a growing public need for explanation and solutions, thus, academic attention would shift toward inequality research. High coverage of inequality in news may directly increase the probability of a current paper focusing on racial inequality, as editors are more likely to be influenced by public issues. Science follows population level problems, so news covering inequality would be a good positive predictor for the probability of a paper to be about racial inequality. Lastly, even though we cannot draw complete causal chains between author demographics and a domain they prefer to investigate (e.g., there might be other factors explaining this link such as early socialization), a team of researchers who has a higher representation of female, black, and Asian authors might have a higher probability of publishing in a social science journal, which potentially increases the probability of their paper being about racial inequality. This is not a direct causal link, but, being a member of an underprivileged or disadvantaged category would increase their intention to investigate social issues, or be more perceptive towards those, and shape their academic interests in a way that it would align more with social science journals."}, {"id": "student-54", "name": "phd_contributor_1nw3h", "x": 0.4438935591388529, "y": 0.766537699834321, "degree": 0, "words": 340, "explanation": "For a particular academic work, the most important factors are related to that work itself. Therefore, features that are more related to the entire society, such as the news score, is less relevant than the particular features of the paper, such as the racial background of the authors. In terms of particular races, black people historically are discrimanated against, and in modern society such discrimanations still persist. Therefore, black people tend to experience the problems caused by racial inequalities more, and thus are more interested in conducting research on these problems. Similarly, hispanic people have also had a long history of being discrimanated against, although perhaps less pronounced than black folks. White people, on the other hand, are the priviledged group, and tend to experience these problems first-hand much less frequently than others. Therefore, less white people will feel the urge of solving these problems. More white people on the author list thus leads to a decreased probability for a paper to be about racial inequality. The race diversity score is an aggregated information about the authors' racial background. Different races have very different experience of racial inequalities. Therefore, a more diverse group of authors should have less interest in common in terms of the racial inequality problem, leading to a decreased chance of writing a paper together on the topic. The social context is also important. Countries that are more racially diverse tend to face more racial inequality issues than more racially homogeneous societies. This would inspire more people to look into this issue, and produce more relevant papers. For instance, even if all of the authors are black, if they live in an all-black country, it is much less likely for them to experience racial inequality issues than if they were living in a more diverse society. In terms of the order, the more fine-grained about the author background a feature is, the more prioritized it is on the list. And the reason for the ranking of the particular races has already been given above. Thus the ranking."}, {"id": "student-55", "name": "phd_contributor_0r0es", "x": 0.4659370899211315, "y": 0.6783965045667302, "degree": 4, "words": 162, "explanation": "The selected features capture both direct semantic relevance and broader structural mechanisms that shape the likelihood that a paper discusses racial inequality. The feature “black” is ranked as the most important with a positive sign because it directly reflects the primary group most frequently associated with racial inequality discourse in academic literature, making it a strong semantic indicator. The authors_race_diversity_score also has a positive effect, as more diverse research teams are more likely to bring varied perspectives and thus pay greater attention to issues of racial inequality. The social_science feature is assigned a positive sign because disciplines within the social sciences are inherently more focused on studying inequality, institutions, and social structures. The paper_inequality_mentions_3_years variable captures temporal trends in academic discourse; when inequality becomes more prominent in recent literature, new papers are more likely to engage with racial inequality as well. Finally, country_race_diversity_score reflects the broader societal context, where more racially diverse environments tend to generate more research attention to racial issues."}, {"id": "student-56", "name": "phd_contributor_ly6qj", "x": 0.44949090676400627, "y": 0.5418747757433561, "degree": 13, "words": 103, "explanation": "Whether a paper discusses racial inequality is best predicted by social_science, female_score, country_race_diversity_score, asian, and black, all in a positive direction. There is not really much theory to it. The main intuition is that most research on race is expected to be in the social sciences, and, in US-based research, having a Black author seemed predictive because Black Americans are the minority group traditionally experiencing the most pronounced discrimination, though it is also possible that this could make them less likely to write about experiences of discrimination. Beyond that, the predictors are treated as the main ones even without much additional theoretical explanation."}, {"id": "student-57", "name": "phd_contributor_drr4r", "x": 0.36377684337854777, "y": 0.6309424434396064, "degree": 4, "words": 311, "explanation": "First, I believe that in academic work, the active pursuit of a topic is a much stronger underlying motive of a paper than active avoidance of other topics, so the features discussed here are positively related to how the paper is likely to discuss racial inequality. Second, inequality, to my knowledge, is almost a social-science-only topic in academic research, compared with technology or other disciplines listed. Third, from study and life observation, I see that black people are much more willing to highlight the racial inequality aspects of different topics. But the “action” of actually choosing to be a racial inequality scholar might be a different issue. Some black people might intentionally avoid studying racial topics based on related human behavior theories. I am not sure how reliable it is to identify an author's country of birth/childhood only by the last name, especially in places like the United States, UK, Australia, etc.; it is at most an ethnic indicator. Authors from racially diverse countries are likely to work on papers discussing racial inequality. The most sensible explanation I can think of would be that racially diverse countries tend to be 1) immigration countries, thus encouraging studies on racial inequality, 2) developed countries, thus encouraging studies on inequality in general, and 3) have a strong presence of the other features that are positively related to discussing racial inequality. Lastly, women are more likely to talk about and study social inequality topics. But since this is racial inequality specifically, I put it as the last one on the selected feature list. This feature might be interacting with other features; or another explanation is that women either care more about most inequality topics, or they find it more “desirable” to be a racial inequality scholar. The feature of Asian is honestly peculiar, and I am curious to learn about the mechanisms behind this correlation."}, {"id": "student-58", "name": "phd_contributor_u3rga", "x": 0.3866807016586764, "y": 0.34563529905240997, "degree": 0, "words": 171, "explanation": "Engineering and technology is negatively associated with discussing racial inequality because racial inequality is typically outside the domain of this field, aside from engineering work on controlling or measuring social systems. Social science is positively associated because it seems to be the topical domain most associated with racial inequality, and social science may lead to more female authors, with more female authors leading to more interest in studying racial inequality. Natural science is negatively associated because most disciplines within the natural sciences are not human-focused, and thus race would be irrelevant. News mentions are positively associated because they may influence the trend from near the 2000 to the 2020s, though more local variations may not have as much of an effect. Number of authors is positively associated because projects on racial discrimination might be able to garner more popularity amongst academics. The racial diversity of the paper, captured by Asian and Black authors, may also influence discussion of racial inequality, and country-level diversity may influence topic selection toward racial inequality topics."}, {"id": "student-59", "name": "phd_contributor_5cv1y", "x": 0.4462293117698685, "y": 0.4627979038060453, "degree": 4, "words": 140, "explanation": "For social_science, the same logic applies as in the case of gender inequality. For female_score, it seems that if the authors' gender is concentrated among females, then it is most likely due to societal problems. This could be due to the high proportion of women in the social sciences, and such higher concentrations of women authors in a single paper are likely to occur there. For country_race_diversity_score, it is highly likely that the topic's popularity is amplified more in countries with high racial diversity than in those with low racial diversity, leading people to work on and publish in such areas. For asian, there is no theoretical explanation. For black, since historically, discrimination against black people in the United States has been a major example of racial inequality, it makes sense that it has been studied by most black authors."}], "links": [{"source": "student-2", "target": "student-50", "similarity": 0.8464}, {"source": "student-6", "target": "student-14", "similarity": 0.8256}, {"source": "student-6", "target": "student-37", "similarity": 0.8557}, {"source": "student-6", "target": "student-44", "similarity": 0.8469}, {"source": "student-10", "target": "student-12", "similarity": 0.842}, {"source": "student-10", "target": "student-14", "similarity": 0.8304}, {"source": "student-10", "target": "student-21", "similarity": 0.8444}, {"source": "student-10", "target": "student-38", "similarity": 0.8361}, {"source": "student-10", "target": "student-56", "similarity": 0.8385}, {"source": "student-12", "target": "student-14", "similarity": 0.8778}, {"source": "student-12", "target": "student-21", "similarity": 0.8274}, {"source": "student-12", "target": "student-35", "similarity": 0.8416}, {"source": "student-12", "target": "student-38", "similarity": 0.8579}, {"source": "student-12", "target": "student-39", "similarity": 0.8204}, {"source": "student-12", "target": "student-41", "similarity": 0.8292}, {"source": "student-12", "target": "student-51", "similarity": 0.86}, {"source": "student-12", "target": "student-56", "similarity": 0.8346}, {"source": "student-14", "target": "student-22", "similarity" itle": "Senior Scientists (n=13)", "color": "#F4A261", "nodes": [{"id": "senior-0", "name": "senior_contributor_zi680", "x": 0.33791350333930004, "y": 0.578267623864154, "degree": 7, "words": 216, "explanation": "Whether a paper discusses racial inequality is shaped primarily by the discipline in which it is produced and by the composition of the research team, more than by broad external discourse alone. Social science fields routinely collect demographic information such as age, gender, race, education, and socioeconomic status, and they directly study social stratification, hierarchy, schooling, policing, discrimination, labor markets, and inequality, so race is both theoretically central and relatively easy to measure and analyze. Women may be more likely to participate in research that focuses on social problems, inequality, and lived experience, either because of intellectual interests, professional networks, or the kinds of collaborative environments and questions that attract them. Authors from more racially diverse countries, and higher shares of Asian and Black authors, suggest that the social background and diversity of the researchers themselves matter. Teams with more varied racial experiences, or teams embedded in more diverse societies, may be more attuned to racial inequality as an important research topic and more likely to see it as relevant, visible, and worth investigating. Public discourse and prior scholarship still help shape what feels urgent and legitimate to study, but the strongest predictors are closer to the production of knowledge itself, namely disciplinary context and the demographic diversity and lived perspectives represented within the research team."}, {"id": "senior-1", "name": "senior_contributor_tjek9", "x": 0.3139338955748969, "y": 0.33046748821867983, "degree": 5, "words": 118, "explanation": "Of the disciplines listed, I think the vast majority of the racial inequality papers will be in the social sciences, meaning that variable would be associated with whether paper mentions racial inequality. This is based on the theory that racial inequality is more relevant to the social sciences (and also, that the people studying racial inequality are in the social sciences and therefor publish there). I predict women will also publish on racial inequality more because it's a signal of their political beliefs, which is related to their interest in racial inequality. Finally, more diverse countries have a greater history of discourses around racial inequality, which will make the topic more salient to people living in those countries."}, {"id": "senior-2", "name": "senior_contributor_mkvct", "x": 0.7605804286054887, "y": 0.8374337033303502, "degree": 0, "words": 102, "explanation": "race is a social science construct with little relevance to STEM and limited relevance to natural sciences (minus some phenotypical discussions). Ergo, this will be the strongest signal. Black and Asian scholars are more likely to focus on the topics of racial inequality (in North American academia; maybe less so if we look at other countries...), possibly due to social identity and personal relevance. Among the remaining factors, race diversity score is likely to play a role among scholars from countries with a more racially diverse background, due to possible possibly greater discussion of such topics in these countries (and more conflict/tensions)."}, {"id": "senior-3", "name": "senior_contributor_jakh3", "x": 0.1248267925721745, "y": 0.21168578816204547, "degree": 2, "words": 98, "explanation": "Within the general universe of social science articles, social science journals are most likely to publish racial inequality research. Black authors are more likely to publish on racial inequality, and females are also more likely, though this may be interactive rather than purely independent; conditional on race, females are more likely to be associated with a paper that discusses racial inequality. The rationale is historical disenfranchisement, which makes the Asian variable surprising unless there is a covid effect. This is all within the context of country differences, where racial diversity in a country increases publications on racial inequality."}, {"id": "senior-4", "name": "senior_contributor_unrjy", "x": 0.08, "y": 0.702484113698377, "degree": 3, "words": 225, "explanation": "Social sciences are generally more left-leaning with a large share of liberal authors. This will make it more likely that racial inequality would be discussed as a topic explicitly. Similarly, I would expect if more authors are female, racial inequality is more likely to be discussed, as opposed to an all-male author team. This may still increase the more female authors are part of the team. Female, even though not related to race directly, may be more liberal and thus more sensitive to racial inequality topics. Similarly, I would expect if at least one black author is included, racial inequality is more likely to be discussed, as opposed to an all-while author team. This may still increase the more black authors are part of the team. Similarly, for hispanic/other, this is a group that has historically experienced a lot of marginalization and may be particularly aware and motivated to discuss racial inequality in research papers. For white, I suspect that generally if an author is white then mentions of inequality related topics (including race) would be less likely either because they are less motivated to frame the paper around inequality. For the same reasons, I would also expect that the more racially diverse a team is, the more likely at least somebody in the author team is motivated to frame a paper around racial inequality."}, {"id": "senior-5", "name": "senior_contributor_ogh5x", "x": 0.3617509497264931, "y": 0.9199999999999999, "degree": 4, "words": 178, "explanation": "Rather than a general theory, the explanation is a set of specific explanations for predictors. Social science papers are more likely to discuss racial inequality because the social sciences are more concerned with all sorts of social phenomena, including race and gender inequality. Mentions of inequality in other papers or in the news can be thought of as base-rate measures of inequality discourse, and base rates would be expected to affect likelihood, with other papers being closest to what is being measured, though it is unclear why past mentions would not matter more. Author characteristics may also matter: minority authors are more likely to study inequality relevant to their race or ethnic group, although this is likely weaker than the other predictors across all the sciences. Black authors may be especially likely to focus on racial inequality because of the pre-eminence of anti-black discrimination in US history, and this would likely be stronger than the corresponding effect for Hispanic authors. Country-level racial diversity is also a reasonable predictor, although it may simply reflect a US versus non-US distinction."}, {"id": "senior-6", "name": "senior_contributor_ecdev", "x": 0.4987283838521399, "y": 0.08, "degree": 0, "words": 93, "explanation": "Racial inequality is more of a social science topic, so probably studied more in the social sciences. Black scholars tend to be interested in racial inequality because Black people tend to experience the poorest life outcomes on average and this reality has the most personal significance to Black scholars. Women are more progressive and more egalitarian, and thus care more about racial inequality and all kinds of inequality. More diverse countries have more exposure to racial inequality and thus care about it more. There is not a great explanation for the Asian predictor."}, {"id": "senior-7", "name": "senior_contributor_mxspa", "x": 0.19978907157497258, "y": 0.8800864534584826, "degree": 4, "words": 372, "explanation": "Social science is the strongest predictor because racial inequality as a research topic is almost exclusively within social science, making this the strongest structural filter. Female author share is also a positive predictor: female scholars may show solidarity across marginalised groups, making them more likely to engage with racial inequality research beyond their own-group interests, and they may also be more likely to work on topics that span gender and race. Country race diversity score positively predicts whether a paper discusses racial inequality because researchers inferred to come from racially diverse countries bring cross-cultural perspectives that motivate them to racial inequality as a research topic. Asian author share may also positively predict discussion of racial inequality; one plausible explanation is that Asian scholars working in Western academic institutions, where they constitute a visible minority, may be more attuned to racial dynamics and motivated to study them. Black author share positively predicts racial inequality discussion through own-group research effects, whereby scholars from minority race groups, especially in the USA, are more likely to study topics directly relevant to their own community experiences. Paper inequality mentions are theoretically meaningful because they reflect momentum within an academic field: when inequality discussions in the literature are already elevated, individual scholars are more likely to engage with it, both because it spurs their ideas but also because journals and reviewers become more receptive to such work. News inequality mentions are also theoretically meaningful because they capture the role of public discourse in shaping peoples research agendas: greater coverage of racial injustice, as in high-profile events like police killings in the US, motivates researchers to respond and thus increases the probability that papers published in subsequent years address such topics. However, the temporal features — paper and news inequality mentions — may perform less strongly relative to other features because their year-level rather than paper-level variation may weaken their performance. Authors' race diversity score may positively predict whether a paper discusses racial inequality, conditional on the other factors, because racially diverse teams may be more likely to coalesce around shared interest in race-related questions, and because this measure may also reflect more diverse collaborative networks which better position scholar to attract funding and publish work on these topics."}, {"id": "senior-8", "name": "senior_contributor_h1ror", "x": 0.15340196672879142, "y": 0.42786719645227805, "degree": 3, "words": 265, "explanation": "Discipline is a strong predictor of whether a paper concerns racial inequality. Racial inequality is a subject of study primarily in the social sciences, including economics, sociology, and social psychology, and social inequality, including racial inequality, is an area of study across a number of social science disciplines. It has less relevance to the natural sciences, and engineering and technology are likely to be less predictive than the natural or social sciences because papers in this area are broadly unlikely to address racial inequality, except to the extent that they address racial inequality in access to technology and other similar topics. Author demographics are also predictive of a paper's subject-matter, as research topics might be chosen based on their personal relevance to the author, and authors with more personal experience with racial inequality are more likely to engage in research in this area. This is most likely to be the case for authors who are directly affected by racial inequality, namely black authors. Being white is likely to be less predictive as whites likely dominate the author population, and therefore numerically may also constitute a large proportion of authors working on racial inequality, as well as any other topics. Being female may also have predictive power, both because women are more represente
